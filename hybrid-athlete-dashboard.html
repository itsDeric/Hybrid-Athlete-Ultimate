<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Athlete">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hybrid Athlete — Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0c;
  --ink:#111114;
  --white:#ffffff;
  --blue:#0a6cff;
  --blue-soft:#eaf1ff;
  --blue-dim:rgba(10,108,255,.12);
  --gray-50:#f7f7f9;
  --gray-100:#eeeef1;
  --gray-200:#e2e2e6;
  --gray-400:#9a9aa2;
  --gray-600:#5c5c64;
  --gray-800:#28282d;
  --green:#1fb15a;
  --amber:#c98a12;
  --red:#e0352b;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--gray-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--blue);color:#fff;}

/* ---------- Layout ---------- */
#app{display:flex;width:100%;min-height:100vh;}

.sidebar{
  width:224px;
  flex-shrink:0;
  background:var(--black);
  color:#fff;
  padding:24px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 22px 10px;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-dim);}
.brand-text{font-weight:800;font-size:14.5px;letter-spacing:-.02em;line-height:1.15;}
.brand-text span{display:block;font-weight:500;font-size:10.5px;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.navbtn{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:none;border:none;color:var(--gray-400);
  font-family:var(--sans);font-size:13.5px;font-weight:600;
  padding:9px 10px;border-radius:10px;cursor:pointer;
  transition:background .15s,color .15s;
}
.navbtn svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:var(--blue);color:#fff;}
.navbtn.active svg{opacity:1;}

.sidebar-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);}

.sync-box{padding:10px 10px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sync-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;margin-bottom:8px;}
.sync-btn{width:100%;background:#fff;color:var(--ink);border:none;border-radius:9px;padding:8px 10px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.sync-btn svg{width:14px;height:14px;}
.sync-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#fff;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-meta{font-size:10px;color:var(--gray-400);margin-top:3px;}
.sync-actions{display:flex;gap:6px;margin-top:8px;}
.sync-actions button{flex:1;background:rgba(255,255,255,.08);color:#fff;border:none;border-radius:7px;padding:6px;font-family:var(--sans);font-size:10.5px;font-weight:700;cursor:pointer;}
.sync-actions button:hover{background:rgba(255,255,255,.15);}
.countdown-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;}
.countdown-num{font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;margin-top:4px;}
.countdown-sub{font-size:11px;color:var(--gray-400);margin-top:1px;}

.main{flex:1;min-width:0;padding:36px 44px 80px;max-width:1180px;}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{margin-bottom:28px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;}
.page-sub{color:var(--gray-600);font-size:14px;margin-top:6px;max-width:640px;}

/* pulse line divider — signature motif */
.pulse{width:100%;height:22px;margin:26px 0;opacity:.55;}
.pulse path{fill:none;stroke:var(--blue);stroke-width:1.6;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g7{grid-template-columns:repeat(7,1fr);}
@media (max-width:900px){.g2,.g3,.g4,.g7{grid-template-columns:repeat(2,1fr);}}

.card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.card h3{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;}
.card .muted{color:var(--gray-600);font-size:12.5px;}

.stat-card{padding:18px 20px;}
.stat-label{font-size:11px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.06em;}
.stat-value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-value small{font-size:13px;font-weight:500;color:var(--gray-600);}

/* rings (overview signature element) */
.rings-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.ring-legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;}
.ring-legend .row{display:flex;align-items:center;gap:8px;}
.ring-legend .sw{width:9px;height:9px;border-radius:2px;}

/* progress bar */
.pbar{height:6px;border-radius:99px;background:var(--gray-100);overflow:hidden;margin-top:8px;}
.pbar > div{height:100%;border-radius:99px;background:var(--blue);}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--gray-200);}
td{padding:10px;border-bottom:1px solid var(--gray-100);}
tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--mono);}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.tag.blue{background:var(--blue-dim);color:var(--blue);}
.tag.gray{background:var(--gray-100);color:var(--gray-600);}
.tag.green{background:rgba(31,177,90,.12);color:var(--green);}
.tag.rest{background:var(--gray-800);color:#fff;}

/* week planner */
.day-card{padding:16px;min-height:150px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s, box-shadow .15s;}
.day-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
.day-card .dname{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);}
.day-card .dtitle{font-size:14.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.day-card .dsub{font-size:12px;color:var(--gray-600);margin-top:auto;}
.day-card.today{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue), var(--shadow);}
.day-card.rest{background:var(--black);color:#fff;}
.day-card.rest .dname{color:var(--gray-400);}
.day-card.rest .dsub{color:var(--gray-400);}

.icon-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-dim);}
.icon-chip svg{width:16px;height:16px;color:var(--blue);}

/* tabs (sub-nav within a view) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.subtab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--gray-600);}
.subtab.active{background:var(--black);color:#fff;border-color:var(--black);}

.pane{display:none;}
.pane.active{display:block;}

/* buttons/forms */
.btn{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn.secondary{background:var(--black);}
.btn.ghost{background:var(--gray-100);color:var(--ink);}
input,select{font-family:var(--sans);font-size:13px;border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
.field label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--gray-600);margin-bottom:4px;}

/* checkbox pill list */
.check-list{display:flex;flex-direction:column;gap:2px;}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer;user-select:none;}
.check-item:last-child{border-bottom:none;}
.check-box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--gray-200);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.check-box.done{background:var(--blue);border-color:var(--blue);}
.check-box svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .1s;}
.check-box.done svg{opacity:1;}
.check-item span.label{font-size:13.5px;font-weight:500;}
.check-item.done span.label{color:var(--gray-400);text-decoration:line-through;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--gray-200);}
.tl-item{position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);}
.tl-item.done .tl-dot{background:var(--blue);}
.tl-month{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--blue);letter-spacing:.06em;}
.tl-title{font-size:15px;font-weight:700;margin:3px 0 6px;}
.tl-goals{font-size:12.5px;color:var(--gray-600);}

/* habit heatmap-ish grid */
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.hcell{aspect-ratio:1;border-radius:6px;background:var(--gray-100);}

footer.printnote{margin-top:60px;padding-top:18px;border-top:1px solid var(--gray-200);font-size:11.5px;color:var(--gray-400);}

/* cheat sheet */
.sheet{background:var(--black);color:#fff;border-radius:20px;padding:26px 28px;}
.sheet h2{font-size:20px;font-weight:800;}
.sheet .sub{color:var(--gray-400);font-size:12.5px;margin-top:2px;}
.sheet-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px;}
.sheet-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;}
.sheet-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);font-weight:700;margin-bottom:10px;}
.sheet-block .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
.sheet-block .row:last-child{border-bottom:none;}
.sheet-block .row .v{font-family:var(--mono);color:var(--blue);font-weight:600;}

@media print{
  .sidebar{display:none;}
  .main{padding:0;max-width:100%;}
  .view{display:none !important;}
  #print-cheat{display:block !important;}
}

/* responsive */
@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:14px;}
  .brand{padding:4px 8px;width:100%;}
  .sidebar-foot{display:none;}
  .main{padding:22px 18px 60px;}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr;}
  .sheet-grid{grid-template-columns:1fr;}
}
/* Onboarding overlay */
.onboard-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(10,10,12,.72);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:fade .25s ease;
}
.onboard-card{
  background:#fff;border-radius:20px;max-width:760px;width:100%;
  max-height:88vh;overflow-y:auto;
  padding:32px 32px 26px;
}
.onboard-head{margin-bottom:22px;}
.onboard-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}
.onboard-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.onboard-head p{color:var(--gray-600);font-size:13.5px;margin-top:6px;}
.onboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (max-width:640px){.onboard-grid{grid-template-columns:1fr;}}
.onboard-option{
  text-align:left;border:1.5px solid var(--gray-200);border-radius:14px;
  background:#fff;padding:14px 16px;cursor:pointer;font-family:var(--sans);
  transition:border-color .12s, box-shadow .12s;
}
.onboard-option:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(10,108,255,.1);}
.onboard-option .oname{font-size:14px;font-weight:700;}
.onboard-option .odesc{font-size:12px;color:var(--gray-600);margin-top:4px;line-height:1.5;}
.onboard-option.build-own{background:var(--black);border-color:var(--black);}
.onboard-option.build-own .oname{color:#fff;}
.onboard-option.build-own .odesc{color:var(--gray-400);}
.onboard-skip{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:var(--sans);text-decoration:underline;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ SIDEBAR ============ -->
  <nav class="sidebar">
    <div class="brand">
      <div class="dot"></div>
      <div class="brand-text">Hybrid Athlete<span>Training System</span></div>
    </div>
    <div id="navlist"></div>
    <div class="sync-box" id="syncBox">
      <div class="sync-label">Cloud Backup</div>
      <button class="sync-btn" id="syncSignInBtn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
      <div class="sync-status" id="syncStatus" style="display:none;">
        <div class="sync-dot" id="syncDot"></div>
        <div>
          <div id="syncStatusText">Synced</div>
          <div class="sync-meta" id="syncMeta"></div>
        </div>
      </div>
      <div class="sync-actions" id="syncActions" style="display:none;">
        <button id="syncNowBtn">Sync Now</button>
        <button id="syncOutBtn">Sign Out</button>
      </div>
    </div>
    <div class="sidebar-foot">
      <div class="countdown-label">30km Goal — Jan 1</div>
      <div class="countdown-num" id="countdownNum">—</div>
      <div class="countdown-sub" id="countdownSub">days remaining</div>
    </div>
  </nav>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main"></main>
</div>

<script>
/* ============================================================
   ICONS — minimal line set, 24x24
============================================================ */
const ICONS = {
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/></svg>',

  recovery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14a8 8 0 1 1-6-11.6 6.3 6.3 0 0 0 6 11.6z"/></svg>',
  timeline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="1.8" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.8" fill="currentColor" stroke="none"/></svg>',
  habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5l4 4 10-10"/></svg>',
  trackers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M12 19V4M20 19v-7"/></svg>',
  cheat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12.5l4.5 4.5L20 6"/></svg>',
  water:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3s6 6.5 6 11a6 6 0 1 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"/></svg>',
  pill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="8.5" width="16" height="7" rx="3.5"/><path d="M12 8.5v7"/></svg>',
  mountain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 19l6-10 4 6 2-3 6 7z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M5 6H3v2a4 4 0 0 0 4 4M19 6h2v2a4 4 0 0 1-4 4M9 19h6M12 14v5"/></svg>',

/* ============================================================
   STORAGE HELPERS — uses the browser's own localStorage,
   so all data (weights, PRs, habits) lives on this device only,
   with no Claude account or internet connection required.
============================================================ */
const LS_PREFIX = 'hybrid-athlete:';
async function getJSON(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function setJSON(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){
    console.error('Storage failed — your browser may have local storage disabled or full.', e);
  }
  scheduleCloudPush();
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   GOOGLE DRIVE CLOUD SYNC
   Backs up all local data to a single JSON file in the user's
   own Google Drive (App Data — only files this app created).
============================================================ */
const DRIVE_CLIENT_ID = '415878873964-nnapt11kaudg8kg7sm7iibbkvu6ukpp2.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME = 'hybrid-athlete-data.json';
let DRIVE_TOKEN = null;
let DRIVE_FILE_ID = null;
let DRIVE_TOKEN_CLIENT = null;
let cloudPushTimer = null;

function driveApiHeaders(extra){
  return Object.assign({ 'Authorization': 'Bearer ' + DRIVE_TOKEN }, extra||{});
}

function setSyncUI(state, meta){
  const btn = document.getElementById('syncSignInBtn');
  const status = document.getElementById('syncStatus');
  const actions = document.getElementById('syncActions');
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncStatusText');
  const metaEl = document.getElementById('syncMeta');
  if(!btn) return;
  if(state === 'signed-out'){
    btn.style.display = 'flex';
    status.style.display = 'none';
    actions.style.display = 'none';
  } else {
    btn.style.display = 'none';
    status.style.display = 'flex';
    actions.style.display = 'flex';
    dot.classList.toggle('syncing', state === 'syncing');
    text.textContent = state === 'syncing' ? 'Syncing…' : 'Synced to Drive';
    if(meta) metaEl.textContent = meta;
  }
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: driveApiHeaders()
  });
  const data = await res.json();
  return (data.files && data.files.length) ? data.files[0].id : null;
}

async function driveCreateFile(contentObj){
  const boundary = 'ha_sync_boundary_9231';
  const delimiter = "\r\n--" + boundary + "\r\n";
  const closeDelim = "\r\n--" + boundary + "--";
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const body = delimiter +
    'Content-Type: application/json\r\n\r\n' + JSON.stringify(metadata) +
    delimiter +
    'Content-Type: application/json\r\n\r\n' + JSON.stringify(contentObj) +
    closeDelim;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: driveApiHeaders({ 'Content-Type': 'multipart/related; boundary="' + boundary + '"' }),
    body
  });
  const data = await res.json();
  return data.id;
}

async function driveUpdateFile(fileId, contentObj){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: driveApiHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(contentObj)
  });
}

async function driveGetFileContent(fileId){
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: driveApiHeaders()
    });
    const text = await res.text();
    return text ? JSON.parse(text) : {};
  }catch(e){ return {}; }
}

function collectLocalSnapshot(){
  const snap = {};
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith(LS_PREFIX)){
      try{ snap[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  });
  return snap;
}

async function driveInitialSync(){
  setSyncUI('syncing');
  DRIVE_FILE_ID = await driveFindFile();
  const localSnap = collectLocalSnapshot();
  const hasLocal = Object.keys(localSnap).length > 0;

  if(!DRIVE_FILE_ID){
    // No cloud file yet — create it from whatever's on this device (or empty if nothing)
    DRIVE_FILE_ID = await driveCreateFile(localSnap);
  } else {
    const remote = await driveGetFileContent(DRIVE_FILE_ID);
    // Merge: cloud data wins for matching keys; anything local-only gets kept and pushed up too
    Object.keys(localSnap).forEach(k=>{ if(!(k in remote)) remote[k] = localSnap[k]; });
    Object.keys(remote).forEach(k=>{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(remote[k])); });
    await driveUpdateFile(DRIVE_FILE_ID, remote);
  }
  await setJSON('drive-signed-in', true);
  setSyncUI('synced', 'Last synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  buildMain();
  showView('overview');
}

async function drivePushNow(){
  if(!DRIVE_TOKEN || !DRIVE_FILE_ID) return;
  setSyncUI('syncing');
  await driveUpdateFile(DRIVE_FILE_ID, collectLocalSnapshot());
  setSyncUI('synced', 'Last synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
}

function scheduleCloudPush(){
  if(!DRIVE_TOKEN || !DRIVE_FILE_ID) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(drivePushNow, 1800);
}

function driveSignIn(){
  if(!window.google || !google.accounts){
    alert('Google sign-in is still loading — try again in a moment.');
    return;
  }
  if(!DRIVE_TOKEN_CLIENT){
    DRIVE_TOKEN_CLIENT = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if(resp && resp.access_token){
          DRIVE_TOKEN = resp.access_token;
          await driveInitialSync();
        }
      }
    });
  }
  DRIVE_TOKEN_CLIENT.requestAccessToken({ prompt: 'consent' });
}

function driveSignOut(){
  DRIVE_TOKEN = null;
  DRIVE_FILE_ID = null;
  setJSON('drive-signed-in', false);
  setSyncUI('signed-out');
}

function wireSyncButtons(){
  document.getElementById('syncSignInBtn').addEventListener('click', driveSignIn);
  document.getElementById('syncNowBtn').addEventListener('click', drivePushNow);
  document.getElementById('syncOutBtn').addEventListener('click', driveSignOut);
}

/* ---------- PROGRAM BUILDER ---------- */
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function blankProgram(name){
  const days = {};
  DAY_NAMES.forEach(d=> days[d] = {type:'rest', exercises:[]});
  return { id: 'p_'+Date.now(), name: name||'New Program', tag:'Custom', days };
}
let PB_STATE = { editingId: null, activeDay: 'Monday' };

async function renderPrograms(){
  const el = document.getElementById('view-programs');
  const programs = await getJSON('custom-programs', []);
  const activeId = await getJSON('active-program', null);

  if(PB_STATE.editingId){
    return renderProgramEditor(el, programs);
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Build Your Own</div>
      <div class="page-title">Program Builder</div>
      <div class="page-sub">Hybrid Athlete is one built-in program. Start from a well-researched routine below, or build a fully custom one by naming it and filling each day from the exercise library.</div>
    </div>

    <div class="card" style="margin-bottom:14px;${activeId===null?'box-shadow:0 0 0 1.5px var(--blue), var(--shadow);':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <h3>Hybrid Athlete <span class="tag blue" style="margin-left:6px;">Built-in preset</span> ${activeId===null?'<span class="tag green" style="margin-left:4px;">Active</span>':''}</h3>
          <p class="muted" style="margin-top:4px;">The 5-month gym + running program already loaded in your Overview, Gym, and Running tabs.</p>
        </div>
        <div style="display:flex;gap:8px;">
          ${activeId!==null?`<button class="btn secondary" data-setactive="__builtin__">Set Active</button>`:''}
        </div>
      </div>
    </div>

    <h3 style="font-size:16px;margin-bottom:12px;">Proven Routines</h3>
    <div class="grid g2" style="margin-bottom:14px;">
      ${PRESET_TEMPLATES.map((t,i)=>`
        <div class="card">
          <h3>${t.name}</h3>
          <p class="muted" style="margin-top:4px;">${t.desc||''}</p>
          <button class="btn ghost" style="margin-top:12px;" data-usetemplate="${i}">Use This Routine</button>
        </div>`).join('')}
    </div>

    ${pulseLine()}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="font-size:16px;">Your Custom Programs</h3>
      <button class="btn" id="pbNew">${ICONS.plus} New Program</button>
    </div>

    <div class="grid g2" id="pbList"></div>
  `;

  document.getElementById('pbNew').addEventListener('click', ()=>{
    PB_STATE.editingId = '__new__';
    PB_STATE.activeDay = 'Monday';
    renderPrograms();
  });
  el.querySelectorAll('[data-usetemplate]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const t = PRESET_TEMPLATES[parseInt(b.dataset.usetemplate)];
      const prog = blankProgram(t.name);
      prog.tag = t.tag;
      if(t.meta) prog.meta = JSON.parse(JSON.stringify(t.meta));
      Object.keys(t.days).forEach(d=>{
        prog.days[d] = { type:t.days[d].type, exercises: t.days[d].exercises.map(e=>({...e})) };
      });
      const list = await getJSON('custom-programs', []);
      list.push(prog);
      await setJSON('custom-programs', list);
      PB_STATE.editingId = prog.id;
      PB_STATE.activeDay = 'Monday';
      renderPrograms();
    });
  });
  el.querySelectorAll('[data-setactive]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const v = b.dataset.setactive;
      await setJSON('active-program', v==='__builtin__' ? null : v);
      renderPrograms();
      renderWeek();
      renderOverview();
      renderRecovery();
      renderNutrition();
      renderTimeline();
      renderCheat();
    });
  });

  const list = document.getElementById('pbList');
  if(!programs.length){
    list.innerHTML = `<div class="card muted" style="grid-column:1/-1;">No custom programs yet — start from a routine above, or click "New Program".</div>`;
  } else {
    list.innerHTML = programs.map(p=>{
      const trainDays = DAY_NAMES.filter(d=>p.days[d] && p.days[d].type==='training').length;
      const exCount = DAY_NAMES.reduce((n,d)=> n + (p.days[d]?.exercises?.length||0), 0);
      const isActive = activeId === p.id;
      return `<div class="card" style="${isActive?'box-shadow:0 0 0 1.5px var(--blue), var(--shadow);':''}">
        <h3>${p.name} <span class="tag gray" style="margin-left:6px;">${p.tag}</span> ${isActive?'<span class="tag green" style="margin-left:4px;">Active</span>':''}</h3>
        <p class="muted" style="margin-top:4px;">${trainDays} training day${trainDays===1?'':'s'} · ${exCount} exercise${exCount===1?'':'s'} total</p>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button class="btn ghost" data-edit="${p.id}">Edit</button>
          ${!isActive?`<button class="btn secondary" data-setactive="${p.id}">Set Active</button>`:''}
          <button class="btn" style="background:var(--red);" data-del="${p.id}">${ICONS.trash} Delete</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
      PB_STATE.editingId = b.dataset.edit; PB_STATE.activeDay='Monday'; renderPrograms();
    }));
    list.querySelectorAll('[data-setactive]').forEach(b=>b.addEventListener('click', async ()=>{
      await setJSON('active-program', b.dataset.setactive);
      renderPrograms(); renderWeek(); renderOverview(); renderRecovery(); renderNutrition(); renderTimeline(); renderCheat();
    }));
    list.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(b.dataset.confirming !== '1'){
          b.dataset.confirming = '1';
          const original = b.innerHTML;
          b.innerHTML = 'Tap again to confirm';
          const revert = ()=>{ if(b.dataset.confirming==='1'){ b.dataset.confirming='0'; b.innerHTML = original; } };
          b._revertTimer = setTimeout(revert, 3000);
          return;
        }
        clearTimeout(b._revertTimer);
        let arr = await getJSON('custom-programs', []);
        arr = arr.filter(p=>p.id!==b.dataset.del);
        await setJSON('custom-programs', arr);
        const active = await getJSON('active-program', null);
        if(active === b.dataset.del) await setJSON('active-program', null);
        renderPrograms();
        renderWeek();
        renderOverview();
        renderRecovery();
        renderNutrition();
        renderTimeline();
        renderCheat();
      });
    });
  }
}

function renderProgramEditor(el, programs){
  const isNew = PB_STATE.editingId === '__new__';
  const prog = isNew ? blankProgram('') : programs.find(p=>p.id===PB_STATE.editingId);
  if(!prog){ PB_STATE.editingId=null; return renderPrograms(); }
  const day = PB_STATE.activeDay;
  const dayData = prog.days[day];

  const categoryOptions = Object.keys(EXERCISE_LIBRARY).map(c=>`<option value="${c}">${c}</option>`).join('');

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">${isNew?'New Program':'Editing Program'}</div>
      <div class="page-title" style="display:flex;align-items:center;gap:10px;">
        <input id="pbName" value="${prog.name.replace(/"/g,'&quot;')}" placeholder="Program name" style="font-size:22px;font-weight:800;border:none;background:transparent;padding:2px 0;border-bottom:2px solid var(--gray-200);">
      </div>
      <div class="page-sub">Pick a day, mark it Training or Rest, then pull exercises in from the library with sets, reps, and load.</div>
    </div>

    <div class="subtabs" id="pbDayTabs">${DAY_NAMES.map(d=>`<button class="subtab ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}${prog.days[d].type==='training'?' •':''}</button>`).join('')}</div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h3>${day}</h3>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;">
          <input type="checkbox" id="pbTrainToggle" ${dayData.type==='training'?'checked':''} style="width:16px;height:16px;">
          Training day
        </label>
      </div>

      <div id="pbDayBody" style="margin-top:14px;${dayData.type==='training'?'':'display:none;'}">
        <table id="pbExTable" style="margin-bottom:14px;">
          <thead><tr><th>Exercise</th><th class="num">Sets</th><th class="num">Reps</th><th class="num">Working Weight</th><th></th></tr></thead>
          <tbody>${dayData.exercises.map((e,i)=>`
            <tr>
              <td>${e.name}</td>
              <td class="num"><input type="text" data-field="sets" data-i="${i}" value="${e.sets}" style="width:50px;text-align:right;"></td>
              <td class="num"><input type="text" data-field="reps" data-i="${i}" value="${e.reps}" style="width:60px;text-align:right;"></td>
              <td class="num"><input type="text" data-field="load" data-i="${i}" value="${e.load||''}" placeholder="kg" style="width:60px;text-align:right;"></td>
              <td class="num"><button class="btn ghost" data-removeex="${i}" style="padding:5px 9px;">${ICONS.trash}</button></td>
            </tr>`).join('') || `<tr><td colspan="5" class="muted">No exercises added yet — pull one in below.</td></tr>`}
          </tbody>
        </table>

        <div class="form-row" style="margin-bottom:0;">
          <div class="field"><label>Category</label><select id="pbCategory">${categoryOptions}</select></div>
          <div class="field"><label>Exercise</label><select id="pbExercise"></select></div>
          <div class="field"><label>Or custom name</label><input id="pbCustomName" placeholder="Type your own" style="width:150px;"></div>
          <button class="btn" id="pbAddEx">${ICONS.plus} Add to ${day}</button>
        </div>
      </div>
    </div>

    ${pulseLine()}
    <div style="display:flex;gap:10px;">
      <button class="btn" id="pbSave">Save Program</button>
      <button class="btn ghost" id="pbCancel">Cancel</button>
    </div>
  `;

  function populateExerciseSelect(){
    const cat = document.getElementById('pbCategory').value;
    const sel = document.getElementById('pbExercise');
    sel.innerHTML = EXERCISE_LIBRARY[cat].map(x=>`<option value="${x}">${x}</option>`).join('');
  }
  populateExerciseSelect();
  document.getElementById('pbCategory').addEventListener('change', populateExerciseSelect);

  document.getElementById('pbDayTabs').querySelectorAll('.subtab').forEach(t=>{
    t.addEventListener('click', ()=>{ PB_STATE.activeDay = t.dataset.day; commitLocalEdits(); renderProgramEditor(el, mergeProgIntoList(programs, prog)); });
  });

  document.getElementById('pbTrainToggle').addEventListener('change', (e)=>{
    dayData.type = e.target.checked ? 'training' : 'rest';
    document.getElementById('pbDayBody').style.display = dayData.type==='training' ? '' : 'none';
    document.getElementById('pbDayTabs').querySelector(`[data-day="${day}"]`).innerHTML = day.slice(0,3) + (dayData.type==='training' ? ' •' : '');
  });

  document.getElementById('pbAddEx').addEventListener('click', ()=>{
    const custom = document.getElementById('pbCustomName').value.trim();
    const name = custom || document.getElementById('pbExercise').value;
    if(!name) return;
    dayData.exercises.push({ name, sets:3, reps:'10', load:'' });
    renderProgramEditor(el, mergeProgIntoList(programs, prog));
  });

  el.querySelectorAll('[data-removeex]').forEach(b=>{
    b.addEventListener('click', ()=>{
      dayData.exercises.splice(parseInt(b.dataset.removeex),1);
      renderProgramEditor(el, mergeProgIntoList(programs, prog));
    });
  });

  el.querySelectorAll('#pbExTable input[data-field]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = parseInt(inp.dataset.i);
      dayData.exercises[i][inp.dataset.field] = inp.value;
    });
  });

  function commitLocalEdits(){
    prog.name = document.getElementById('pbName').value.trim() || 'Untitled Program';
  }

  document.getElementById('pbSave').addEventListener('click', async ()=>{
    commitLocalEdits();
    let arr = await getJSON('custom-programs', []);
    const idx = arr.findIndex(p=>p.id===prog.id);
    if(idx>=0) arr[idx]=prog; else arr.push(prog);
    await setJSON('custom-programs', arr);
    PB_STATE.editingId = null;
    renderPrograms();
    renderWeek();
    renderOverview();
    renderRecovery();
    renderNutrition();
    renderTimeline();
    renderCheat();
  });
  document.getElementById('pbCancel').addEventListener('click', ()=>{
    PB_STATE.editingId = null;
    renderPrograms();
  });
}
function mergeProgIntoList(programs, prog){
  const copy = programs.slice();
  const idx = copy.findIndex(p=>p.id===prog.id);
  if(idx>=0) copy[idx]=prog; else copy.push(prog);
  return copy;
}


async function renderWeek(){

      return `<div class="card day-card ${isToday?'today':''} ${isTrain?'':'rest'}" data-jumpprog="${d}">

      c.addEventListener('click',()=>{
        GYM_STATE.activeDay = day;
        showView('gym');

    });
  } else {

        <div class="dname">${d.day.slice(0,3)}</div>

        <div class="dsub">${d.type==='run'?'Running':d.type==='gym'?'Gym':'Gym + Run'}</div>
      </div>`;
    }).join('');
    grid.querySelectorAll('[data-jump]').forEach(c=>c.addEventListener('click',()=>{
      if(c.dataset.jump==='gym') GYM_STATE.activeDay = c.dataset.day;
      showView(c.dataset.jump);
      renderGym();
    }));
  }
}

/* ---------- GYM ---------- */
let GYM_STATE = { activeDay: null };
async function renderGym(){
  const el = document.getElementById('view-gym');
  const activeId = await getJSON('active-program', null);
  if(activeId){
    const custom = await getJSON('custom-programs', []);
    const activeProg = custom.find(p=>p.id===activeId);
    if(activeProg) return renderProgramSession(el, activeProg);
  }
  return renderBuiltinGym(el);
}

async function renderBuiltinGym(el){
  const days = Object.keys(GYM);
  const weights = await getJSON('gym-weights', {});
  const startDay = (GYM_STATE.activeDay && days.includes(GYM_STATE.activeDay)) ? GYM_STATE.activeDay : days[0];
  GYM_STATE.activeDay = null;
  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">4× Weekly</div>
      <div class="page-title">Gym Dashboard</div>
      <div class="page-sub">Keep 1–2 reps in reserve on every set. Add weight only once every prescribed rep is hit with clean form.</div>
    </div>
    <div class="subtabs" id="gymTabs">${days.map((d)=>`<button class="subtab ${d===startDay?'active':''}" data-d="${d}">${d}</button>`).join('')}</div>
    <div id="gymPanes"></div>
    ${pulseLine()}
    <div class="grid g2">
      <div class="card">
        <h3>Warm-up — Every Session</h3>
        <div class="check-list" style="margin-top:8px;">
          ${['5–10 min cardio','Dynamic mobility','2–3 warm-up sets'].map(t=>`<div class="check-item" style="cursor:default;"><div class="check-box done">${ICONS.check}</div><span class="label">${t}</span></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <h3>Progressive Overload</h3>
        <p class="muted" style="margin-top:6px;line-height:1.6;">Increase load once all prescribed reps are hit with proper form. Keep 1–2 reps in reserve — avoid failure except on the final isolation set.</p>
      </div>
    </div>
  `;
  const panes = document.getElementById('gymPanes');
  function slug(day, name){ return day+'::'+name.replace(/\s+/g,'_'); }
  panes.innerHTML = days.map((d)=>`
    <div class="pane ${d===startDay?'active':''}" data-pane="${d}">
      <div class="card">
        <h3>${GYM[d].title} <span class="tag gray" style="margin-left:6px;">${GYM[d].exercises.length} exercises</span></h3>
        <table style="margin-top:10px;">
          <thead><tr><th>Exercise</th><th class="num">Sets</th><th class="num">Reps</th><th class="num">Working Weight</th></tr></thead>
          <tbody>${GYM[d].exercises.map(e=>{
            const key = slug(d, e[0]);
            const val = weights[key] || '';
            return `<tr><td>${e[0]}</td><td class="num">${e[1]}</td><td class="num">${e[2]}</td>
              <td class="num"><input type="number" step="0.5" placeholder="kg" data-wkey="${key}" value="${val}" style="width:72px;text-align:right;"></td></tr>`;
          }).join('')}</tbody>
        </table>
        ${GYM[d].cut && GYM[d].cut.length ? `<p class="muted" style="margin-top:12px;line-height:1.6;"><b>Skip by default —</b> add only if the session feels short and you have extra time: ${GYM[d].cut.map(c=>c.split(' — ')[0]).join(', ')}.</p>` : ''}
      </div>
    </div>`).join('');
  panes.querySelectorAll('input[data-wkey]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const w = await getJSON('gym-weights', {});
      w[inp.dataset.wkey] = inp.value;
      await setJSON('gym-weights', w);
    });
  });
  document.getElementById('gymTabs').querySelectorAll('.subtab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.getElementById('gymTabs').querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      panes.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===t.dataset.d));
    });
  });
}

  }
  paintP();
  document.getElementById('pAdd').addEventListener('click', async ()=>{
    const date = document.getElementById('pDate').value || todayKey();
    const ex = document.getElementById('pEx').value; const w = document.getElementById('pW').value; const r = document.getElementById('pR').value;
    if(!ex||!w) return;
    pLog.push({date, ex, w, r}); await setJSON('pr-log', pLog); paintP();
  });

  // Pace
  let rLog = await getJSON('pace-log', []);
  function paintR(){
    document.getElementById('rBody').innerHTML = rLog.slice().reverse().map(r=>`<tr><td>${r.date}</td><td class="num">${r.dist} km</td><td class="num">${r.time} min</td><td class="num">${(r.time/r.dist).toFixed(2)}</td></tr>`).join('') || `<tr><td colspan="4" class="muted">No entries yet</td></tr>`;
  }
  paintR();
  document.getElementById('rAdd').addEventListener('click', async ()=>{
    const date = document.getElementById('rDate').value || todayKey();
    const dist = parseFloat(document.getElementById('rDist').value); const time = parseFloat(document.getElementById('rTime').value);
    if(!dist||!time) return;
    rLog.push({date, dist, time}); await setJSON('pace-log', rLog); paintR();
  });
}

/* ---------- CHEAT SHEET ---------- */
async function renderCheat(){
  const el = document.getElementById('view-cheat');
  const profile = await getJSON('profile', {weight:72});
  const w = profile.weight;
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  const habitState = await getJSON('habits:'+todayKey(), {});

  const activeId = await getJSON('active-program', null);
  let sheetTitle, sessionHTML, activeProg = null;
  if(activeId){
    const custom = await getJSON('custom-programs', []);
    activeProg = custom.find(p=>p.id===activeId);
    const dayData = activeProg ? activeProg.days[todayName] : null;
    sheetTitle = activeProg ? activeProg.name : 'Full Rest Day';
    if(!dayData || dayData.type==='rest'){
      sessionHTML = `<div class="row"><span>Focus</span><span class="v">Full recovery</span></div>`;
    } else {
      sessionHTML = dayData.exercises.map(e=>`<div class="row"><span>${e.name}</span><span class="v">${e.sets}×${e.reps}${e.load?' @ '+e.load:''}</span></div>`).join('') || `<div class="row"><span>Focus</span><span class="v">Training day — no exercises added yet</span></div>`;
    }
  } else {
    const plan = WEEK_PLAN.find(d=>d.day===todayName) || {title:'Full Rest Day', type:'rest'};
    sheetTitle = plan.title;
    if(plan.type==='gym' || plan.type==='both'){
      const gymDay = GYM[todayName];
      if(gymDay){
        const weights = await getJSON('gym-weights', {});
        sessionHTML = gymDay.exercises.map(e=>{
          const key = todayName+'::'+e[0].replace(/\s+/g,'_');
          const w = weights[key];
          return `<div class="row"><span>${e[0]}</span><span class="v">${e[1]}×${e[2]}${w?' @ '+w+'kg':''}</span></div>`;
        }).join('');
        if(plan.type==='both') sessionHTML += `<div class="row"><span>+ Recovery Run</span><span class="v">20-30 min</span></div>`;
      } else {
        sessionHTML = `<div class="row"><span>Type</span><span class="v">Gym</span></div>`;
      }
    } else if(plan.type==='run'){
      sessionHTML = `<div class="row"><span>Type</span><span class="v">Running</span></div>
       <div class="row"><span>Warm-up</span><span class="v">5–10 min brisk walk</span></div>`;
    } else {
      sessionHTML = `<div class="row"><span>Focus</span><span class="v">Full recovery</span></div>`;
    }
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">At A Glance</div>
      <div class="page-title">Daily Cheat Sheet</div>
      <div class="page-sub">Everything for today, one screen — built for printing or a quick morning check.</div>
    </div>
    <div class="sheet">
      <h2>${todayName}</h2>
      <div class="sub">${sheetTitle}</div>
      <div class="sheet-grid">
        <div class="sheet-block">
          <h4>Session</h4>
          ${sessionHTML}
        </div>
        <div class="sheet-block">
          <h4>Nutrition Targets</h4>
          <div class="row"><span>Protein</span><span class="v">${(w*1.8).toFixed(0)}–${(w*2.2).toFixed(0)} g</span></div>
          <div class="row"><span>Carbs</span><span class="v">${(w*4).toFixed(0)}–${(w*6).toFixed(0)} g</span></div>
          <div class="row"><span>Fat</span><span class="v">${(w*0.8).toFixed(0)}–${(w*1).toFixed(0)} g</span></div>
          <div class="row"><span>Creatine</span><span class="v">5 g</span></div>
        </div>
        <div class="sheet-block">
          <h4>Today's Habits</h4>
          ${HABITS.map(h=>`<div class="row"><span>${h.label}</span><span class="v">${habitState[h.id]?'✓':'—'}</span></div>`).join('')}
        </div>
        <div class="sheet-block">
          <h4>Reminders</h4>
          ${activeProg && activeProg.meta ? `
          <div class="row"><span>Duration</span><span class="v">${activeProg.meta.duration||'—'}</span></div>
          <div class="row"><span>Rest</span><span class="v">${activeProg.meta.restNotes||'—'}</span></div>
          <div class="row"><span>Phase</span><span class="v">${activeProg.meta.phase||'—'}</span></div>
          ${activeProg.meta.keepInMind && activeProg.meta.keepInMind[0] ? `<div class="row"><span>Tip</span><span class="v" style="text-align:right;max-width:60%;">${activeProg.meta.keepInMind[0].split(' — ')[0]}</span></div>` : ''}
          ` : `
          <div class="row"><span>Sleep</span><span class="v">7.5–9 hrs</span></div>
          <div class="row"><span>Water</span><span class="v">On track</span></div>
          <div class="row"><span>Goal Run</span><span class="v">30 km — Jan 1</span></div>
          `}
        </div>
      </div>
    </div>
    ${pulseLine()}
    <div class="card">
      <h3>Print This Page</h3>
      <p class="muted" style="margin-top:6px;">Use your browser's print function (Ctrl/Cmd + P) — the layout is set up to print cleanly for a daily reference sheet or planner insert.</p>
      <button class="btn" style="margin-top:12px;" onclick="window.print()">Print Cheat Sheet</button>
    </div>
  `;
}

/* ============================================================
   COUNTDOWN
============================================================ */
function renderCountdown(){
  const now = new Date();
  let target = new Date(now.getFullYear()+ (now.getMonth()===0 && now.getDate()===1 ? 0 : (now>=new Date(now.getFullYear(),0,1)?1:0)), 0, 1);
  // simplest robust logic: next Jan 1 strictly after today
  target = new Date(now.getFullYear()+1, 0, 1);
  if(now.getMonth()===0 && now.getDate()===1) target = now;
  const diffDays = Math.max(0, Math.ceil((target - now)/86400000));
  document.getElementById('countdownNum').textContent = diffDays;
}

/* ============================================================
   FIRST-RUN ONBOARDING
============================================================ */
async function maybeShowOnboarding(){
  const done = await getJSON('onboarded', false);
  if(done) return;

  // Safety net: if there's any sign of prior use, this isn't a first run —
  // back-fill the flag instead of interrupting an existing user.
  const existingPrograms = await getJSON('custom-programs', []);
  const existingProfile = await getJSON('profile', null);
  const existingActive = await getJSON('active-program', 'unset');
  const hasPriorActivity = (existingPrograms && existingPrograms.length > 0)
    || (existingProfile !== null)
    || (existingActive !== 'unset');
  if(hasPriorActivity){
    await setJSON('onboarded', true);
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'onboard-overlay';
  overlay.id = 'onboardOverlay';

  const options = [
    { key:'__builtin__', name:'Hybrid Athlete', desc:'5-month gym + running program — build a lean athletic physique and finish a 30 km run.' },
    ...PRESET_TEMPLATES.map((t,i)=>({ key:'__template__'+i, name:t.name, desc:t.desc||'' })),
  ];

  overlay.innerHTML = `
    <div class="onboard-card">
      <div class="onboard-head">
        <div class="eyebrow">Welcome</div>
        <h2>What are you training for?</h2>
        <p>Pick a program to start with — you can switch or build your own any time from Program Builder.</p>
      </div>
      <div class="onboard-grid">
        ${options.map(o=>`
          <button class="onboard-option" data-choose="${o.key}">
            <div class="oname">${o.name}</div>
            <div class="odesc">${o.desc}</div>
          </button>`).join('')}
        <button class="onboard-option build-own" data-choose="__custom__">
          <div class="oname">${ICONS.plus} Build My Own</div>
          <div class="odesc">Start from scratch in Program Builder — name it, pick days, add exercises.</div>
        </button>
      </div>
      <button class="onboard-skip" id="onboardSkip">Skip for now</button>
    </div>
  `;
  document.body.appendChild(overlay);

  async function finishOnboarding(){
    await setJSON('onboarded', true);
    overlay.remove();
  }

  overlay.querySelectorAll('[data-choose]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const choice = btn.dataset.choose;
      if(choice === '__builtin__'){
        await setJSON('active-program', null);
      } else if(choice === '__custom__'){
        await finishOnboarding();
        PB_STATE.editingId = '__new__';
        PB_STATE.activeDay = 'Monday';
        showView('programs');
        renderPrograms();
        return;
      } else if(choice.startsWith('__template__')){
        const idx = parseInt(choice.replace('__template__',''));
        const t = PRESET_TEMPLATES[idx];
        const prog = blankProgram(t.name);
        prog.tag = t.tag;
        if(t.meta) prog.meta = JSON.parse(JSON.stringify(t.meta));
        Object.keys(t.days).forEach(d=>{
          prog.days[d] = { type:t.days[d].type, exercises: t.days[d].exercises.map(e=>({...e})) };
        });
        const list = await getJSON('custom-programs', []);
        list.push(prog);
        await setJSON('custom-programs', list);
        await setJSON('active-program', prog.id);
      }
      await finishOnboarding();
      renderOverview();
      renderWeek();
      renderPrograms();
      renderRecovery();
      renderNutrition();
      renderTimeline();
      renderCheat();
    });
  });

  document.getElementById('onboardSkip').addEventListener('click', finishOnboarding);
}

   INIT
============================================================ */
renderNav();
buildMain();
renderCountdown();
showView('overview');
maybeShowOnboarding();
wireSyncButtons();

// If this device was previously signed in, try a silent (no-prompt) reconnect
getJSON('drive-signed-in', false).then(wasSignedIn=>{
  if(!wasSignedIn) return;
  const tryRestore = ()=>{
    if(!window.google || !google.accounts){ setTimeout(tryRestore, 400); return; }
    DRIVE_TOKEN_CLIENT = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if(resp && resp.access_token){
          DRIVE_TOKEN = resp.access_token;
          await driveInitialSync();
        } else {
          setSyncUI('signed-out');
        }
      }
    });
    try{ DRIVE_TOKEN_CLIENT.requestAccessToken({ prompt: '' }); }catch(e){ setSyncUI('signed-out'); }
  };
  tryRestore();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
