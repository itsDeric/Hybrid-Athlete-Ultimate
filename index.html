<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Athlete">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hybrid Athlete — Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
  // Chart.js from cdnjs, with a jsDelivr fallback if the primary CDN is blocked or unreachable —
  // previously a single pinned CDN URL with no fallback meant charts could stay silently blank forever.
  (function(){
    function loadFallback(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
      document.head.appendChild(s);
    }
    var primary = document.createElement('script');
    primary.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    primary.onerror = loadFallback;
    document.head.appendChild(primary);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0c;
  --ink:#111114;
  --white:#ffffff;
  --blue:#0a6cff;
  --blue-soft:#eaf1ff;
  --blue-dim:rgba(10,108,255,.12);
  --gray-50:#f7f7f9;
  --gray-100:#eeeef1;
  --gray-200:#e2e2e6;
  --gray-400:#9a9aa2;
  --gray-600:#5c5c64;
  --gray-800:#28282d;
  --green:#1fb15a;
  --amber:#c98a12;
  --red:#e0352b;
  --purple:#8b6fe0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--gray-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--blue);color:#fff;}

/* ---------- Layout ---------- */
#app{display:flex;width:100%;min-height:100vh;}

.sidebar{
  width:224px;
  flex-shrink:0;
  background:var(--black);
  color:#fff;
  padding:24px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 22px 10px;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-dim);}
.brand-text{font-weight:800;font-size:14.5px;letter-spacing:-.02em;line-height:1.15;}
.brand-text span{display:block;font-weight:500;font-size:10.5px;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.navbtn{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:none;border:none;color:var(--gray-400);
  font-family:var(--sans);font-size:13.5px;font-weight:600;
  padding:9px 10px;border-radius:10px;cursor:pointer;
  transition:background .15s,color .15s;
}
.navbtn svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:var(--blue);color:#fff;}
.navbtn.active svg{opacity:1;}

.sidebar-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);}

.sync-box{padding:10px 10px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sync-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;margin-bottom:8px;}
.sync-btn{width:100%;background:#fff;color:var(--ink);border:none;border-radius:9px;padding:8px 10px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.sync-btn svg{width:14px;height:14px;}
.sync-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#fff;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-meta{font-size:10px;color:var(--gray-400);margin-top:3px;}
.sync-actions{display:flex;gap:6px;margin-top:8px;}
.sync-actions button{flex:1;background:rgba(255,255,255,.08);color:#fff;border:none;border-radius:7px;padding:6px;font-family:var(--sans);font-size:10.5px;font-weight:700;cursor:pointer;}
.sync-actions button:hover{background:rgba(255,255,255,.15);}
.countdown-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;}
.countdown-num{font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;margin-top:4px;}
.countdown-sub{font-size:11px;color:var(--gray-400);margin-top:1px;}

.main{flex:1;min-width:0;padding:36px 44px 80px;max-width:1180px;}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{margin-bottom:28px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;}
.page-sub{color:var(--gray-600);font-size:14px;margin-top:6px;max-width:640px;}

/* pulse line divider — signature motif */
.pulse{width:100%;height:22px;margin:26px 0;opacity:.55;}
.pulse path{fill:none;stroke:var(--blue);stroke-width:1.6;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g7{grid-template-columns:repeat(7,1fr);}
@media (max-width:900px){.g2,.g3,.g4,.g7{grid-template-columns:repeat(2,1fr);}}

.card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.card h3{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;}
.card .muted{color:var(--gray-600);font-size:12.5px;}

.stat-card{padding:18px 20px;}
.stat-label{font-size:11px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.06em;}
.stat-value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-value small{font-size:13px;font-weight:500;color:var(--gray-600);}

/* rings (overview signature element) */
.rings-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.ring-legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;}
.ring-legend .row{display:flex;align-items:center;gap:8px;}
.ring-legend .sw{width:9px;height:9px;border-radius:2px;}

/* progress bar */
.pbar{height:6px;border-radius:99px;background:var(--gray-100);overflow:hidden;margin-top:8px;}
.pbar > div{height:100%;border-radius:99px;background:var(--blue);}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--gray-200);}
td{padding:10px;border-bottom:1px solid var(--gray-100);}
tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--mono);}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.tag.blue{background:var(--blue-dim);color:var(--blue);}
.tag.gray{background:var(--gray-100);color:var(--gray-600);}
.tag.green{background:rgba(31,177,90,.12);color:var(--green);}
.tag.rest{background:var(--gray-800);color:#fff;}

.exercise-chip{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--gray-600);}
.exercise-chip.active{background:var(--black);color:#fff;border-color:var(--black);}

/* week planner */
.day-card{padding:16px;min-height:150px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s, box-shadow .15s;}
.day-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
.day-card .dname{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);}
.day-card .dtitle{font-size:14.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.day-card .dsub{font-size:12px;color:var(--gray-600);margin-top:auto;}
.day-card.today{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue), var(--shadow);}
.day-card.rest{background:var(--black);color:#fff;}
.day-card.rest .dname{color:var(--gray-400);}
.day-card.rest .dsub{color:var(--gray-400);}

.icon-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-dim);}
.icon-chip svg{width:16px;height:16px;color:var(--blue);}

/* tabs (sub-nav within a view) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.subtab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--gray-600);}
.subtab.active{background:var(--black);color:#fff;border-color:var(--black);}

.pane{display:none;}
.pane.active{display:block;}

/* buttons/forms */
.btn{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn.secondary{background:var(--black);}
.btn.ghost{background:var(--gray-100);color:var(--ink);}
input,select{font-family:var(--sans);font-size:13px;border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
.field label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--gray-600);margin-bottom:4px;}

/* checkbox pill list */
.check-list{display:flex;flex-direction:column;gap:2px;}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer;user-select:none;}
.run-row [data-runcheck]{cursor:pointer;}
.run-row-done{background:rgba(31,177,90,.06);}
.check-item:last-child{border-bottom:none;}
.check-box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--gray-200);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.check-box.done{background:var(--blue);border-color:var(--blue);}
.check-box svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .1s;}
.check-box.done svg{opacity:1;}
.check-item span.label{font-size:13.5px;font-weight:500;}
.check-item.done span.label{color:var(--gray-400);text-decoration:line-through;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--gray-200);}
.tl-item{position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);}
.tl-item.done .tl-dot{background:var(--blue);}
.tl-month{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--blue);letter-spacing:.06em;}
.tl-title{font-size:15px;font-weight:700;margin:3px 0 6px;}
.tl-goals{font-size:12.5px;color:var(--gray-600);}

/* habit heatmap-ish grid */
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.hcell{aspect-ratio:1;border-radius:6px;background:var(--gray-100);}

footer.printnote{margin-top:60px;padding-top:18px;border-top:1px solid var(--gray-200);font-size:11.5px;color:var(--gray-400);}

/* cheat sheet */
.sheet{background:var(--black);color:#fff;border-radius:20px;padding:26px 28px;}
.sheet h2{font-size:20px;font-weight:800;}
.sheet .sub{color:var(--gray-400);font-size:12.5px;margin-top:2px;}
.sheet-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px;}
.sheet-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;}
.sheet-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);font-weight:700;margin-bottom:10px;}
.sheet-block .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
.sheet-block .row:last-child{border-bottom:none;}
.sheet-block .row .v{font-family:var(--mono);color:var(--blue);font-weight:600;}

@media print{
  .sidebar{display:none;}
  .main{padding:0;max-width:100%;}
  .view{display:none !important;}
  #print-cheat{display:block !important;}
}

/* responsive */
@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:14px;}
  .brand{padding:4px 8px;width:100%;}
  .sidebar-foot{display:none;}
  .main{padding:22px 18px 60px;}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr;}
  .sheet-grid{grid-template-columns:1fr;}
}
/* Onboarding overlay */
.onboard-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(10,10,12,.72);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:fade .25s ease;
}
.onboard-card{
  background:#fff;border-radius:20px;max-width:760px;width:100%;
  max-height:88vh;overflow-y:auto;
  padding:32px 32px 26px;
}
.onboard-head{margin-bottom:22px;}
.onboard-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}
.onboard-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.onboard-head p{color:var(--gray-600);font-size:13.5px;margin-top:6px;}
.onboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (max-width:640px){.onboard-grid{grid-template-columns:1fr;}}
.onboard-option{
  text-align:left;border:1.5px solid var(--gray-200);border-radius:14px;
  background:#fff;padding:14px 16px;cursor:pointer;font-family:var(--sans);
  transition:border-color .12s, box-shadow .12s;
}
.onboard-option:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(10,108,255,.1);}
.onboard-option .oname{font-size:14px;font-weight:700;}
.onboard-option .odesc{font-size:12px;color:var(--gray-600);margin-top:4px;line-height:1.5;}
.onboard-option.build-own{background:var(--black);border-color:var(--black);}
.onboard-option.build-own .oname{color:#fff;}
.onboard-option.build-own .odesc{color:var(--gray-400);}
.onboard-skip{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:var(--sans);text-decoration:underline;}

/* Session Mode */
.session-overlay{
  position:fixed;inset:0;z-index:1100;background:var(--black);color:#fff;
  display:flex;flex-direction:column;padding:20px 20px 28px;
  animation:fade .2s ease;
  overflow-y:auto;
}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.session-close{background:rgba(255,255,255,.08);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.session-progress{font-size:12px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.session-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:40px;}
.session-exname{font-size:28px;font-weight:800;letter-spacing:-.02em;max-width:90%;}
.session-target{font-size:14px;color:var(--gray-400);font-family:var(--mono);}
.session-hint{font-size:11.5px;color:var(--gray-400);margin-top:6px;max-width:300px;}
.session-sets{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px;margin-top:18px;}
.session-set-row{display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;}
.session-set-row.done{background:rgba(31,177,90,.13);border-color:var(--green);}
.set-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.set-label{font-weight:700;font-size:13.5px;flex-shrink:0;}
.set-type-badge{border:none;border-radius:20px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.03em;cursor:pointer;text-transform:uppercase;font-family:var(--sans);white-space:nowrap;}
.set-type-badge::after{content:' ▾';opacity:.6;font-size:9px;}
.set-type-badge.type-working{background:rgba(10,108,255,.2);color:#8fbaff;}
.set-type-badge.type-warmup{background:rgba(201,138,18,.22);color:#f0b84a;}
.set-type-badge.type-drop{background:rgba(139,111,224,.22);color:#c1adf5;}
.set-type-badge.type-failure{background:rgba(224,53,43,.22);color:#ff9089;}
.set-check{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.set-check svg{width:14px;height:14px;color:#fff;opacity:0;}
.session-set-row.done .set-check{background:var(--green);border-color:var(--green);}
.session-set-row.done .set-check svg{opacity:1;}
.set-row-inputs{display:flex;align-items:center;gap:8px;}
.set-input{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:7px 4px;}
.set-input::placeholder{color:rgba(255,255,255,.3);}
.set-x{color:var(--gray-400);font-size:12.5px;flex-shrink:0;}
.plate-btn{flex-shrink:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 9px;font-size:14px;cursor:pointer;line-height:1;}
.plate-readout{font-size:11.5px;color:var(--gray-400);margin-top:2px;padding:0 2px;}
.set-remove-row{text-align:right;margin-top:4px;}
.set-remove-btn{background:transparent;border:none;color:var(--gray-400);font-size:11px;cursor:pointer;padding:3px 2px;line-height:1;text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);}
.set-remove-btn:hover{color:var(--red);text-decoration-color:var(--red);}
.add-set-btn{width:100%;max-width:360px;margin-top:10px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);border-radius:12px;padding:12px;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;}
.session-rest{position:fixed;inset:0;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:1150;}
/* PR Toast */
.pr-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--black);color:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 12px 32px rgba(0,0,0,.3);z-index:1300;transition:opacity .3s ease,transform .3s ease;max-width:90vw;width:340px;}
.pr-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.pr-toast-head{font-weight:800;font-size:15px;margin-bottom:10px;}
.pr-toast-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid rgba(255,255,255,.1);}
.pr-toast-row:first-of-type{border-top:none;}
.pr-toast-ex{font-weight:700;font-size:13.5px;}
.pr-toast-type{font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.pr-toast-val{font-family:var(--mono);font-size:13.5px;}
.pr-toast-prev{color:var(--gray-400);font-size:11.5px;}

function generateRunProgression(distanceKm, weeks){
  weeks = Math.max(6, Math.min(24, Math.round(weeks)));
  const q1 = Math.max(1, Math.round(weeks*0.25));
  const q2 = Math.max(q1+1, Math.round(weeks*0.5));
  const q3 = Math.max(q2+1, Math.round(weeks*0.75));
  const estMinutes = Math.max(20, Math.round(distanceKm*6)); // rough continuous-run estimate at an easy ~6 min/km pace
  const easy = [
    {w:'Week 1', d:'5 min walk → (Run 2 min / Walk 2 min) × 8 → 5 min cooldown walk'},
    {w:`Week ${q1}`, d:'(Run 3 min / Walk 2 min) × repeat'},
    {w:`Week ${q2}`, d:'(Run 8 min / Walk 2 min) × repeat'},
    {w:`Week ${q3}`, d:`Run continuously for ${Math.round(estMinutes*0.6)} minutes`},
    {w:`Week ${weeks}`, d:`Run continuously for ${estMinutes} minutes`},
  ];
  const speed = [
    {w:'Week 1', d:'10 min warm-up jog → 6 × 1 min fast / 2 min easy → 10 min cooldown'},
    {w:`Week ${q1}`, d:'10 min warm-up → 6 × 2 min fast / 90 sec easy → 10 min cooldown'},
    {w:`Week ${q2}`, d:'10 min warm-up → 5 × 4 min fast / 2 min easy → 10 min cooldown'},
    {w:`Week ${q3}`, d:'10 min warm-up → 4 × 6 min tempo / 2 min easy → 10 min cooldown'},
    {w:`Week ${weeks}`, d:'10 min warm-up → 20 min continuous tempo → 10 min cooldown'},
  ];
  const long = [];
  let dist = Math.max(1, Math.round(distanceKm*0.12*10)/10);
  for(let w=1; w<=weeks; w++){
    if(w===weeks){ long.push([String(w), `${distanceKm} km`, 'Goal Run']); continue; }
    if(w % 4 === 0){ long.push([String(w), `${Math.round(dist*0.6*10)/10} km`, 'Recovery']); continue; }
    dist = Math.min(distanceKm*0.9, dist*1.12);
    long.push([String(w), `${Math.round(dist*10)/10} km`, '']);
  }
  return { easy, speed, long };
}

/* ============================================================
   STORAGE HELPERS — uses the browser's own localStorage,
   so all data (weights, PRs, habits) lives on this device only,
   with no Claude account or internet connection required.
============================================================ */
const LS_PREFIX = 'hybrid-athlete:';
async function getJSON(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function setJSON(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){
    console.error('Storage failed — your browser may have local storage disabled or full.', e);
  }
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   SHARED EXERCISE WEIGHT STORE
   One working weight per exercise name, shared across every
   program and every day it appears in — editing it anywhere
   (Program Builder, Gym Dashboard, Session Mode) updates it
   everywhere else that exercise shows up.
============================================================ */
async function getExerciseWeight(name){
  const weights = await getJSON('exercise-weights', {});
  return weights[name] || '';
}
async function setExerciseWeight(name, value){
  const weights = await getJSON('exercise-weights', {});
  weights[name] = value;
  await setJSON('exercise-weights', weights);
}
async function getAllExerciseWeights(){
  return await getJSON('exercise-weights', {});
}

async function migrateToSharedExerciseWeights(){
  const migrated = await getJSON('exercise-weights-migrated', false);
  if(migrated) return;
  const weights = await getJSON('exercise-weights', {});
  const candidates = {}; // name -> { value, date } — date '' sorts before any real date

  // Baseline from old Hybrid Athlete per-day storage (key format "Day::Exercise_Name")
  const gw = await getJSON('gym-weights', {});
  Object.keys(gw).forEach(k=>{
    const name = k.split('::')[1].replace(/_/g,' ');
    if(gw[k] && !candidates[name]) candidates[name] = { value: gw[k], date: '' };
  });

  // Baseline from custom programs' per-exercise load fields
  const progs = await getJSON('custom-programs', []);
  progs.forEach(p=>{
    Object.values(p.days||{}).forEach(d=>{
      (d.exercises||[]).forEach(e=>{
        if(e.load && !candidates[e.name]) candidates[e.name] = { value: e.load, date: '' };
      });
    });
  });

  // Session history has real dates — most recent logged value wins over baselines
  const history = await getJSON('session-history', []);
  history.forEach(s=>{
    (s.exercises||[]).forEach(e=>{
      if(e.weight && (!candidates[e.name] || s.date > candidates[e.name].date)){
        candidates[e.name] = { value: e.weight, date: s.date };
      }
    });
  });

  Object.keys(candidates).forEach(name=>{
    if(!(name in weights)) weights[name] = candidates[name].value;
  });
  await setJSON('exercise-weights', weights);
  await setJSON('exercise-weights-migrated', true);
}

function estimated1RM(weight, reps){
  const w = parseFloat(weight), r = parseInt(reps);
  if(!w || !r || r < 1) return null;
  return w * (1 + r/30); // Epley formula
}

// One-time backfill: auto PR detection only started watching for NEW sessions from the moment it
// shipped — it never rescanned history that already existed. This walks every past session in
// chronological order and reconstructs the PRs you would have gotten had the feature existed from
// day one, so historical bests aren't invisible in the Personal Records table.
async function backfillPRs(){
  const done = await getJSON('pr-backfill-done', false);
  if(done) return;
  const history = (await getJSON('session-history', [])).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const running = {}; // exercise name -> { maxWeight, max1RM, maxSessionVolume }
  const newEntries = [];
  history.forEach(s=>{
    const sessionVolumeByEx = {};
    (s.exercises||[]).forEach(e=>{
      if(!running[e.name]) running[e.name] = { maxWeight:0, max1RM:0, maxSessionVolume:0 };
      const base = running[e.name];
      let bestWeightSet=null, bestOneRM=0, bestOneRMSet=null, sessionVolume=0;
      (e.sets||[]).forEach(set=>{
        if(!set.done || set.type!=='working') return;
        const w = parseFloat(set.weight);
        if(w && (!bestWeightSet || w>parseFloat(bestWeightSet.weight))) bestWeightSet = set;
        const oneRM = estimated1RM(set.weight, set.reps);
        if(oneRM && oneRM>bestOneRM){ bestOneRM=oneRM; bestOneRMSet=set; }
        if(w && set.reps) sessionVolume += w*parseInt(set.reps);
      });
      if(bestWeightSet && parseFloat(bestWeightSet.weight) > base.maxWeight){
        newEntries.push({ date:s.date, ex:e.name, w:bestWeightSet.weight, r:bestWeightSet.reps||'', type:'Weight PR', auto:true });
        base.maxWeight = parseFloat(bestWeightSet.weight);
      }
      if(bestOneRMSet && bestOneRM > base.max1RM){
        newEntries.push({ date:s.date, ex:e.name, w:bestOneRMSet.weight, r:bestOneRMSet.reps||'', type:'Est. 1RM PR', auto:true });
        base.max1RM = bestOneRM;
      }
      if(sessionVolume > base.maxSessionVolume && base.maxSessionVolume > 0){
        newEntries.push({ date:s.date, ex:e.name, w:Math.round(sessionVolume), r:'', type:'Volume PR', auto:true });
      }
      if(sessionVolume > base.maxSessionVolume) base.maxSessionVolume = sessionVolume;
    });
  });
  if(newEntries.length){
    const prLog = await getJSON('pr-log', []);
    await setJSON('pr-log', prLog.concat(newEntries));
  }
  await setJSON('pr-backfill-done', true);
}

/* ============================================================
   BACKUP & RESTORE — free, local file export/import.
   No account, no sign-in, works for anyone immediately.
============================================================ */
function collectLocalSnapshot(){
  const snap = {};
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith(LS_PREFIX)){
      try{ snap[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  });
  return snap;
}

function exportData(){
  const snap = collectLocalSnapshot();
  const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `hybrid-athlete-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const meta = document.getElementById('backupMeta');
  if(meta) meta.textContent = 'Backup downloaded — keep it somewhere safe.';
}

function importData(){
  document.getElementById('importFileInput').click();
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = JSON.parse(evt.target.result);
      Object.keys(data).forEach(k=>{
        localStorage.setItem(LS_PREFIX+k, JSON.stringify(data[k]));
      });
      const meta = document.getElementById('backupMeta');
      if(meta) meta.textContent = 'Backup restored — reloading…';
      setTimeout(()=> location.reload(), 700);
    }catch(err){
      const meta = document.getElementById('backupMeta');
      if(meta) meta.textContent = 'That file could not be read — make sure it\'s a real backup file.';
      console.error('[Import] failed:', err);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset so re-selecting the same file still fires change
}

function wireBackupButtons(){
  document.getElementById('exportDataBtn').addEventListener('click', exportData);
  document.getElementById('importDataBtn').addEventListener('click', importData);
  document.getElementById('importFileInput').addEventListener('change', handleImportFile);
}

  const goalsKey = 'overview-goals:' + (activeProg ? activeProg.id : 'builtin');
  let defaultGoals;
  if(activeProg){
    const m = activeProg.meta;
    defaultGoals = {
      primaryTitle: `Program Focus — ${activeProg.tag}`,
      primary: (m && m.keepInMind && m.keepInMind.length) ? m.keepInMind.slice(0,2).join(' ') : `Following ${activeProg.name}. Train each session as written, add exercises or adjust load any time from Program Builder.`,
      secondaryTitle: 'Coaching Rules',
      secondary: (m && m.universalRules && m.universalRules.length) ? m.universalRules.slice(0,3).join(' ') : `Track your sets, reps, and load every session. Progressive overload is what turns this plan into results.`
    };
  } else {
    defaultGoals = {
      primaryTitle: 'Primary Goal — Physique',
      primary: 'Build a lean, athletic V-taper: wide shoulders, broad back, defined chest, visible abs, athletic legs. Functional strength, not bodybuilding size.',
      secondaryTitle: 'Secondary Goal — Hybrid Athlete',
      secondary: 'Build muscle and endurance in parallel. Prepare for trekking. Progress from zero running base to a 30 km finish, then toward a half marathon and marathon.'
    };
  }
  const goals = await getJSON(goalsKey, defaultGoals);

  let rhythmHTML, headTitle, headSub, trainDaysCount;
  if(activeProg){
    const trainDays = DAY_NAMES.filter(d=>activeProg.days[d] && activeProg.days[d].type==='training').length;
    const restDays = 7 - trainDays;
    trainDaysCount = trainDays;
    rhythmHTML = `
      <div><div class="stat-label">Program</div><div class="stat-value" style="font-size:14px;font-weight:700;">${activeProg.name}</div></div>
      <div><div class="stat-label">Training Days</div><div class="stat-value">${trainDays}</div></div>
      <div><div class="stat-label">Rest Days</div><div class="stat-value">${restDays}</div></div>
      <div><div class="stat-label">Focus</div><div class="stat-value" style="font-size:14px;font-weight:700;">${activeProg.tag}</div></div>`;
    headTitle = activeProg.name;
    headSub = `Currently following <b>${activeProg.name}</b> — ${activeProg.tag}. Switch programs any time from the list below.`;
  } else {
    trainDaysCount = WEEK_PLAN.filter(d=>d.type!=='rest').length;
    rhythmHTML = `
      <div><div class="stat-label">Gym Sessions</div><div class="stat-value">4</div></div>
      <div><div class="stat-label">Running Sessions</div><div class="stat-value">3</div></div>
      <div><div class="stat-label">Full Rest</div><div class="stat-value">0</div></div>
      <div><div class="stat-label">Focus</div><div class="stat-value" style="font-size:14px;font-weight:700;">Growth + Endurance</div></div>`;
    headTitle = 'Hybrid Athlete';
    headSub = `Currently following the built-in <b>Hybrid Athlete</b> program. Switch programs any time from the list below.`;
  }

  // What's Today — built once, used by the card below
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  const todayWeights = await getAllExerciseWeights();
  let todayHTML, todayIsRest = false, todayJumpHandler;
  if(activeProg){
    const dayData = activeProg.days[todayName] || {type:'rest', exercises:[]};
    if(dayData.type==='rest' || !dayData.exercises.length){
      todayIsRest = true;
      todayHTML = `<p class="muted" style="margin-top:6px;">Full rest day. No session scheduled.</p>`;
      todayJumpHandler = null;
    } else {
      todayHTML = `<div class="check-list" style="margin-top:8px;">${dayData.exercises.slice(0,5).map(e=>`<div class="check-item" style="cursor:default;"><div class="check-box done">${ICONS.check}</div><span class="label">${e.name} — ${e.sets}×${e.reps}${todayWeights[e.name]?' @ '+todayWeights[e.name]+'kg':''}</span></div>`).join('')}${dayData.exercises.length>5?`<div class="check-item" style="cursor:default;"><span class="label muted">+ ${dayData.exercises.length-5} more…</span></div>`:''}</div>`;
      todayJumpHandler = ()=>{
        GYM_STATE.activeDay = todayName;
        showView('gym');
      };
    }
  } else {
    const plan = WEEK_PLAN.find(d=>d.day===todayName);
    if(plan && (plan.type==='gym' || plan.type==='both') && GYM[todayName]){
      const gymDay = GYM[todayName];
      todayHTML = `<div class="check-list" style="margin-top:8px;">${gymDay.exercises.slice(0,5).map(e=>`<div class="check-item" style="cursor:default;"><div class="check-box done">${ICONS.check}</div><span class="label">${e[0]} — ${e[1]}×${e[2]}${todayWeights[e[0]]?' @ '+todayWeights[e[0]]+'kg':''}</span></div>`).join('')}${gymDay.exercises.length>5?`<div class="check-item" style="cursor:default;"><span class="label muted">+ ${gymDay.exercises.length-5} more…</span></div>`:''}</div>`;
      todayJumpHandler = ()=>{
        GYM_STATE.activeDay = todayName;
        showView('gym');
      };
    } else if(plan && plan.type==='run'){
      todayHTML = `<p class="muted" style="margin-top:6px;">Running day — see the Running tab for today's session.</p>`;
      todayJumpHandler = ()=> showView('running');
    } else {
      todayIsRest = true;
      todayHTML = `<p class="muted" style="margin-top:6px;">Full rest day. No session scheduled.</p>`;
      todayJumpHandler = null;
    }
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Your Training Home</div>
      <div class="page-title">${headTitle}</div>
      <div class="page-sub">${headSub}</div>
    </div>

    <div class="card" style="margin-bottom:14px;${!todayIsRest?'cursor:pointer;':''}" id="ovTodayCard">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>What's Today — ${todayName}</h3>
        ${!todayIsRest?`<span class="tag blue">Tap to open</span>`:`<span class="tag gray">Rest</span>`}
      </div>
      ${todayHTML}
    </div>

    <div class="grid g3">
      <div class="card stat-card">
        <div class="stat-label">Current Weight</div>
        <div class="stat-value" id="ovWeightDisplay" style="cursor:pointer;" title="Click to edit">${profile.weight} <small>kg</small></div>
        <div id="ovWeightEdit" style="display:none;margin-top:8px;gap:6px;align-items:center;">
          <input id="ovWeightInput" type="number" step="0.1" value="${profile.weight}" style="width:80px;">
          <button class="btn" style="padding:6px 10px;font-size:12px;" id="ovWeightSave">Save</button>
        </div>
      </div>
      <div class="card stat-card"><div class="stat-label">Active Program</div><div class="stat-value" style="font-size:16px;">${headTitle}</div></div>
      <div class="card stat-card"><div class="stat-label">Training Days / Week</div><div class="stat-value">${trainDaysCount} <small>of 7</small></div></div>
    </div>

    ${pulseLine()}

    <div class="grid g2" style="align-items:start;">
      <div class="card">
        <h3 id="ovPrimaryTitleDisplay" style="cursor:pointer;" title="Click to edit">${goals.primaryTitle}</h3>
        <input id="ovPrimaryTitleInput" style="display:none;font-size:14px;font-weight:700;width:100%;margin-top:2px;" value="${goals.primaryTitle.replace(/"/g,'&quot;')}">
        <p class="muted" id="ovPrimaryDisplay" style="margin-top:8px;line-height:1.6;cursor:pointer;" title="Click to edit">${goals.primary}</p>
        <div id="ovPrimaryEdit" style="display:none;margin-top:8px;">
          <textarea id="ovPrimaryInput" rows="4" style="width:100%;font-family:var(--sans);font-size:13px;border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;">${goals.primary}</textarea>
          <button class="btn" style="margin-top:8px;padding:6px 10px;font-size:12px;" id="ovPrimarySave">Save</button>
        </div>
      </div>
      <div class="card">
        <h3 id="ovSecondaryTitleDisplay" style="cursor:pointer;" title="Click to edit">${goals.secondaryTitle}</h3>
        <input id="ovSecondaryTitleInput" style="display:none;font-size:14px;font-weight:700;width:100%;margin-top:2px;" value="${goals.secondaryTitle.replace(/"/g,'&quot;')}">
        <p class="muted" id="ovSecondaryDisplay" style="margin-top:8px;line-height:1.6;cursor:pointer;" title="Click to edit">${goals.secondary}</p>
        <div id="ovSecondaryEdit" style="display:none;margin-top:8px;">
          <textarea id="ovSecondaryInput" rows="4" style="width:100%;font-family:var(--sans);font-size:13px;border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;">${goals.secondary}</textarea>
          <button class="btn" style="margin-top:8px;padding:6px 10px;font-size:12px;" id="ovSecondarySave">Save</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h3>Weekly Rhythm ${activeProg?`<span class="tag blue" style="margin-left:6px;">Linked to active program</span>`:''}</h3>
      <div class="grid g4" style="margin-top:12px;">
        ${rhythmHTML}
      </div>
    </div>
  `;

  // What's Today card
  if(todayJumpHandler){
    document.getElementById('ovTodayCard').addEventListener('click', todayJumpHandler);
  }

  // Start weight
  const disp = document.getElementById('ovWeightDisplay');
  const editBox = document.getElementById('ovWeightEdit');
  disp.addEventListener('click', ()=>{
    disp.style.display = 'none';
    editBox.style.display = 'flex';
    document.getElementById('ovWeightInput').focus();
  });
  document.getElementById('ovWeightSave').addEventListener('click', async ()=>{
    const w = parseFloat(document.getElementById('ovWeightInput').value) || profile.weight;
    await setJSON('profile', {weight:w});
    renderOverview();
    renderNutrition();
    renderCheat();
  });

  // Editable goal titles + bodies
  function wireEditable(dispId, editId, inputId, saveText, key, isTitle){
    const d = document.getElementById(dispId);
    d.addEventListener('click', ()=>{
      if(isTitle){
        d.style.display = 'none';
        const inp = document.getElementById(inputId);
        inp.style.display = 'block';
        inp.focus();
        inp.addEventListener('blur', saveHandler, {once:true});
        inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') inp.blur(); });
      }
    });
    async function saveHandler(){
      const inp = document.getElementById(inputId);
      const val = inp.value.trim() || goals[key];
      const g = await getJSON(goalsKey, goals);
      g[key] = val;
      await setJSON(goalsKey, g);
      renderOverview();
    }
  }
  wireEditable('ovPrimaryTitleDisplay', null, 'ovPrimaryTitleInput', null, 'primaryTitle', true);
  wireEditable('ovSecondaryTitleDisplay', null, 'ovSecondaryTitleInput', null, 'secondaryTitle', true);

  function wireGoalEdit(prefix, key){
    const d = document.getElementById(prefix+'Display');
    const e = document.getElementById(prefix+'Edit');
    d.addEventListener('click', ()=>{
      d.style.display = 'none';
      e.style.display = 'block';
      document.getElementById(prefix+'Input').focus();
    });
    document.getElementById(prefix+'Save').addEventListener('click', async ()=>{
      const val = document.getElementById(prefix+'Input').value.trim() || goals[key];
      const g = await getJSON(goalsKey, goals);
      g[key] = val;
      await setJSON(goalsKey, g);
      renderOverview();
    });
  }
  wireGoalEdit('ovPrimary','primary');
  wireGoalEdit('ovSecondary','secondary');
}

/* ---------- PROGRAM BUILDER ---------- */
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function blankProgram(name){
  const days = {};
  DAY_NAMES.forEach(d=> days[d] = {type:'rest', exercises:[]});
  return { id: 'p_'+Date.now(), name: name||'New Program', tag:'Custom', days };
}
let PB_STATE = { editingId: null, activeDay: 'Monday' };

async function renderPrograms(){
  const el = document.getElementById('view-programs');
  const programs = await getJSON('custom-programs', []);
  const activeId = await getJSON('active-program', null);

  if(PB_STATE.editingId){
    return renderProgramEditor(el, programs);
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Build Your Own</div>
      <div class="page-title">Program Builder</div>
      <div class="page-sub">Hybrid Athlete is one built-in program. Start from a well-researched routine below, or build a fully custom one by naming it and filling each day from the exercise library.</div>
    </div>

    <div class="card" style="margin-bottom:14px;${activeId===null?'box-shadow:0 0 0 1.5px var(--blue), var(--shadow);':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <h3>Hybrid Athlete <span class="tag blue" style="margin-left:6px;">Built-in preset</span> ${activeId===null?'<span class="tag green" style="margin-left:4px;">Active</span>':''}</h3>
          <p class="muted" style="margin-top:4px;">The 5-month gym + running program already loaded in your Overview, Gym, and Running tabs.</p>
        </div>
        <div style="display:flex;gap:8px;">
          ${activeId!==null?`<button class="btn secondary" data-setactive="__builtin__">Set Active</button>`:''}
        </div>
      </div>
    </div>

    <h3 style="font-size:16px;margin-bottom:12px;">Proven Routines</h3>
    <div class="grid g2" style="margin-bottom:14px;">
      ${PRESET_TEMPLATES.map((t,i)=>`
        <div class="card">
          <h3>${t.name}</h3>
          <p class="muted" style="margin-top:4px;">${t.desc||''}</p>
          <button class="btn ghost" style="margin-top:12px;" data-usetemplate="${i}">Use This Routine</button>
        </div>`).join('')}
    </div>

    ${pulseLine()}

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="font-size:16px;">Your Custom Programs</h3>
      <button class="btn" id="pbNew">${ICONS.plus} New Program</button>
    </div>

    <div class="grid g2" id="pbList"></div>
  `;

  document.getElementById('pbNew').addEventListener('click', ()=>{
    PB_STATE.editingId = '__new__';
    PB_STATE.activeDay = 'Monday';
    renderPrograms();
  });
  el.querySelectorAll('[data-usetemplate]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const t = PRESET_TEMPLATES[parseInt(b.dataset.usetemplate)];
      const prog = blankProgram(t.name);
      prog.tag = t.tag;
      if(t.meta) prog.meta = JSON.parse(JSON.stringify(t.meta));
      Object.keys(t.days).forEach(d=>{
        prog.days[d] = { type:t.days[d].type, exercises: t.days[d].exercises.map(e=>({...e})) };
      });
      const list = await getJSON('custom-programs', []);
      list.push(prog);
      await setJSON('custom-programs', list);
      PB_STATE.editingId = prog.id;
      PB_STATE.activeDay = 'Monday';
      renderPrograms();
    });
  });
  el.querySelectorAll('[data-setactive]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const v = b.dataset.setactive;
      await setJSON('active-program', v==='__builtin__' ? null : v);
      renderPrograms();
      renderWeek();
      renderOverview();
      renderRecovery();
      renderNutrition();
      renderTimeline();
      renderCheat();
    });
  });

  const list = document.getElementById('pbList');
  if(!programs.length){
    list.innerHTML = `<div class="card muted" style="grid-column:1/-1;">No custom programs yet — start from a routine above, or click "New Program".</div>`;
  } else {
    list.innerHTML = programs.map(p=>{
      const trainDays = DAY_NAMES.filter(d=>p.days[d] && p.days[d].type==='training').length;
      const exCount = DAY_NAMES.reduce((n,d)=> n + (p.days[d]?.exercises?.length||0), 0);
      const isActive = activeId === p.id;
      return `<div class="card" style="${isActive?'box-shadow:0 0 0 1.5px var(--blue), var(--shadow);':''}">
        <h3>${p.name} <span class="tag gray" style="margin-left:6px;">${p.tag}</span> ${isActive?'<span class="tag green" style="margin-left:4px;">Active</span>':''}</h3>
        <p class="muted" style="margin-top:4px;">${trainDays} training day${trainDays===1?'':'s'} · ${exCount} exercise${exCount===1?'':'s'} total</p>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <button class="btn ghost" data-edit="${p.id}">Edit</button>
          ${!isActive?`<button class="btn secondary" data-setactive="${p.id}">Set Active</button>`:''}
          <button class="btn" style="background:var(--red);" data-del="${p.id}">${ICONS.trash} Delete</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
      PB_STATE.editingId = b.dataset.edit; PB_STATE.activeDay='Monday'; renderPrograms();
    }));
    list.querySelectorAll('[data-setactive]').forEach(b=>b.addEventListener('click', async ()=>{
      await setJSON('active-program', b.dataset.setactive);
      renderPrograms(); renderWeek(); renderOverview(); renderRecovery(); renderNutrition(); renderTimeline(); renderCheat();
    }));
    list.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(b.dataset.confirming !== '1'){
          b.dataset.confirming = '1';
          const original = b.innerHTML;
          b.innerHTML = 'Tap again to confirm';
          const revert = ()=>{ if(b.dataset.confirming==='1'){ b.dataset.confirming='0'; b.innerHTML = original; } };
          b._revertTimer = setTimeout(revert, 3000);
          return;
        }
        clearTimeout(b._revertTimer);
        let arr = await getJSON('custom-programs', []);
        arr = arr.filter(p=>p.id!==b.dataset.del);
        await setJSON('custom-programs', arr);
        const active = await getJSON('active-program', null);
        if(active === b.dataset.del) await setJSON('active-program', null);
        renderPrograms();
        renderWeek();
        renderOverview();
        renderRecovery();
        renderNutrition();
        renderTimeline();
        renderCheat();
      });
    });
  }
}

async function renderProgramEditor(el, programs){
  const isNew = PB_STATE.editingId === '__new__';
  const prog = isNew ? blankProgram('') : programs.find(p=>p.id===PB_STATE.editingId);
  if(!prog){ PB_STATE.editingId=null; return renderPrograms(); }
  const day = PB_STATE.activeDay;
  const dayData = prog.days[day];

  const categoryOptions = Object.keys(EXERCISE_LIBRARY).map(c=>`<option value="${c}">${c}</option>`).join('');
  const sharedWeights = await getAllExerciseWeights();

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">${isNew?'New Program':'Editing Program'}</div>
      <div class="page-title" style="display:flex;align-items:center;gap:10px;">
        <input id="pbName" value="${prog.name.replace(/"/g,'&quot;')}" placeholder="Program name" style="font-size:22px;font-weight:800;border:none;background:transparent;padding:2px 0;border-bottom:2px solid var(--gray-200);">
      </div>
      <div class="page-sub">Pick a day, mark it Training or Rest, then pull exercises in from the library with sets, reps, and load.</div>
    </div>

    <div class="subtabs" id="pbDayTabs">${DAY_NAMES.map(d=>`<button class="subtab ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}${prog.days[d].type==='training'?' •':''}</button>`).join('')}</div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h3>${day}</h3>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;">
          <input type="checkbox" id="pbTrainToggle" ${dayData.type==='training'?'checked':''} style="width:16px;height:16px;">
          Training day
        </label>
      </div>

      <div id="pbDayBody" style="margin-top:14px;${dayData.type==='training'?'':'display:none;'}">
        <table id="pbExTable" style="margin-bottom:14px;">
          <thead><tr><th>Exercise</th><th class="num">Sets</th><th class="num">Reps</th><th class="num">Working Weight</th><th></th></tr></thead>
          <tbody>${dayData.exercises.map((e,i)=>`
            <tr>
              <td>${e.name}</td>
              <td class="num"><input type="text" data-field="sets" data-i="${i}" value="${e.sets}" style="width:50px;text-align:right;"></td>
              <td class="num"><input type="text" data-field="reps" data-i="${i}" value="${e.reps}" style="width:60px;text-align:right;"></td>
              <td class="num"><input type="text" data-field="load" data-i="${i}" value="${sharedWeights[e.name]||''}" placeholder="kg" style="width:60px;text-align:right;"></td>
              <td class="num"><button class="btn ghost" data-removeex="${i}" style="padding:5px 9px;">${ICONS.trash}</button></td>
            </tr>`).join('') || `<tr><td colspan="5" class="muted">No exercises added yet — pull one in below.</td></tr>`}
          </tbody>
        </table>

        <div class="form-row" style="margin-bottom:0;">
          <div class="field"><label>Category</label><select id="pbCategory">${categoryOptions}</select></div>
          <div class="field"><label>Exercise</label><select id="pbExercise"></select></div>
          <div class="field"><label>Or custom name</label><input id="pbCustomName" placeholder="Type your own" style="width:150px;"></div>
          <button class="btn" id="pbAddEx">${ICONS.plus} Add to ${day}</button>
        </div>
      </div>
    </div>

    ${pulseLine()}
    <div style="display:flex;gap:10px;">
      <button class="btn" id="pbSave">Save Program</button>
      <button class="btn ghost" id="pbCancel">Cancel</button>
    </div>
  `;

  function populateExerciseSelect(){
    const cat = document.getElementById('pbCategory').value;
    const sel = document.getElementById('pbExercise');
    sel.innerHTML = EXERCISE_LIBRARY[cat].map(x=>`<option value="${x}">${x}</option>`).join('');
  }
  populateExerciseSelect();
  document.getElementById('pbCategory').addEventListener('change', populateExerciseSelect);

  document.getElementById('pbDayTabs').querySelectorAll('.subtab').forEach(t=>{
    t.addEventListener('click', ()=>{ PB_STATE.activeDay = t.dataset.day; commitLocalEdits(); renderProgramEditor(el, mergeProgIntoList(programs, prog)); });
  });

  document.getElementById('pbTrainToggle').addEventListener('change', (e)=>{
    dayData.type = e.target.checked ? 'training' : 'rest';
    document.getElementById('pbDayBody').style.display = dayData.type==='training' ? '' : 'none';
    document.getElementById('pbDayTabs').querySelector(`[data-day="${day}"]`).innerHTML = day.slice(0,3) + (dayData.type==='training' ? ' •' : '');
  });

  document.getElementById('pbAddEx').addEventListener('click', ()=>{
    const custom = document.getElementById('pbCustomName').value.trim();
    const name = custom || document.getElementById('pbExercise').value;
    if(!name) return;
    dayData.exercises.push({ name, sets:3, reps:'10', load:'' });
    renderProgramEditor(el, mergeProgIntoList(programs, prog));
  });

  el.querySelectorAll('[data-removeex]').forEach(b=>{
    b.addEventListener('click', ()=>{
      dayData.exercises.splice(parseInt(b.dataset.removeex),1);
      renderProgramEditor(el, mergeProgIntoList(programs, prog));
    });
  });

  el.querySelectorAll('#pbExTable input[data-field]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = parseInt(inp.dataset.i);
      if(inp.dataset.field === 'load'){
        setExerciseWeight(dayData.exercises[i].name, inp.value);
      } else {
        dayData.exercises[i][inp.dataset.field] = inp.value;
      }
    });
  });

  function commitLocalEdits(){
    prog.name = document.getElementById('pbName').value.trim() || 'Untitled Program';
  }

  document.getElementById('pbSave').addEventListener('click', async ()=>{
    commitLocalEdits();
    let arr = await getJSON('custom-programs', []);
    const idx = arr.findIndex(p=>p.id===prog.id);
    if(idx>=0) arr[idx]=prog; else arr.push(prog);
    await setJSON('custom-programs', arr);

    renderPrograms();
    renderWeek();

  });

function mergeProgIntoList(programs, prog){
  const copy = programs.slice();
  const idx = copy.findIndex(p=>p.id===prog.id);
  if(idx>=0) copy[idx]=prog; else copy.push(prog);
  return copy;
}

/* ============================================================
   SESSION MODE — live workout flow with rest timer
============================================================ */
let SESSION = null; // { exercises, idx, sourceInfo, setsDone: [[bool,...],...], restInterval, restSeconds }

function parseSetCount(setsVal){
  const m = String(setsVal).match(/\d+/g);
  if(!m) return 3;
  return parseInt(m[m.length-1]); // use the higher number if it's a range like "3-4"
}

function inferRestSeconds(repsVal){
  const nums = String(repsVal).match(/\d+/g);
  if(!nums || !nums.length) return 90;
  const maxRep = Math.max(...nums.map(Number));
  if(maxRep <= 6) return 150;   // heavy strength work — longer rest
  if(maxRep <= 10) return 90;   // moderate hypertrophy range
  return 60;                    // higher-rep / isolation work — shorter rest
}

// Set types — tap a set's badge in Session Mode to cycle through these
const SET_TYPE_ORDER = ['working','warmup','drop','failure'];
const SET_TYPE_META = {
  working: { label:'Working', class:'type-working' },
  warmup:  { label:'Warm-up', class:'type-warmup' },
  drop:    { label:'Drop Set', class:'type-drop' },
  failure: { label:'Failure', class:'type-failure' },
};
function nextSetType(t){
  const i = SET_TYPE_ORDER.indexOf(t);
  return SET_TYPE_ORDER[(i+1) % SET_TYPE_ORDER.length];
}
// Warm-up and drop sets use short fixed rest regardless of rep range; working/failure use the smart inference
function restSecondsForSet(type, repsVal){
  if(type === 'warmup') return 45;
  if(type === 'drop') return 30;
  return inferRestSeconds(repsVal);
}

// Plate calculator — greedy breakdown assuming a standard 20kg Olympic bar and common plate sizes.
// Uses unlimited-pairs assumption (typical commercial gym), not a specific rack's actual inventory.
const PLATE_SIZES = [25, 20, 15, 10, 5, 2.5, 1.25];
function plateBreakdown(totalWeight, barWeight){
  barWeight = barWeight || 20;
  const total = parseFloat(totalWeight);
  if(!total || total <= barWeight) return null;
  let perSide = (total - barWeight) / 2;
  const used = [];
  PLATE_SIZES.forEach(plate=>{
    while(perSide >= plate - 0.001){ used.push(plate); perSide -= plate; }
  });
  const leftover = Math.round(perSide*100)/100;
  return { perSideText: used.length ? used.map(p=> p%1===0?p:p.toFixed(2)).join(' + ') : 'Bar only', leftover };
}

// Warm-up auto-suggestion — percentage ramp of the exercise's working weight, rounded to the nearest
// 2.5kg plate increment. Recomputed across all warm-up sets in the exercise whenever set types change,
// but skips any set the user has manually typed a weight into (tracked via weightAuto).
const WARMUP_PCTS = [0.4, 0.6, 0.8, 0.9];
const DROP_PCTS = [0.75, 0.65, 0.55, 0.45]; // each successive drop set goes lighter than the last
function roundToPlate(kg){ return Math.max(2.5, Math.round(kg/2.5)*2.5); }
// Unified auto-fill across all set types — runs whenever a set's type changes or a set is added.
// Working/Failure sets load the full reference weight; Warm-ups ramp 40/60/80/90%; Drop sets step
// progressively lighter (75/65/55/45%, then -10% per additional drop, floor 20%) rather than all
// landing at a flat percentage. Any set the user has manually typed into (weightAuto===false) is
// left untouched, so this never clobbers a deliberate entry.
function applyTypeAutoFill(sets, refWeight){
  if(!refWeight) return;
  let warmupOrder = 0, dropOrder = 0;
  sets.forEach(s=>{
    if(s.weightAuto === false) return; // user manually edited this one — leave it alone
    if(s.type === 'working' || s.type === 'failure'){
      s.weight = String(refWeight);
      s.weightAuto = true;
    } else if(s.type === 'warmup'){
      const pct = WARMUP_PCTS[warmupOrder] !== undefined ? WARMUP_PCTS[warmupOrder] : WARMUP_PCTS[WARMUP_PCTS.length-1];
      s.weight = String(roundToPlate(refWeight * pct));
      s.weightAuto = true;
      warmupOrder++;
    } else if(s.type === 'drop'){
      const pct = DROP_PCTS[dropOrder] !== undefined ? DROP_PCTS[dropOrder] : Math.max(0.2, DROP_PCTS[DROP_PCTS.length-1] - 0.1*(dropOrder-DROP_PCTS.length+1));
      s.weight = String(roundToPlate(refWeight * pct));
      s.weightAuto = true;
      dropOrder++;
    }
  });
}

async function startSessionMode(exercises, sourceInfo){
  // Prefill each set's weight from the shared exercise-weight store — same value everywhere this exercise appears
  const sharedWeights = await getAllExerciseWeights();
  SESSION = {
    exercises,
    idx: 0,
    sourceInfo,
    refWeight: exercises.map(e => parseFloat(sharedWeights[e.name]) || 0),
    setData: exercises.map(e => {
      const count = parseSetCount(e.sets);
      const defaultWeight = sharedWeights[e.name] || '';
      return new Array(count).fill(null).map(()=> ({ type:'working', weight: defaultWeight, reps:'', done:false, weightAuto:null }));
    }),
    restInterval: null,
    restSeconds: 0,
  };

  const overlay = document.createElement('div');
  overlay.className = 'session-overlay';
  overlay.id = 'sessionOverlay';
  document.body.appendChild(overlay);
  renderSessionExercise();
}

function renderSessionExercise(){
  const overlay = document.getElementById('sessionOverlay');
  if(!overlay || !SESSION) return;
  const ex = SESSION.exercises[SESSION.idx];
  const sets = SESSION.setData[SESSION.idx];
  const isLast = SESSION.idx === SESSION.exercises.length - 1;

  overlay.innerHTML = `
    <div class="session-top">
      <button class="session-close" id="sessionCloseBtn">${ICONS.plus.replace('stroke-width="2.2"','stroke-width="2.2" style="transform:rotate(45deg)"')}</button>
      <div class="session-progress">Exercise ${SESSION.idx+1} of ${SESSION.exercises.length}</div>
      <div style="width:34px;"></div>
    </div>
    <div class="session-body">
      <div class="session-exname">${ex.name}</div>
      <div class="session-target">${ex.sets} × ${ex.reps}</div>
      <div class="session-hint">Tap a badge to change set type — Working/Failure load your full weight, Warm-up ramps up, Drop Set defaults to 75%. Add or remove sets freely below.</div>
      <div class="session-sets">
        ${sets.map((s,i)=>{
          const meta = SET_TYPE_META[s.type];
          return `
          <div class="session-set-row ${s.done?'done':''}" data-setidx="${i}">
            <div class="set-row-top">
              <span class="set-label">Set ${i+1}</span>
              <button class="set-type-badge ${meta.class}" data-typebtn="${i}">${meta.label}</button>
              <div class="set-check" data-checkbtn="${i}">${ICONS.check}</div>
            </div>
            <div class="set-row-inputs">
              <input class="set-input" type="text" inputmode="decimal" data-weightinput="${i}" value="${s.weight||''}" placeholder="kg">
              <span class="set-x">×</span>
              <input class="set-input" type="text" inputmode="numeric" data-repsinput="${i}" value="${s.reps||''}" placeholder="${ex.reps}">
              <button class="plate-btn" data-platebtn="${i}" title="Plate breakdown">🏋</button>
            </div>
            <div class="plate-readout" data-plateout="${i}" style="display:none;"></div>
            ${sets.length>1?`<div class="set-remove-row"><button class="set-remove-btn" data-removebtn="${i}">Delete set</button></div>`:''}
          </div>`;
        }).join('')}
      </div>
      <button class="add-set-btn" id="addSetBtn">+ Add Set</button>
    </div>
    <div class="session-nav">
      ${SESSION.idx>0?`<button class="nav-prev" id="sessionPrevBtn">◀ Prev</button>`:''}
      ${isLast
        ? `<button class="nav-finish" id="sessionFinishBtn">Finish Session</button>`
        : `<button class="nav-next" id="sessionNextBtn">Next Exercise ▶</button>`}
    </div>
  `;

  overlay.querySelectorAll('[data-typebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.typebtn);
      sets[i].type = nextSetType(sets[i].type);
      applyTypeAutoFill(sets, SESSION.refWeight[SESSION.idx]);
      renderSessionExercise(); // full re-render so any auto-filled weights show immediately
    });
  });

  overlay.querySelectorAll('[data-removebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.removebtn);
      if(sets.length <= 1) return; // always keep at least one set
      sets.splice(i, 1);
      renderSessionExercise();
    });
  });

  const addSetBtn = document.getElementById('addSetBtn');
  if(addSetBtn) addSetBtn.addEventListener('click', ()=>{
    sets.push({ type:'working', weight:'', reps:'', done:false, weightAuto:null });
    applyTypeAutoFill(sets, SESSION.refWeight[SESSION.idx]);
    renderSessionExercise();
  });

  overlay.querySelectorAll('[data-checkbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.checkbtn);
      const wasDone = sets[i].done;
      sets[i].done = !wasDone;
      btn.closest('.session-set-row').classList.toggle('done', !wasDone);
      if(!wasDone){
        startRestTimer(restSecondsForSet(sets[i].type, ex.reps));
      }
    });
  });

  overlay.querySelectorAll('[data-weightinput]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const i = parseInt(inp.dataset.weightinput);
      sets[i].weight = e.target.value;
      sets[i].weightAuto = false; // user typed a value — stop auto-suggesting over it
    });
  });
  overlay.querySelectorAll('[data-repsinput]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{ sets[parseInt(inp.dataset.repsinput)].reps = e.target.value; });
  });

  overlay.querySelectorAll('[data-platebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.platebtn);
      const out = overlay.querySelector(`[data-plateout="${i}"]`);
      if(!out) return;
      if(out.style.display !== 'none'){ out.style.display = 'none'; return; }
      const bd = plateBreakdown(sets[i].weight, 20);
      out.innerHTML = bd
        ? `Per side: <b>${bd.perSideText}</b> kg${bd.leftover>0 ? ` <span class="muted">(~${bd.leftover}kg short of an exact plate match)</span>` : ''} — assumes a 20kg bar`
        : `Enter a weight above ${20}kg to see a plate breakdown`;
      out.style.display = 'block';
    });
  });

  document.getElementById('sessionCloseBtn').addEventListener('click', closeSessionMode);
  const prevBtn = document.getElementById('sessionPrevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ SESSION.idx--; renderSessionExercise(); });
  const nextBtn = document.getElementById('sessionNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ SESSION.idx++; renderSessionExercise(); });
  const finishBtn = document.getElementById('sessionFinishBtn');
  if(finishBtn) finishBtn.addEventListener('click', finishSessionMode);
}

function startRestTimer(seconds){
  clearInterval(SESSION.restInterval);
  SESSION.restSeconds = seconds;
  const rest = document.createElement('div');
  rest.className = 'session-rest';
  rest.id = 'sessionRestOverlay';
  document.body.appendChild(rest);
  renderRestTimer();

  SESSION.restInterval = setInterval(()=>{
    SESSION.restSeconds--;
    if(SESSION.restSeconds <= 0){
      endRestTimer();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    renderRestTimer();
  }, 1000);
}

function renderRestTimer(){
  const rest = document.getElementById('sessionRestOverlay');
  if(!rest) return;
  const mins = Math.floor(SESSION.restSeconds/60);
  const secs = SESSION.restSeconds%60;
  rest.innerHTML = `
    <div class="rest-label">Rest</div>
    <div class="rest-time">${mins}:${secs<10?'0':''}${secs}</div>
    <div class="rest-actions">
      <button id="restMinus">-15s</button>
      <button class="skip" id="restSkip">Skip Rest</button>
      <button id="restPlus">+15s</button>
    </div>
  `;
  document.getElementById('restMinus').addEventListener('click', ()=>{ SESSION.restSeconds = Math.max(0, SESSION.restSeconds-15); renderRestTimer(); });
  document.getElementById('restPlus').addEventListener('click', ()=>{ SESSION.restSeconds += 15; renderRestTimer(); });
  document.getElementById('restSkip').addEventListener('click', endRestTimer);
}

function endRestTimer(){
  clearInterval(SESSION.restInterval);
  const rest = document.getElementById('sessionRestOverlay');
  if(rest) rest.remove();
}

async function finishSessionMode(){
  const { sourceInfo, exercises, setData } = SESSION;

  // Representative weight per exercise = last COMPLETED working set's weight.
  // Must check `done` first — every set starts prefilled with the old default weight, so an
  // untouched, never-completed set still has a truthy weight and would otherwise get picked
  // over a set you actually did (e.g. finishing only Set 1 at a new weight while Sets 2-4 sit
  // untouched at their stale prefilled value).
  function representativeWeight(sets){
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].done && sets[i].type==='working' && sets[i].weight) return sets[i].weight; }
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].done && sets[i].weight) return sets[i].weight; }
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].weight) return sets[i].weight; } // fallback: nothing checked done but weight was typed in
    return '';
  }

  const repWeights = exercises.map((e,i)=> representativeWeight(setData[i]));

  // Save each logged weight to the shared store — syncs to this exercise everywhere it appears
  for(let i=0; i<exercises.length; i++){
    if(repWeights[i]) await setExerciseWeight(exercises[i].name, repWeights[i]);
  }

  // --- Auto PR detection ---
  // Compares this session's completed working sets against everything logged before it (session
  // history + any manually-added PRs) and flags new bests, so PRs surface automatically instead of
  // requiring a separate manual entry every time.
  const priorHistory = await getJSON('session-history', []);
  const priorPRs = await getJSON('pr-log', []);
  function baselineFor(name){
    let maxWeight = 0, max1RM = 0, maxSessionVolume = 0;
    priorHistory.forEach(s=>{
      let sessionVolume = 0;
      (s.exercises||[]).forEach(e=>{
        if(e.name !== name) return;
        (e.sets||[]).forEach(set=>{
          if(!set.done || set.type!=='working') return;
          const w = parseFloat(set.weight);
          if(w && w > maxWeight) maxWeight = w;
          const oneRM = estimated1RM(set.weight, set.reps);
          if(oneRM && oneRM > max1RM) max1RM = oneRM;
          if(w && set.reps) sessionVolume += w * parseInt(set.reps);
        });
      });
      if(sessionVolume > maxSessionVolume) maxSessionVolume = sessionVolume;
    });
    priorPRs.forEach(p=>{
      if(p.ex !== name) return;
      const w = parseFloat(p.w);
      if(w && w > maxWeight) maxWeight = w;
      const oneRM = estimated1RM(p.w, p.r);
      if(oneRM && oneRM > max1RM) max1RM = oneRM;
    });
    return { maxWeight, max1RM, maxSessionVolume };
  }
  const newPRs = [];
  exercises.forEach((e,i)=>{
    const doneWorking = setData[i].filter(s=>s.done && s.type==='working' && s.weight);
    if(!doneWorking.length) return;
    const baseline = baselineFor(e.name);
    let sessionVolume = 0;
    let bestWeightSet = null, bestOneRM = 0, bestOneRMSet = null;
    doneWorking.forEach(s=>{
      const w = parseFloat(s.weight);
      if(w && (!bestWeightSet || w > parseFloat(bestWeightSet.weight))) bestWeightSet = s;
      const oneRM = estimated1RM(s.weight, s.reps);
      if(oneRM && oneRM > bestOneRM){ bestOneRM = oneRM; bestOneRMSet = s; }
      if(w && s.reps) sessionVolume += w * parseInt(s.reps);
    });
    if(bestWeightSet && parseFloat(bestWeightSet.weight) > baseline.maxWeight){
      newPRs.push({ ex:e.name, type:'Weight PR', w:bestWeightSet.weight, r:bestWeightSet.reps||'', prev:baseline.maxWeight||null });
    }
    if(bestOneRMSet && bestOneRM > baseline.max1RM && (!bestWeightSet || bestOneRMSet !== bestWeightSet)){
      newPRs.push({ ex:e.name, type:'Est. 1RM PR', w:bestOneRMSet.weight, r:bestOneRMSet.reps||'', prev: baseline.max1RM ? Math.round(baseline.max1RM*10)/10 : null });
    }
    if(sessionVolume > baseline.maxSessionVolume && baseline.maxSessionVolume > 0){
      newPRs.push({ ex:e.name, type:'Volume PR', w:Math.round(sessionVolume), r:'', prev:Math.round(baseline.maxSessionVolume) });
    }
  });
  if(newPRs.length){
    const prLog = await getJSON('pr-log', []);
    newPRs.forEach(p=> prLog.push({ date: todayKey(), ex:p.ex, w:p.w, r:p.r, type:p.type, auto:true }));
    await setJSON('pr-log', prLog);
  }

  // Log this session permanently — this is what powers the progress charts
  const history = await getJSON('session-history', []);
  history.push({
    date: todayKey(),
    day: sourceInfo.day,
    source: sourceInfo.source === 'builtin' ? 'Hybrid Athlete' : (sourceInfo.progId || 'Custom'),
    exercises: exercises.map((e,i)=>({
      name: e.name,
      weight: repWeights[i] || '', // kept for backward-compat with existing charts/migration
      sets: setData[i].map(s=>({ type:s.type, weight:s.weight||'', reps:s.reps||'', done:s.done })),
      setsCompleted: setData[i].filter(s=>s.done).length,
      totalSets: setData[i].length,
      workingSetsCompleted: setData[i].filter(s=>s.done && s.type==='working').length,
    })),
  });
  await setJSON('session-history', history);

  // Mark today's habit as done if this session is for today
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  if(sourceInfo.day === todayName){
    const key = 'habits:'+todayKey();
    const state = await getJSON(key, {});
    state['workout'] = true;
    await setJSON(key, state);
  }

  // Keep the Gym Dashboard on the day you just trained instead of snapping back to the first day of the week
  GYM_STATE.activeDay = sourceInfo.day;

  closeSessionMode();
  renderGym();
  renderCheat();
  renderHabits();
  renderTrackers();
  if(newPRs.length) showPRToast(newPRs);
}

function showPRToast(prs){
  const toast = document.createElement('div');
  toast.className = 'pr-toast';
  toast.innerHTML = `
    <div class="pr-toast-head">🎉 New Personal Record${prs.length>1?'s':''}!</div>
    ${prs.map(p=>`
      <div class="pr-toast-row">
        <span class="pr-toast-ex">${p.ex}</span>
        <span class="pr-toast-type">${p.type}</span>
        <span class="pr-toast-val">${p.w}${p.type==='Volume PR'?' kg total':p.r?' kg × '+p.r:' kg'}${p.prev?` <span class="pr-toast-prev">(was ${p.type==='Volume PR'?p.prev+' kg':p.prev+' kg'})</span>`:''}</span>
      </div>`).join('')}
  `;
  document.body.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=> toast.remove(), 400);
  }, 5000 + prs.length*1200);
}

function closeSessionMode(){
  if(SESSION) clearInterval(SESSION.restInterval);
  const rest = document.getElementById('sessionRestOverlay');
  if(rest) rest.remove();
  const overlay = document.getElementById('sessionOverlay');
  if(overlay) overlay.remove();
  SESSION = null;
}

async function renderRunningGoalPlan(el, goal){
  const isLegacy30k = goal.id === '30k';
  const tables = isLegacy30k ? { easy:RUN_EASY, speed:RUN_SPEED, long:RUN_LONG } : generateRunProgression(goal.distance, goal.weeks);
  const completions = await getJSON('running-completions', {});
  const goalKey = goal.id + ':' + (goal.startedOn||'');
  const rLog = (await getJSON('pace-log', [])).slice().reverse().slice(0,5);

  function rowHTML(type, w, sessionText, noteHTML){
    const key = `${goalKey}::${type}::${w}`;
    const done = !!completions[key];
    return `<tr class="run-row ${done?'run-row-done':''}" data-key="${key}">
      <td style="width:34px;"><div class="check-box ${done?'done':''}" data-runcheck="${key}">${done?ICONS.check:''}</div></td>
      <td><span class="tag blue">${w}</span></td>
      <td>${sessionText}</td>
      ${noteHTML!==undefined?`<td>${noteHTML}</td>`:''}
    </tr>`;
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">${goal.weeks}× Weekly Build</div>
      <div class="page-title">Running Dashboard</div>
      <div class="page-sub">${goal.weeks}-week build toward ${goal.distance}&nbsp;km${isLegacy30k?' — the original Hybrid Athlete plan':''}.</div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">${runningGoalHeaderControls()}</div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Log a Run</h3>
      <p class="muted" style="margin-top:2px;">Logging here goes straight to your Running Pace tracker, regardless of which planned session it was.</p>
      <div class="form-row" style="margin-top:10px;">
        <div class="field"><label>Date</label><input type="date" id="rgDate" value="${todayKey()}"></div>
        <div class="field"><label>Distance (km)</label><input type="number" step="0.1" id="rgDist" placeholder="${goal.distance}"></div>
        <div class="field"><label>Time (min)</label><input type="number" step="0.5" id="rgTime" placeholder="30"></div>
        <button class="btn" id="rgAdd">Log Run</button>
      </div>
      ${rLog.length?`<table style="margin-top:14px;"><thead><tr><th>Date</th><th class="num">Distance</th><th class="num">Time</th></tr></thead>
      <tbody>${rLog.map(r=>`<tr><td>${r.date}</td><td class="num">${r.dist} km</td><td class="num">${r.time} min</td></tr>`).join('')}</tbody></table>`:''}
    </div>
    <div class="subtabs" id="runTabs">
      <button class="subtab active" data-p="easy">Tuesday — Easy Run</button>
      <button class="subtab" data-p="speed">Thursday — Speed Day</button>
      <button class="subtab" data-p="long">Sunday — Long Run</button>
    </div>
    <div class="pane active" data-pane="easy"><div class="card"><table>
      <thead><tr><th></th><th>Stage</th><th>Session</th></tr></thead>
      <tbody>${tables.easy.map(r=>rowHTML('easy', r.w, r.d)).join('')}</tbody>
    </table></div></div>
    <div class="pane" data-pane="speed"><div class="card"><table>
      <thead><tr><th></th><th>Stage</th><th>Session</th></tr></thead>
      <tbody>${tables.speed.map(r=>rowHTML('speed', r.w, r.d)).join('')}</tbody>
    </table></div></div>
    <div class="pane" data-pane="long"><div class="card">
      <div class="grid g4" style="margin-bottom:16px;">
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Goal Distance</div><div class="stat-value">${goal.distance} <small>km</small></div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Build Duration</div><div class="stat-value">${goal.weeks} <small>wks</small></div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Recovery Weeks</div><div class="stat-value">${tables.long.filter(r=>r[2]==='Recovery').length}</div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Goal</div><div class="stat-value" style="font-size:16px;">${goal.label}</div></div>
      </div>
      <table>
      <thead><tr><th></th><th class="num">Week</th><th>Distance</th><th>Note</th></tr></thead>
      <tbody>${tables.long.map(r=>rowHTML('long', r[0], `<b>${r[1]}</b>`, r[2]?`<span class="tag ${r[2]==='Recovery'?'gray':'green'}">${r[2]}</span>`:'')).join('')}</tbody>
    </table>
    ${!isLegacy30k?`<p class="muted" style="margin-top:10px;font-size:12px;">This is a general progression framework, not personalized coaching — adjust based on how your body responds.</p>`:''}
    </div></div>
    ${beforeAfterRunCards()}
  `;
  document.getElementById('runChangeGoalBtn').addEventListener('click', async ()=>{ await deleteRunningGoalKey(); renderRunning(); });
  el.querySelectorAll('#runTabs .subtab').forEach(t=>{
    t.addEventListener('click',()=>{
      el.querySelectorAll('#runTabs .subtab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      el.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===t.dataset.p));
    });
  });
  el.querySelectorAll('[data-runcheck]').forEach(box=>{
    box.addEventListener('click', async ()=>{
      const key = box.dataset.runcheck;
      const comp = await getJSON('running-completions', {});
      comp[key] = !comp[key];
      await setJSON('running-completions', comp);
      const nowDone = comp[key];
      box.classList.toggle('done', nowDone);
      box.innerHTML = nowDone ? ICONS.check : '';
      box.closest('.run-row').classList.toggle('run-row-done', nowDone);
    });
  });
  document.getElementById('rgAdd').addEventListener('click', async ()=>{
    const date = document.getElementById('rgDate').value || todayKey();
    const dist = parseFloat(document.getElementById('rgDist').value);
    const time = parseFloat(document.getElementById('rgTime').value);
    if(!dist || !time) return;
    const log = await getJSON('pace-log', []);
    log.push({date, dist, time});
    await setJSON('pace-log', log);
    // Auto-check the Long Run week whose target distance roughly matches what was just logged —
    // only the Long Run table has a directly comparable distance target (Easy/Speed are time/interval
    // based), so this only applies there. Matches the first not-yet-completed week within tolerance.
    const comp = await getJSON('running-completions', {});
    const candidate = tables.long.find(r=>{
      const key = `${goalKey}::long::${r[0]}`;
      if(comp[key]) return false;
      const target = parseFloat(r[1]);
      if(!target) return false;
      const tolerance = Math.max(0.5, target*0.15);
      return Math.abs(dist - target) <= tolerance;
    });
    if(candidate){
      comp[`${goalKey}::long::${candidate[0]}`] = true;
      await setJSON('running-completions', comp);
    }
    renderRunningGoalPlan(el, goal);
    renderTrackers();
  });
}
