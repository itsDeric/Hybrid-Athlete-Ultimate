      </div>
    </div>

    ${primary ? `<h3 style="margin-bottom:2px;">Primary</h3>${goalCardHTML(primary)}` : ''}
    ${secondary.length ? `<h3 style="margin:18px 0 2px;">Secondary</h3>${secondary.map(goalCardHTML).join('')}` : ''}
    ${!active.length ? `<div class="card" style="text-align:center;padding:32px 16px;"><p class="muted">No active goals yet — add one above to start tracking progress.</p></div>` : ''}

    ${completed.length ? `
      <h3 style="margin:24px 0 2px;">Completed</h3>
      ${completed.map(g=>`
        <div class="card" style="margin-bottom:10px;opacity:.75;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div><span class="tag green">COMPLETED</span> <b style="margin-left:8px;">${esc(g.name)}</b></div>
            <div class="goal-card-actions" style="margin-top:0;">
              <button data-reactivategoal="${g.id}">Reactivate</button>
              <button class="danger" data-deletegoal="${g.id}">Delete</button>
            </div>
          </div>
        </div>`).join('')}
    ` : ''}
  `;

  // --- Add/Edit form wiring (chip-based flow: category → [Running only: time/distance] → metric → contextual value inputs) ---
  let gfState = { category:null, runningType:null, metricId:null, editId:'', designation:'secondary', currentMode:'manual' };

  function renderTargetValueInputs(metric, target){
    const box = document.getElementById('gfTargetValueInputs');
    if(!metric){ box.innerHTML = ''; return; }
    if(metric.valueType === 'time'){
      const tgt = target!=null ? {m:Math.floor(target/60), s:target%60} : {m:'',s:''};
      box.innerHTML = `
        <div class="goal-time-row">
          <div class="field"><input id="gfTargetMin" type="number" min="0" placeholder="Min" value="${tgt.m}"></div>
          <div class="goal-time-colon">:</div>
          <div class="field"><input id="gfTargetSec" type="number" min="0" max="59" placeholder="Sec" value="${tgt.s}"></div>
        </div>`;
    } else {
      box.innerHTML = `
        <div class="field"><label>Target${metric.unit?` (${esc(metric.unit)})`:''}</label>
          <div class="goal-value-suffix"><input id="gfTargetVal" type="number" step="any" placeholder="e.g. 120" value="${target!=null?target:''}">${metric.unit?`<span>${esc(metric.unit)}</span>`:''}</div>
        </div>
        ${metric.customizable ? `
        <div class="goal-form-grid" style="margin-top:12px;">
          <div class="field"><label>Unit (optional)</label><input id="gfCustomUnit" type="text" placeholder="e.g. reps, cm" value="${esc(metric.unit||'')}"></div>
          <div class="field"><label>Direction</label>

              <option value="lower">Lower is better</option>
            </select>

      `;

  // Current value has three modes — Auto (live from an existing data source), "I don't know" (start
  // blank, capture the first live value that becomes available as the baseline), or manual entry
  // (the athlete's own starting-point number). Auto/unknown never ask for a number here at all —
  // asking for one and then ignoring it would be confusing, not helpful.
  function renderCurrentValueInputs(metric, mode, current){
    const box = document.getElementById('gfCurrentValueInputs');
    const note = document.getElementById('gfCurrentModeNote');
    if(!metric){ box.innerHTML = ''; note.textContent = ''; return; }
    if(mode === 'auto'){
      box.innerHTML = `<p class="muted" id="gfAutoPreview" style="font-size:13px;">Checking your current ${metric.label.toLowerCase()}…</p>`;
      note.textContent = "We'll keep using your actual data automatically — no need to enter a number.";
      resolveGoalCurrentValue({category: gfState.category, metricId: gfState.metricId}).then(val=>{
        const preview = document.getElementById('gfAutoPreview');
        if(!preview) return; // form moved on before this resolved
        preview.textContent = (val!==null && val!==undefined)
          ? `Currently: ${formatGoalValue(metric, val)}`
          : `No data yet for this — we'll start tracking as soon as you log something relevant.`;
      });
      return;
    }
    if(mode === 'unknown'){
      box.innerHTML = '';
      note.textContent = "No problem — we'll automatically use the next relevant thing you log as your starting point.";
      return;
    }
    // manual
    note.textContent = '';
    if(metric.valueType === 'time'){
      const cur = current!=null ? {m:Math.floor(current/60), s:current%60} : {m:'',s:''};
      box.innerHTML = `
        <div class="goal-time-row">
          <div class="field"><input id="gfCurrentMin" type="number" min="0" placeholder="Min" value="${cur.m}"></div>
          <div class="goal-time-colon">:</div>
          <div class="field"><input id="gfCurrentSec" type="number" min="0" max="59" placeholder="Sec" value="${cur.s}"></div>
        </div>`;
    } else {
      box.innerHTML = `
        <div class="field"><label>Current${metric.unit?` (${esc(metric.unit)})`:''}</label>
          <div class="goal-value-suffix"><input id="gfCurrentVal" type="number" step="any" placeholder="e.g. 100" value="${current!=null?current:''}">${metric.unit?`<span>${esc(metric.unit)}</span>`:''}</div>
        </div>`;
    }
  }

  function updateCurrentModeChips(metric){
    const autoChip = document.querySelector('#gfCurrentModeChips [data-currentmode="auto"]');
    const autoCapable = metric && isAutoCapableMetric(gfState.category, gfState.metricId);
    autoChip.style.display = autoCapable ? '' : 'none';
    if(!autoCapable && gfState.currentMode === 'auto') gfState.currentMode = 'manual';
    document.querySelectorAll('#gfCurrentModeChips [data-currentmode]').forEach(b=>b.classList.toggle('selected', b.dataset.currentmode===gfState.currentMode));
  }

  function renderMetricChips(){
    const wrap = document.getElementById('gfMetricChips');
    // For Running, only show metrics matching the chosen Time/Distance sub-step; every other
    // category shows its full metric list directly, unchanged.
    const metrics = gfState.category === 'Running'
      ? (GOAL_CATALOG.Running||[]).filter(m=>m.type===gfState.runningType)
      : (GOAL_CATALOG[gfState.category]||[]);
    wrap.innerHTML = metrics.map(m=>`<button class="goal-chip" data-metric="${m.id}">${m.label}</button>`).join('');
    wrap.querySelectorAll('[data-metric]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        wrap.querySelectorAll('[data-metric]').forEach(b=>b.classList.remove('selected'));

        const isCustom = !!metric.customizable;
        document.getElementById('gfCustomLabel').style.display = isCustom ? '' : 'none';
        document.getElementById('gfCustomNameField').style.display = isCustom ? '' : 'none';
        updateCurrentModeChips(metric);

  document.querySelectorAll('#gfCurrentModeChips [data-currentmode]').forEach(btn=>{

      document.querySelectorAll('#gfCurrentModeChips [data-currentmode]').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      gfState.currentMode = btn.dataset.currentmode;
      const metric = findGoalMetric(gfState.category, gfState.metricId);
      if(metric) renderCurrentValueInputs(metric, gfState.currentMode);
    });
  });

  function resetForm(){
    gfState = { category:null, runningType:null, metricId:null, editId:'', designation:'secondary', currentMode:'manual' };

    document.querySelectorAll('#gfRunningTypeChips [data-runtype]').forEach(b=>b.classList.remove('selected'));
    document.getElementById('gfRunningTypeStep').style.display = 'none';

    document.getElementById('gfDetailsStep').style.display = 'none';

    document.querySelectorAll('#gfCurrentModeChips [data-currentmode]').forEach(b=>b.classList.toggle('selected', b.dataset.currentmode==='manual'));

      document.querySelectorAll('#gfRunningTypeChips [data-runtype]').forEach(b=>b.classList.remove('selected'));
      if(gfState.category === 'Running'){
        // Running needs one extra decision (Time vs Distance) before metrics can be shown, since the
        // two groups have entirely different value shapes (a time input vs a plain distance number).

    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#gfRunningTypeChips [data-runtype]').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      gfState.runningType = btn.dataset.runtype;
      gfState.metricId = null;
      document.getElementById('gfDetailsStep').style.display = 'none';

      document.querySelectorAll('#gfDetailsStep [data-designation]').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');

  async function readCurrentValue(metric, mode){
    if(mode === 'manual'){
      if(metric.valueType === 'time'){
        const cm = parseInt(document.getElementById('gfCurrentMin').value);
        const cs = parseInt(document.getElementById('gfCurrentSec').value);
        if(isNaN(cm)||isNaN(cs)) return { ok:false };
        return { ok:true, value: cm*60+cs };
      }
      const v = parseFloat(document.getElementById('gfCurrentVal').value);
      if(isNaN(v)) return { ok:false };
      return { ok:true, value: v };
    }
    if(mode === 'auto'){
      // Resolve right now so the goal has an immediate baseline instead of waiting — "I don't know"
      // below is the mode for genuinely starting blank.
      const resolved = await resolveGoalCurrentValue({category: gfState.category, metricId: gfState.metricId});
      return { ok:true, value: (resolved!==null && resolved!==undefined) ? resolved : null };
    }
    // 'unknown' — deliberately never resolves now, even if data already exists; the baseline gets
    // captured later, once, by renderTrainingGoals()'s lazy-capture logic the first time a value
    // becomes available, so it genuinely reflects "the next relevant thing you log" rather than
    // whatever happened to exist at creation time.
    return { ok:true, value: null };
  }

  function readTargetInputs(metric){
    if(metric.valueType === 'time'){
      const tm = parseInt(document.getElementById('gfTargetMin').value);
      const ts = parseInt(document.getElementById('gfTargetSec').value);
      if(isNaN(tm)||isNaN(ts)) return null;
      return { targetValue: tm*60+ts, unit:'min:sec' };
    }
    const targetValue = parseFloat(document.getElementById('gfTargetVal').value);
    if(isNaN(targetValue)) return null;
    let unit = metric.unit, direction = metric.direction;
    if(metric.customizable){
      unit = document.getElementById('gfCustomUnit').value.trim();
      direction = document.getElementById('gfCustomDirection').value;
    }
    return { targetValue, unit, direction };
  }

  document.getElementById('gfSaveBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('gfMsg');
    const metric = findGoalMetric(gfState.category, gfState.metricId);
    if(!metric){ msg.textContent = 'Pick a category and a metric first.'; return; }
    if(metric.customizable && !document.getElementById('gfName').value.trim()){ msg.textContent = 'Give the goal a name.'; return; }

    const targetVals = readTargetInputs(metric);
    if(!targetVals){ msg.textContent = metric.valueType==='time' ? 'Enter minutes and seconds for the target.' : 'Enter a valid target value.'; return; }
    const { targetValue, unit } = targetVals;

    const currentResult = await readCurrentValue(metric, gfState.currentMode);
    if(!currentResult.ok){ msg.textContent = metric.valueType==='time' ? "Enter minutes and seconds for the current value, or choose Auto / I don't know." : "Enter a valid current value, or choose Auto / I don't know."; return; }
    const currentValue = currentResult.value; // may be null (auto with no data yet, or unknown)

    // 'auto' direction (e.g. body weight, where either loss or gain is a legitimate goal) is inferred
    // from which way the athlete is actually trying to move. Only Body Weight uses this, and
    // getCurrentWeight() never returns null, so currentValue is always available by this point for it.
    let direction = targetVals.direction;
    if(direction === 'auto') direction = (currentValue!==null && targetValue < currentValue) ? 'lower' : 'higher';

    const name = metric.customizable ? document.getElementById('gfName').value.trim() : metric.label;
    const deadline = document.getElementById('gfDeadline').value;
    const editId = gfState.editId;
    const currentValueMode = gfState.currentMode;

    let allGoals = await getJSON('training-goals', []);
    if(gfState.designation === 'primary'){
      // Only one Primary at a time — demote any existing one to Secondary rather than allowing two
      allGoals = allGoals.map(g => g.designation==='primary' ? {...g, designation:'secondary'} : g);
    }
    if(editId){
      allGoals = allGoals.map(g => g.id===editId ? {
        ...g, name, category: gfState.category, metricId: gfState.metricId, unit, direction,
        currentValueMode,
        // Only overwrite the stored baseline if this save actually produced a concrete number —
        // switching an existing goal to "I don't know" shouldn't erase a baseline it already has.
        ...(currentValue !== null ? { startValue: currentValue, currentValue } : {}),
        targetValue, designation: gfState.designation, deadline,
      } : g);
    } else {
      allGoals.push({
        id: 'goal-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
        name, category: gfState.category, metricId: gfState.metricId, unit, direction, currentValueMode,
        startValue: currentValue, // may be null — captured later by renderTrainingGoals() once data appears
        currentValue, targetValue, designation: gfState.designation, deadline,
        createdDate: todayKey(), status: 'active',
      });
    }
    await setJSON('training-goals', allGoals);
    renderTrainingGoals();
  });

  document.getElementById('gfCancelBtn').addEventListener('click', resetForm);

  el.querySelectorAll('[data-editgoal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const g = goals.find(x=>x.id===btn.dataset.editgoal);
      if(!g) return;
      // Goals created before this chip-based redesign won't have a metricId — fall back to the
      // "Custom Goal" metric so editing them still works, just without a catalog match.
      gfState.editId = g.id;
      gfState.category = GOAL_CATALOG[g.category] ? g.category : 'Other';
      gfState.metricId = (g.metricId && findGoalMetric(gfState.category, g.metricId)) ? g.metricId : 'custom';
      gfState.designation = g.designation;

      document.querySelectorAll('#gfCategoryChips [data-category]').forEach(b=>b.classList.toggle('selected', b.dataset.category===gfState.category));

      const editMetric = findGoalMetric(gfState.category, gfState.metricId);
      document.querySelectorAll('#gfRunningTypeChips [data-runtype]').forEach(b=>b.classList.remove('selected'));
      if(gfState.category === 'Running'){
        gfState.runningType = editMetric ? editMetric.type : 'time';
        document.getElementById('gfRunningTypeStep').style.display = '';
        const typeBtn = document.querySelector(`#gfRunningTypeChips [data-runtype="${gfState.runningType}"]`);
        if(typeBtn) typeBtn.classList.add('selected');
      } else {
        gfState.runningType = null;
        document.getElementById('gfRunningTypeStep').style.display = 'none';
      }
      document.getElementById('gfMetricStep').style.display = '';
      renderMetricChips();
      const metricBtn = document.querySelector(`#gfMetricChips [data-metric="${gfState.metricId}"]`);
      if(metricBtn) metricBtn.classList.add('selected');

      const metric = editMetric || GOAL_CATALOG.Other[0];
      document.getElementById('gfDetailsStep').style.display = '';
      const isCustom = !!metric.customizable;
      document.getElementById('gfCustomLabel').style.display = isCustom ? '' : 'none';
      document.getElementById('gfCustomNameField').style.display = isCustom ? '' : 'none';
      if(isCustom) document.getElementById('gfName').value = g.name;
      // Legacy goals (saved before this current-value-mode feature existed) have no
      // currentValueMode field at all — treat them as 'manual' so their existing behavior and stored
      // number are preserved exactly as before, rather than silently switching them to Auto.
      gfState.currentMode = g.currentValueMode || 'manual';
      updateCurrentModeChips(metric);
      renderCurrentValueInputs(metric, gfState.currentMode, g.currentValue);
      renderTargetValueInputs(metric, g.targetValue);
      if(isCustom){
        document.getElementById('gfCustomUnit').value = g.unit || '';
        document.getElementById('gfCustomDirection').value = g.direction === 'lower' ? 'lower' : 'higher';
      }
      document.getElementById('gfDeadline').value = g.deadline || '';
      document.querySelectorAll('#gfDetailsStep [data-designation]').forEach(b=>b.classList.toggle('selected', b.dataset.designation===g.designation));
      document.getElementById('goalFormTitle').textContent = 'Edit Goal';
      document.getElementById('gfSaveBtn').textContent = 'Save Changes';
      document.getElementById('gfCancelBtn').style.display = '';
      document.getElementById('gfMsg').textContent = '';
      el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  el.querySelectorAll('[data-setprimary]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let allGoals = await getJSON('training-goals', []);
      allGoals = allGoals.map(g => ({...g, designation: g.id===btn.dataset.setprimary ? 'primary' : (g.designation==='primary' ? 'secondary' : g.designation)}));
      await setJSON('training-goals', allGoals);
      renderTrainingGoals();
    });
  });

  el.querySelectorAll('[data-completegoal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let allGoals = await getJSON('training-goals', []);
      allGoals = allGoals.map(g => g.id===btn.dataset.completegoal ? {...g, status:'completed'} : g);
      await setJSON('training-goals', allGoals);
      renderTrainingGoals();
    });
  });

  el.querySelectorAll('[data-reactivategoal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      let allGoals = await getJSON('training-goals', []);
      allGoals = allGoals.map(g => g.id===btn.dataset.reactivategoal ? {...g, status:'active'} : g);
      await setJSON('training-goals', allGoals);
      renderTrainingGoals();
    });
  });

  // Delete uses an inline two-step confirm (this app avoids confirm()/alert() — they're blocked in
  // the sandboxed preview and inconsistent across the installed PWA) rather than deleting on one tap.
  el.querySelectorAll('[data-deletegoal]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.confirming !== 'true'){
        btn.dataset.confirming = 'true';
        btn.textContent = 'Confirm Delete?';
        setTimeout(()=>{ if(btn.dataset.confirming==='true'){ btn.dataset.confirming='false'; btn.textContent='Delete'; } }, 3000);
        return;
      }
      let allGoals = await getJSON('training-goals', []);
      allGoals = allGoals.filter(g => g.id !== btn.dataset.deletegoal);
      await setJSON('training-goals', allGoals);
      renderTrainingGoals();
    });
  });
}

/* ---------- Backup reminder banner — the universal fallback (works on iOS Safari too, where the
   auto-backup-folder feature above isn't available). Shown on Overview since it's the first/most-
   viewed screen. Deliberately non-blocking and dismissible — this is a safety net, not a nag wall. */
const BACKUP_REMINDER_DAYS = 7;
function hasAnyLoggedData(){
  return Object.keys(localStorage).some(k=> k.startsWith(LS_PREFIX));
}
function shouldShowBackupReminder(){
  if(!hasAnyLoggedData()) return false; // nothing at risk yet on a fresh install
  const meta = getBackupMeta();
  if(meta.reminderSnoozedUntil && Date.now() < new Date(meta.reminderSnoozedUntil).getTime()) return false;
  return daysSinceISO(meta.lastBackupAt) >= BACKUP_REMINDER_DAYS;
}
function backupReminderHTML(){
  if(!shouldShowBackupReminder()) return '';
  const meta = getBackupMeta();
  const lastLabel = meta.lastBackupAt ? timeAgoLabel(meta.lastBackupAt) : 'never';
  return `
  <div class="card" id="backupReminderCard" style="margin-bottom:14px;border:1px solid rgba(201,138,18,.35);background:rgba(201,138,18,.06);">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
      <div>
        <h3 style="color:var(--amber);">Back up your training data</h3>
        <p class="muted" style="margin-top:4px;">Last backup: ${lastLabel}. Everything lives only on this device — losing it (a full browser data clear, a lost phone) can't be undone without one.</p>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="btn ghost" id="backupReminderSnooze">Remind me later</button>
        <button class="btn" id="backupReminderAction">Back up now</button>
      </div>
    </div>
  </div>`;
}
function wireBackupReminderCard(){
  const actionBtn = document.getElementById('backupReminderAction');
  const snoozeBtn = document.getElementById('backupReminderSnooze');
  if(!actionBtn) return;
  actionBtn.addEventListener('click', async ()=>{
    await runBestAvailableBackup();
    renderOverview();
  });
  snoozeBtn.addEventListener('click', ()=>{
    setBackupMeta({ reminderSnoozedUntil: new Date(Date.now()+3*86400000).toISOString() });
    renderOverview();
  });
}

  function wireGoalEdit(prefix, key){

    });
  }
  wireGoalEdit('ovPrimary','primary');
  wireGoalEdit('ovSecondary','secondary');
}

    list.querySelectorAll('[data-setactive]').forEach(b=>b.addEventListener('click', async ()=>{
      await setJSON('active-program', b.dataset.setactive);
      renderPrograms(); renderWeek(); renderOverview(); renderRecovery(); renderNutrition(); renderTimeline(); renderCheat();
    }));
    list.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(b.dataset.confirming !== '1'){

          b.innerHTML = 'Tap again to confirm';

          b._revertTimer = setTimeout(revert, 3000);
          return;
        }
        clearTimeout(b._revertTimer);
        let arr = await getJSON('custom-programs', []);
        arr = arr.filter(p=>p.id!==b.dataset.del);

        renderCheat();

function mergeProgIntoList(programs, prog){

}

/* ============================================================
   SESSION MODE — live workout flow with rest timer
============================================================ */
let SESSION = null; // { exercises, idx, sourceInfo, setsDone: [[bool,...],...], restInterval, restSeconds }

function parseSetCount(setsVal){
  const m = String(setsVal).match(/\d+/g);
  if(!m) return 3;
  return parseInt(m[m.length-1]); // use the higher number if it's a range like "3-4"
}

function inferRestSeconds(repsVal){
  const nums = String(repsVal).match(/\d+/g);
  if(!nums || !nums.length) return 90;
  const maxRep = Math.max(...nums.map(Number));
  if(maxRep <= 6) return 150;   // heavy strength work — longer rest
  if(maxRep <= 10) return 90;   // moderate hypertrophy range
  return 60;                    // higher-rep / isolation work — shorter rest
}

// Set types — tap a set's badge in Session Mode to cycle through these
const SET_TYPE_ORDER = ['working','warmup','drop','failure'];
const SET_TYPE_META = {
  working: { label:'Working', class:'type-working' },
  warmup:  { label:'Warm-up', class:'type-warmup' },
  drop:    { label:'Drop Set', class:'type-drop' },
  failure: { label:'Failure', class:'type-failure' },
};
function nextSetType(t){
  const i = SET_TYPE_ORDER.indexOf(t);
  return SET_TYPE_ORDER[(i+1) % SET_TYPE_ORDER.length];
}
// Warm-up and drop sets use short fixed rest regardless of rep range; working/failure use the smart inference
function restSecondsForSet(type, repsVal){
  if(type === 'warmup') return 45;
  if(type === 'drop') return 30;
  return inferRestSeconds(repsVal);
}

// Plate calculator — greedy breakdown assuming a standard 20kg Olympic bar and common plate sizes.
// Uses unlimited-pairs assumption (typical commercial gym), not a specific rack's actual inventory.
const PLATE_SIZES = [25, 20, 15, 10, 5, 2.5, 1.25];
function plateBreakdown(totalWeight, barWeight){
  barWeight = barWeight || 20;
  const total = parseFloat(totalWeight);
  if(!total || total <= barWeight) return null;
  let perSide = (total - barWeight) / 2;
  const used = [];
  PLATE_SIZES.forEach(plate=>{
    while(perSide >= plate - 0.001){ used.push(plate); perSide -= plate; }
  });
  const leftover = Math.round(perSide*100)/100;
  return { perSideText: used.length ? used.map(p=> p%1===0?p:p.toFixed(2)).join(' + ') : 'Bar only', leftover };
}

// Warm-up auto-suggestion — percentage ramp of the exercise's working weight, rounded to the nearest
// 2.5kg plate increment. Recomputed across all warm-up sets in the exercise whenever set types change,
// but skips any set the user has manually typed a weight into (tracked via weightAuto).
const WARMUP_PCTS = [0.4, 0.6, 0.8, 0.9];
const DROP_PCTS = [0.75, 0.65, 0.55, 0.45]; // each successive drop set goes lighter than the last
function roundToPlate(kg){ return Math.max(2.5, Math.round(kg/2.5)*2.5); }
// Unified auto-fill across all set types — runs whenever a set's type changes or a set is added.
// Working/Failure sets load the full reference weight; Warm-ups ramp 40/60/80/90%; Drop sets step
// progressively lighter (75/65/55/45%, then -10% per additional drop, floor 20%) rather than all
// landing at a flat percentage. Any set the user has manually typed into (weightAuto===false) is
// left untouched, so this never clobbers a deliberate entry.
function applyTypeAutoFill(sets, refWeight){
  if(!refWeight) return;
  let warmupOrder = 0, dropOrder = 0;
  sets.forEach(s=>{
    if(s.weightAuto === false) return; // user manually edited this one — leave it alone
    if(s.type === 'working' || s.type === 'failure'){
      s.weight = String(refWeight);
      s.weightAuto = true;
    } else if(s.type === 'warmup'){
      const pct = WARMUP_PCTS[warmupOrder] !== undefined ? WARMUP_PCTS[warmupOrder] : WARMUP_PCTS[WARMUP_PCTS.length-1];
      s.weight = String(roundToPlate(refWeight * pct));
      s.weightAuto = true;
      warmupOrder++;
    } else if(s.type === 'drop'){
      const pct = DROP_PCTS[dropOrder] !== undefined ? DROP_PCTS[dropOrder] : Math.max(0.2, DROP_PCTS[DROP_PCTS.length-1] - 0.1*(dropOrder-DROP_PCTS.length+1));
      s.weight = String(roundToPlate(refWeight * pct));
      s.weightAuto = true;
      dropOrder++;
    }
  });
}

async function startSessionMode(exercises, sourceInfo){
  // Prefill each set's weight from the shared exercise-weight store — same value everywhere this exercise appears
  const sharedWeights = await getAllExerciseWeights();
  const history = await getJSON('session-history', []);
  SESSION = {
    exercises,
    idx: 0,
    sourceInfo,
    history,
    refWeight: exercises.map(e => parseFloat(sharedWeights[e.name]) || 0),
    setData: exercises.map(e => {
      const count = parseSetCount(e.sets);
      const defaultWeight = sharedWeights[e.name] || '';
      return new Array(count).fill(null).map(()=> ({ type:'working', weight: defaultWeight, reps:'', done:false, weightAuto:null }));
    }),
    restInterval: null,
    restSeconds: 0,
  };

  const overlay = document.createElement('div');
  overlay.className = 'session-overlay';
  overlay.id = 'sessionOverlay';
  document.body.appendChild(overlay);
  // Push a history entry marking Session Mode as open, so the first back-press closes it instead of
  // exiting the app. Using window.history explicitly since a local `history` (session log) variable
  // shadows the global in this function's scope.
  window.history.pushState({ session:true }, '', '#session');
  renderSessionExercise();
}

// "Last time" reference — finds the most recent prior session that logged this exercise with per-set
// data, so Session Mode can show what you actually did last time right next to what you're doing now.
function getLastTimeSets(exerciseName){
  // Iterate in reverse insertion order (not sorted by date string) — session-history entries are
  // pushed chronologically as sessions finish, but multiple sessions on the same calendar day share
  // an identical date string, so sorting by date alone can't tell which same-day session was more
  // recent. Insertion order always reflects true chronological order regardless of same-day ties.
  const history = SESSION.history || [];
  for(let i=history.length-1; i>=0; i--){
    const s = history[i];
    const match = (s.exercises||[]).find(e=> e.name===exerciseName && e.sets && e.sets.some(set=>set.done));
    if(match) return match.sets;
  }
  return null;
}
function lastWorkingSetText(lastSets){
  if(!lastSets) return '';
  // Only Working sets represent what you actually treat as "last time" — Warm-up/Drop/Failure sets
  // are deliberately lighter or contextual and would be misleading shown as your reference point.
  const ref = lastSets.slice().reverse().find(s=> s.done && s.type==='working' && s.weight);
  if(!ref) return '';
  return `Last working set: ${ref.weight}kg${ref.reps?' × '+ref.reps:''}`;
}

// Progressive overload suggestion — compares your last session's completed Working sets against the
// program's prescribed rep range and recommends a next step: increase weight if you hit the top of
// range on every set, deload if you missed the range by a wide margin, or repeat and chase more reps
// otherwise. This is a general heuristic, not personalized coaching.
function parseRepRange(str){
  const nums = String(str).match(/\d+/g);
  if(!nums || !nums.length) return null;
  const vals = nums.map(Number);
  return { min: Math.min(...vals), max: Math.max(...vals) };
}
function suggestProgressiveOverload(lastSets, prescribedReps){
  if(!lastSets) return null;
  const range = parseRepRange(prescribedReps);
  if(!range) return null;
  const working = lastSets.filter(s=> s.done && s.type==='working' && s.weight && s.reps);
  if(!working.length) return null;
  const lastWeight = parseFloat(working[working.length-1].weight);
  if(!lastWeight) return null;
  const repsArr = working.map(s=>parseInt(s.reps));
  const avgReps = repsArr.reduce((a,b)=>a+b,0)/repsArr.length;
  const allHitTop = repsArr.every(r=> r>=range.max);
  if(allHitTop){
    const bump = lastWeight>=40 ? 2.5 : 1.25; // smaller increments for lighter loads (isolation work, dumbbells)
    const target = roundToPlate(lastWeight+bump);
    return { action:'increase', weight:target, message:`You hit ${range.max}+ reps on every working set last time — try ${target}kg today.` };
  }
  if(avgReps < range.min*0.7){
    const target = roundToPlate(lastWeight*0.9);
    return { action:'deload', weight:target, message:`You missed the rep target by a wide margin last time — ${target}kg to rebuild form and confidence might be worth trying.` };
  }
  return { action:'repeat', weight:lastWeight, message:`Within range but not maxed out — repeat ${lastWeight}kg and aim for ${range.max} reps on every set.` };
}

  const overload = suggestProgressiveOverload(lastSetsData, ex.reps);
  const overloadClass = overload ? { increase:'overload-up', deload:'overload-down', repeat:'overload-flat' }[overload.action] : '';
  const overloadIcon = overload ? { increase:'📈', deload:'📉', repeat:'🔁' }[overload.action] : '';

  overlay.innerHTML = `

      <div style="width:34px;"></div>
    </div>
    <div class="session-body">
      <div class="session-exname">${esc(ex.name)}</div>
      <div class="session-target">${esc(ex.sets)} × ${esc(ex.reps)}</div>

      ${overload?`
      <div class="overload-suggestion ${overloadClass}">
        <div>${overloadIcon} ${overload.message}</div>
        <button class="overload-apply-btn" id="applyOverloadBtn">Apply ${overload.weight}kg to working sets</button>
      </div>`:''}
      <div class="session-hint">Tap a badge to change set type — Working/Failure load your full weight, Warm-up ramps up, Drop Set defaults to 75%. Add or remove sets freely below.</div>
      <div class="session-sets">
        ${sets.map((s,i)=>{
          const meta = SET_TYPE_META[s.type];
          return `
          <div class="session-set-row ${s.done?'done':''}" data-setidx="${i}">
            <div class="set-row-top">
              <span class="set-label">Set ${i+1}</span>
              <button class="set-type-badge ${meta.class}" data-typebtn="${i}">${meta.label}</button>
              <div class="set-check" data-checkbtn="${i}">${ICONS.check}</div>
            </div>
            <div class="set-row-inputs">
              <input class="set-input" type="text" inputmode="decimal" data-weightinput="${i}" value="${s.weight||''}" placeholder="kg">
              <span class="set-x">×</span>
              <input class="set-input" type="text" inputmode="numeric" data-repsinput="${i}" value="${esc(s.reps||'')}" placeholder="${esc(ex.reps)}">

            </div>
            <div class="plate-readout" data-plateout="${i}" style="display:none;"></div>
            ${sets.length>1?`<div class="set-remove-row"><button class="set-remove-btn" data-removebtn="${i}">Delete set</button></div>`:''}
          </div>`;
        }).join('')}
      </div>
      <button class="add-set-btn" id="addSetBtn">+ Add Set</button>
    </div>
    <div class="session-nav">
      ${SESSION.idx>0?`<button class="nav-prev" id="sessionPrevBtn">◀ Prev</button>`:''}
      ${isLast
        ? `<button class="nav-finish" id="sessionFinishBtn">Finish Session</button>`

    </div>
  `;

  overlay.querySelectorAll('[data-typebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.typebtn);
      sets[i].type = nextSetType(sets[i].type);
      applyTypeAutoFill(sets, SESSION.refWeight[SESSION.idx]);
      renderSessionExercise(); // full re-render so any auto-filled weights show immediately
    });

  overlay.querySelectorAll('[data-removebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.removebtn);
      if(sets.length <= 1) return; // always keep at least one set
      sets.splice(i, 1);

  const addSetBtn = document.getElementById('addSetBtn');
  if(addSetBtn) addSetBtn.addEventListener('click', ()=>{
    sets.push({ type:'working', weight:'', reps:'', done:false, weightAuto:null });
    applyTypeAutoFill(sets, SESSION.refWeight[SESSION.idx]);
    renderSessionExercise();
  });

  const applyOverloadBtn = document.getElementById('applyOverloadBtn');
  if(applyOverloadBtn && overload) applyOverloadBtn.addEventListener('click', ()=>{
    // Explicit user action — overrides manual edits too, unlike the passive type-change auto-fill
    sets.forEach(s=>{ if(s.type==='working'){ s.weight = String(overload.weight); s.weightAuto = true; } });
    renderSessionExercise();
  });

  overlay.querySelectorAll('[data-checkbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.checkbtn);
      const wasDone = sets[i].done;

      btn.closest('.session-set-row').classList.toggle('done', !wasDone);
      if(!wasDone){

  overlay.querySelectorAll('[data-weightinput]').forEach(inp=>{
    inp.addEventListener('input', (e)=>{

      sets[i].weightAuto = false; // user typed a value — stop auto-suggesting over it

  overlay.querySelectorAll('[data-repsinput]').forEach(inp=>{

  overlay.querySelectorAll('[data-platebtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.platebtn);
      const out = overlay.querySelector(`[data-plateout="${i}"]`);
      if(!out) return;
      if(out.style.display !== 'none'){ out.style.display = 'none'; return; }
      const bd = plateBreakdown(sets[i].weight, 20);
      out.innerHTML = bd
        ? `Per side: <b>${bd.perSideText}</b> kg${bd.leftover>0 ? ` <span class="muted">(~${bd.leftover}kg short of an exact plate match)</span>` : ''} — assumes a 20kg bar`
        : `Enter a weight above ${20}kg to see a plate breakdown`;
      out.style.display = 'block';
    });
  });

  document.getElementById('sessionCloseBtn').addEventListener('click', ()=> history.back());
  const prevBtn = document.getElementById('sessionPrevBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ SESSION.idx--; renderSessionExercise(); });
  const nextBtn = document.getElementById('sessionNextBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ SESSION.idx++; renderSessionExercise(); });
  const finishBtn = document.getElementById('sessionFinishBtn');
  if(finishBtn) finishBtn.addEventListener('click', finishSessionMode);
}

function startRestTimer(seconds){
  clearInterval(SESSION.restInterval);
  SESSION.restSeconds = seconds;
  const rest = document.createElement('div');
  rest.className = 'session-rest';
  rest.id = 'sessionRestOverlay';
  document.body.appendChild(rest);
  renderRestTimer();

  SESSION.restInterval = setInterval(()=>{
    SESSION.restSeconds--;
    if(SESSION.restSeconds <= 0){
      endRestTimer();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    renderRestTimer();
  }, 1000);
}

function renderRestTimer(){
  const rest = document.getElementById('sessionRestOverlay');
  if(!rest) return;
  const mins = Math.floor(SESSION.restSeconds/60);
  const secs = SESSION.restSeconds%60;
  rest.innerHTML = `
    <div class="rest-label">Rest</div>
    <div class="rest-time">${mins}:${secs<10?'0':''}${secs}</div>
    <div class="rest-actions">
      <button id="restMinus">-15s</button>
      <button class="skip" id="restSkip">Skip Rest</button>
      <button id="restPlus">+15s</button>
    </div>
  `;
  document.getElementById('restMinus').addEventListener('click', ()=>{ SESSION.restSeconds = Math.max(0, SESSION.restSeconds-15); renderRestTimer(); });
  document.getElementById('restPlus').addEventListener('click', ()=>{ SESSION.restSeconds += 15; renderRestTimer(); });
  document.getElementById('restSkip').addEventListener('click', endRestTimer);
}

function endRestTimer(){
  clearInterval(SESSION.restInterval);
  const rest = document.getElementById('sessionRestOverlay');
  if(rest) rest.remove();
}

async function finishSessionMode(){
  const { sourceInfo, exercises, setData } = SESSION;

  // Representative weight per exercise = last COMPLETED Working (or Failure) set's weight.
  // Must check `done` first — every set starts prefilled with the old default weight, so an
  // untouched, never-completed set still has a truthy weight and would otherwise get picked
  // over a set you actually did (e.g. finishing only Set 1 at a new weight while Sets 2-4 sit
  // untouched at their stale prefilled value).
  // Critically, this must NEVER fall back to Warm-up or Drop Set weights — those are intentionally
  // lighter than your working weight by design, and letting them leak into the shared working-weight
  // store would silently corrupt it (e.g. a 70kg warm-up overwriting an actual 90kg working weight).
  function representativeWeight(sets){
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].done && sets[i].type==='working' && sets[i].weight) return sets[i].weight; }
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].done && sets[i].type==='failure' && sets[i].weight) return sets[i].weight; }
    for(let i=sets.length-1;i>=0;i--){ if(sets[i].type==='working' && sets[i].weight) return sets[i].weight; } // fallback: nothing checked done but a working-type weight was typed in
    return '';
  }

  const repWeights = exercises.map((e,i)=> representativeWeight(setData[i]));

  // Save each logged weight to the shared store — syncs to this exercise everywhere it appears
  for(let i=0; i<exercises.length; i++){
    if(repWeights[i]) await setExerciseWeight(exercises[i].name, repWeights[i]);
  }

  // --- Auto PR detection ---
  // Compares this session's completed working sets against everything logged before it (session
  // history + any manually-added PRs) and flags new bests, so PRs surface automatically instead of
  // requiring a separate manual entry every time.
  const priorHistory = await getJSON('session-history', []);
  const priorPRs = await getJSON('pr-log', []);
  function baselineFor(name){
    let maxWeight = 0, max1RM = 0, maxSessionVolume = 0;
    priorHistory.forEach(s=>{
      let sessionVolume = 0;
      (s.exercises||[]).forEach(e=>{
        if(e.name !== name) return;
        (e.sets||[]).forEach(set=>{
          if(!set.done || set.type!=='working') return;
          const w = parseFloat(set.weight);
          if(w && w > maxWeight) maxWeight = w;
          const oneRM = estimated1RM(set.weight, set.reps);
          if(oneRM && oneRM > max1RM) max1RM = oneRM;
          if(w && set.reps) sessionVolume += w * parseInt(set.reps);
        });
      });
      if(sessionVolume > maxSessionVolume) maxSessionVolume = sessionVolume;
    });
    priorPRs.forEach(p=>{
      if(p.ex !== name) return;
      const w = parseFloat(p.w);
      if(w && w > maxWeight) maxWeight = w;
      const oneRM = estimated1RM(p.w, p.r);
      if(oneRM && oneRM > max1RM) max1RM = oneRM;
    });
    return { maxWeight, max1RM, maxSessionVolume };
  }
  const newPRs = [];
  exercises.forEach((e,i)=>{
    const doneWorking = setData[i].filter(s=>s.done && s.type==='working' && s.weight);
    if(!doneWorking.length) return;
    const baseline = baselineFor(e.name);
    let sessionVolume = 0;
    let bestWeightSet = null, bestOneRM = 0, bestOneRMSet = null;
    doneWorking.forEach(s=>{
      const w = parseFloat(s.weight);
      if(w && (!bestWeightSet || w > parseFloat(bestWeightSet.weight))) bestWeightSet = s;
      const oneRM = estimated1RM(s.weight, s.reps);
      if(oneRM && oneRM > bestOneRM){ bestOneRM = oneRM; bestOneRMSet = s; }
      if(w && s.reps) sessionVolume += w * parseInt(s.reps);
    });
    if(bestWeightSet && parseFloat(bestWeightSet.weight) > baseline.maxWeight){
      newPRs.push({ ex:e.name, type:'Weight PR', w:bestWeightSet.weight, r:bestWeightSet.reps||'', prev:baseline.maxWeight||null });
    }
    if(bestOneRMSet && bestOneRM > baseline.max1RM && (!bestWeightSet || bestOneRMSet !== bestWeightSet)){
      newPRs.push({ ex:e.name, type:'Est. 1RM PR', w:bestOneRMSet.weight, r:bestOneRMSet.reps||'', prev: baseline.max1RM ? Math.round(baseline.max1RM*10)/10 : null });
    }
    if(sessionVolume > baseline.maxSessionVolume && baseline.maxSessionVolume > 0){
      newPRs.push({ ex:e.name, type:'Volume PR', w:Math.round(sessionVolume), r:'', prev:Math.round(baseline.maxSessionVolume) });
    }
  });
  if(newPRs.length){
    const prLog = await getJSON('pr-log', []);
    newPRs.forEach(p=> prLog.push({ date: todayKey(), ex:p.ex, w:p.w, r:p.r, type:p.type, auto:true }));
    await setJSON('pr-log', prLog);
  }

  // Log this session permanently — this is what powers the progress charts
  const history = await getJSON('session-history', []);
  history.push({
    date: todayKey(),
    day: sourceInfo.day,
    source: sourceInfo.source === 'builtin' ? 'Hybrid Athlete' : (sourceInfo.progId || 'Custom'),
    exercises: exercises.map((e,i)=>({
      name: e.name,
      weight: repWeights[i] || '', // kept for backward-compat with existing charts/migration
      sets: setData[i].map(s=>({ type:s.type, weight:s.weight||'', reps:s.reps||'', done:s.done })),
      setsCompleted: setData[i].filter(s=>s.done).length,
      totalSets: setData[i].length,
      workingSetsCompleted: setData[i].filter(s=>s.done && s.type==='working').length,
    })),
  });
  await setJSON('session-history', history);

  // Mark today's habit as done if this session is for today
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  if(sourceInfo.day === todayName){
    const key = 'habits:'+todayKey();
    const state = await getJSON(key, {});
    state['workout'] = true;
    await setJSON(key, state);
  }

  // Keep the Gym Dashboard on the day you just trained instead of snapping back to the first day of the week
  GYM_STATE.activeDay = sourceInfo.day;

  // Route through history.back() rather than calling closeSessionMode() directly — otherwise the
  // "session open" history entry pushed when Session Mode started is left stranded on the stack,
  // and the next back-press would land on the wrong view instead of where the user actually was.
  // Must use window.history explicitly — the local `history` (the session-history array, declared
  // above) shadows the global History API for the rest of this function's scope, so a bare
  // `history.back()` throws "history.back is not a function" instead of navigating back.
  window.history.back();
  renderGym();
  renderCheat();
  renderHabits();
  renderTrackers();
  if(newPRs.length) showPRToast(newPRs);
}

function showPRToast(prs){
  const toast = document.createElement('div');
  toast.className = 'pr-toast';
  toast.innerHTML = `
    <div class="pr-toast-head">🎉 New Personal Record${prs.length>1?'s':''}!</div>
    ${prs.map(p=>`
      <div class="pr-toast-row">
        <span class="pr-toast-ex">${p.ex}</span>
        <span class="pr-toast-type">${p.type}</span>
        <span class="pr-toast-val">${p.w}${p.type==='Volume PR'?' kg total':p.r?' kg × '+p.r:' kg'}${p.prev?` <span class="pr-toast-prev">(was ${p.type==='Volume PR'?p.prev+' kg':p.prev+' kg'})</span>`:''}</span>
      </div>`).join('')}
  `;
  document.body.appendChild(toast);
  requestAnimationFrame(()=> toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=> toast.remove(), 400);
  }, 5000 + prs.length*1200);
}

function closeSessionMode(){
  if(SESSION) clearInterval(SESSION.restInterval);
  const rest = document.getElementById('sessionRestOverlay');
  if(rest) rest.remove();
  const overlay = document.getElementById('sessionOverlay');
  if(overlay) overlay.remove();
  SESSION = null;
}

      </div>

      const id = card.dataset.goal;
      if(id === 'freeform'){
        await setJSON('running-goal', null);
        renderRunning(); renderCountdown(); return;
      }
      if(id === 'custom'){
        const distance = parseFloat(prompt('Target distance in km (e.g. 15):','15'));
        const weeks = parseInt(prompt('Weeks to build up (6–24):','12'));
        if(!distance || !weeks) return;
        await setJSON('running-goal', { id:'custom', label:`${distance} km`, distance, weeks, startedOn:todayKey() });
        renderRunning(); renderCountdown(); return;
      }
      const preset = RUNNING_GOAL_PRESETS.find(p=>p.id===id);
      await setJSON('running-goal', Object.assign({}, preset, { startedOn:todayKey() }));
      renderRunning(); renderCountdown();
    });
  });
}

async function renderRunningGoalPlan(el, goal){
  const isLegacy30k = goal.id === '30k';
  const tables = isLegacy30k ? { easy:RUN_EASY, speed:RUN_SPEED, long:RUN_LONG } : generateRunProgression(goal.distance, goal.weeks);
  const completions = await getJSON('running-completions', {});
  const goalKey = goal.id + ':' + (goal.startedOn||'');
  const rLog = (await getJSON('pace-log', [])).slice().reverse().slice(0,5);

  function rowHTML(type, w, sessionText, noteHTML){
    const key = `${goalKey}::${type}::${w}`;
    const done = !!completions[key];
    return `<tr class="run-row ${done?'run-row-done':''}" data-key="${key}">
      <td style="width:34px;"><div class="check-box ${done?'done':''}" data-runcheck="${key}">${done?ICONS.check:''}</div></td>
      <td><span class="tag blue">${w}</span></td>
      <td>${sessionText}</td>
      ${noteHTML!==undefined?`<td>${noteHTML}</td>`:''}
    </tr>`;
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">${goal.weeks}× Weekly Build</div>
      <div class="page-title">Running Dashboard</div>
      <div class="page-sub">${goal.weeks}-week build toward ${goal.distance}&nbsp;km${isLegacy30k?' — the original Hybrid Athlete plan':''}.</div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">${runningGoalHeaderControls()}</div>
    <div class="card" style="margin-bottom:14px;">
      <h3>Log a Run</h3>
      <p class="muted" style="margin-top:2px;">Logging here goes straight to your Running Pace tracker, regardless of which planned session it was.</p>
      <div class="form-row" style="margin-top:10px;">
        <div class="field"><label>Date</label><input type="date" id="rgDate" value="${todayKey()}"></div>
        <div class="field"><label>Distance (km)</label><input type="number" step="0.1" id="rgDist" placeholder="${goal.distance}"></div>
        <div class="field"><label>Time (min)</label><input type="number" step="0.5" id="rgTime" placeholder="30"></div>
        <button class="btn" id="rgAdd">Log Run</button>
      </div>
      ${rLog.length?`<table style="margin-top:14px;"><thead><tr><th>Date</th><th class="num">Distance</th><th class="num">Time</th></tr></thead>
      <tbody>${rLog.map(r=>`<tr><td>${r.date}</td><td class="num">${r.dist} km</td><td class="num">${r.time} min</td></tr>`).join('')}</tbody></table>`:''}
    </div>
    <div class="subtabs" id="runTabs">
      <button class="subtab active" data-p="easy">Tuesday — Easy Run</button>
      <button class="subtab" data-p="speed">Thursday — Speed Day</button>
      <button class="subtab" data-p="long">Sunday — Long Run</button>
    </div>
    <div class="pane active" data-pane="easy"><div class="card"><table>
      <thead><tr><th></th><th>Stage</th><th>Session</th></tr></thead>
      <tbody>${tables.easy.map(r=>rowHTML('easy', r.w, r.d)).join('')}</tbody>
    </table></div></div>
    <div class="pane" data-pane="speed"><div class="card"><table>
      <thead><tr><th></th><th>Stage</th><th>Session</th></tr></thead>
      <tbody>${tables.speed.map(r=>rowHTML('speed', r.w, r.d)).join('')}</tbody>
    </table></div></div>
    <div class="pane" data-pane="long"><div class="card">
      <div class="grid g4" style="margin-bottom:16px;">
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Goal Distance</div><div class="stat-value">${goal.distance} <small>km</small></div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Build Duration</div><div class="stat-value">${goal.weeks} <small>wks</small></div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Recovery Weeks</div><div class="stat-value">${tables.long.filter(r=>r[2]==='Recovery').length}</div></div>
        <div class="stat-card" style="background:var(--gray-50);border-radius:12px;padding:14px;"><div class="stat-label">Goal</div><div class="stat-value" style="font-size:16px;">${goal.label}</div></div>
      </div>
      <table>
      <thead><tr><th></th><th class="num">Week</th><th>Distance</th><th>Note</th></tr></thead>
      <tbody>${tables.long.map(r=>rowHTML('long', r[0], `<b>${r[1]}</b>`, r[2]?`<span class="tag ${r[2]==='Recovery'?'gray':'green'}">${r[2]}</span>`:'')).join('')}</tbody>
    </table>
    ${!isLegacy30k?`<p class="muted" style="margin-top:10px;font-size:12px;">This is a general progression framework, not personalized coaching — adjust based on how your body responds.</p>`:''}
    </div></div>
    ${beforeAfterRunCards()}
  `;
  document.getElementById('runChangeGoalBtn').addEventListener('click', async ()=>{ await deleteRunningGoalKey(); renderRunning(); });
  el.querySelectorAll('#runTabs .subtab').forEach(t=>{
    t.addEventListener('click',()=>{
      el.querySelectorAll('#runTabs .subtab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      el.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.dataset.pane===t.dataset.p));
    });
  });
  el.querySelectorAll('[data-runcheck]').forEach(box=>{
    box.addEventListener('click', async ()=>{
      const key = box.dataset.runcheck;
      const comp = await getJSON('running-completions', {});
      comp[key] = !comp[key];
      await setJSON('running-completions', comp);
      const nowDone = comp[key];
      box.classList.toggle('done', nowDone);
      box.innerHTML = nowDone ? ICONS.check : '';
      box.closest('.run-row').classList.toggle('run-row-done', nowDone);
    });
  });
  document.getElementById('rgAdd').addEventListener('click', async ()=>{
    const date = document.getElementById('rgDate').value || todayKey();
    const dist = parseFloat(document.getElementById('rgDist').value);
    const time = parseFloat(document.getElementById('rgTime').value);
    if(!dist || !time) return;
    const log = await getJSON('pace-log', []);
    log.push({date, dist, time});
    await setJSON('pace-log', log);
    // Auto-check the Long Run week whose target distance roughly matches what was just logged —
    // only the Long Run table has a directly comparable distance target (Easy/Speed are time/interval
    // based), so this only applies there. Matches the first not-yet-completed week within tolerance.
    const comp = await getJSON('running-completions', {});
    const candidate = tables.long.find(r=>{
      const key = `${goalKey}::long::${r[0]}`;
      if(comp[key]) return false;
      const target = parseFloat(r[1]);
      if(!target) return false;
      const tolerance = Math.max(0.5, target*0.15);
      return Math.abs(dist - target) <= tolerance;
    });
    if(candidate){
      comp[`${goalKey}::long::${candidate[0]}`] = true;
      await setJSON('running-completions', comp);
    }
    renderRunningGoalPlan(el, goal);
    renderTrackers();
  });
}

      </div>
      <div class="card" style="margin-bottom:14px;">
        <h3>Weekly Training Volume</h3>
        <p class="muted" style="margin-top:2px;">Total weight moved (kg) across completed working sets, per week.</p>
        <div style="position:relative;height:220px;margin-top:12px;"><canvas id="chartVolume"></canvas></div>
      </div>
      <div class="card" style="margin-bottom:14px;">
        <h3>Muscle Group Balance</h3>
        <p class="muted" style="margin-top:2px;">Training volume by muscle group over the last 7 days — spot what's being neglected.</p>
        <div style="position:relative;height:240px;margin-top:12px;"><canvas id="chartMuscle"></canvas></div>
      </div>
      <div class="card">
        <h3>Body Measurements Trend</h3>
        <div style="position:relative;height:240px;margin-top:12px;"><canvas id="chartBody"></canvas></div>
      </div>
    </div>
    <div class="pane" data-pane="weight"><div class="card">
      <div class="form-row">
        <div class="field"><label>Date</label><input id="wDate" type="date"></div>
        <div class="field"><label>Weight (kg)</label><input id="wVal" type="number" step="0.1" style="width:100px;"></div>
        <button class="btn" id="wAdd">Add Entry</button>
      </div>
      <table><thead><tr><th>Date</th><th class="num">Weight (kg)</th></tr></thead><tbody id="wBody"></tbody></table>
    </div></div>
    <div class="pane" data-pane="body"><div class="card">
      <div class="form-row">
        <div class="field"><label>Date</label><input id="bDate" type="date"></div>
        <div class="field"><label>Chest (cm)</label><input id="bChest" type="number" style="width:90px;"></div>
        <div class="field"><label>Waist (cm)</label><input id="bWaist" type="number" style="width:90px;"></div>
        <div class="field"><label>Shoulders (cm)</label><input id="bShoulders" type="number" style="width:90px;"></div>
        <div class="field"><label>Arms (cm)</label><input id="bArms" type="number" style="width:90px;"></div>
        <div class="field"><label>Thighs (cm)</label><input id="bThighs" type="number" style="width:90px;"></div>
        <button class="btn" id="bAdd">Add Entry</button>
      </div>
      <table><thead><tr><th>Date</th><th class="num">Chest</th><th class="num">Waist</th><th class="num">Shoulders</th><th class="num">Arms</th><th class="num">Thighs</th></tr></thead><tbody id="bBody"></tbody></table>
    </div></div>
    <div class="pane" data-pane="pr"><div class="card">
      <div class="form-row">
        <div class="field"><label>Date</label><input id="pDate" type="date"></div>
        <div class="field"><label>Exercise</label><input id="pEx" placeholder="Bench Press" style="width:160px;"></div>
        <div class="field"><label>Weight (kg)</label><input id="pW" type="number" style="width:90px;"></div>
        <div class="field"><label>Reps</label><input id="pR" type="number" style="width:70px;"></div>
        <button class="btn" id="pAdd">Add PR</button>

    </div></div>

      <p class="muted" style="margin-bottom:14px;">Your running history and analytics, read from the same log Running and Trackers both share. Log a run from the Running page — this view is for reviewing, not logging.</p>
      <div class="grid g3" id="paceStatsGrid" style="margin-bottom:16px;"></div>
      <table><thead><tr><th>Date</th><th class="num">Distance</th><th class="num">Time</th><th class="num">Pace (min/km)</th></tr></thead><tbody id="rBody"></tbody></table>
    </div></div>
