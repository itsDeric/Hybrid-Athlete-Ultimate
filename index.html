<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Athlete">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hybrid Athlete — Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>
  // Chart.js from cdnjs, with a jsDelivr fallback if the primary CDN is blocked or unreachable —
  // previously a single pinned CDN URL with no fallback meant charts could stay silently blank forever.
  (function(){
    function loadFallback(){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
      document.head.appendChild(s);
    }
    var primary = document.createElement('script');
    primary.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    primary.onerror = loadFallback;
    document.head.appendChild(primary);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0c;
  --ink:#111114;
  --white:#ffffff;
  --blue:#0a6cff;
  --blue-soft:#eaf1ff;
  --blue-dim:rgba(10,108,255,.12);
  --gray-50:#f7f7f9;
  --gray-100:#eeeef1;
  --gray-200:#e2e2e6;
  --gray-400:#9a9aa2;
  --gray-600:#5c5c64;
  --gray-800:#28282d;
  --green:#1fb15a;
  --amber:#c98a12;
  --red:#e0352b;
  --purple:#8b6fe0;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:var(--gray-50);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-y:none; /* stop the whole page from triggering the browser's pull-to-refresh — this is an app, not a page you refresh by swiping */
}
::selection{background:var(--blue);color:#fff;}

/* ---------- Layout ---------- */
#app{display:flex;width:100%;min-height:100vh;}

.sidebar{
  width:224px;
  flex-shrink:0;
  background:var(--black);
  color:#fff;
  padding:24px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px 22px 10px;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-dim);}
.brand-text{font-weight:800;font-size:14.5px;letter-spacing:-.02em;line-height:1.15;}
.brand-text span{display:block;font-weight:500;font-size:10.5px;color:var(--gray-400);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.navbtn{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:none;border:none;color:var(--gray-400);
  font-family:var(--sans);font-size:13.5px;font-weight:600;
  padding:9px 10px;border-radius:10px;cursor:pointer;
  transition:background .15s,color .15s;
}
.navbtn svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:var(--blue);color:#fff;}
.navbtn.active svg{opacity:1;}

.sidebar-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);}

.sync-box{padding:10px 10px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sync-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;margin-bottom:8px;}
.sync-btn{width:100%;background:#fff;color:var(--ink);border:none;border-radius:9px;padding:8px 10px;font-family:var(--sans);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.sync-btn svg{width:14px;height:14px;}
.sync-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#fff;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-meta{font-size:10px;color:var(--gray-400);margin-top:3px;}
.sync-actions{display:flex;gap:6px;margin-top:8px;}
.sync-actions button{flex:1;background:rgba(255,255,255,.08);color:#fff;border:none;border-radius:7px;padding:6px;font-family:var(--sans);font-size:10.5px;font-weight:700;cursor:pointer;}
.sync-actions button:hover{background:rgba(255,255,255,.15);}
.sync-actions.secondary-row{margin-top:6px;}
.backup-status-line{font-size:10px;color:var(--gray-400);margin-top:6px;line-height:1.5;}
.backup-status-line b{color:#fff;}

/* Import confirmation — a true modal (not the mobile-only more-sheet) since Import is destructive
   and reachable from both the desktop sidebar and the mobile More sheet; one shared overlay avoids
   duplicating the confirm UI (and its state) in two places. */
.import-confirm-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,12,.6);z-index:2000;align-items:center;justify-content:center;padding:20px;}
.import-confirm-overlay.open{display:flex;animation:fade .15s ease;}
.import-confirm-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;max-width:420px;width:100%;}
.import-confirm-card h3{font-size:16px;margin-bottom:8px;}
.import-confirm-card .muted{color:var(--gray-600);font-size:13px;line-height:1.6;}
.import-confirm-actions{display:flex;gap:10px;margin-top:18px;}
.import-confirm-actions .btn{flex:1;justify-content:center;}
.countdown-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-400);font-weight:700;}
.countdown-num{font-family:var(--mono);font-size:26px;font-weight:600;color:#fff;margin-top:4px;}
.countdown-sub{font-size:11px;color:var(--gray-400);margin-top:1px;}

.main{flex:1;min-width:0;padding:36px 44px 80px;max-width:1180px;}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{margin-bottom:28px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;}
.page-sub{color:var(--gray-600);font-size:14px;margin-top:6px;max-width:640px;}

/* pulse line divider — signature motif */
.pulse{width:100%;height:22px;margin:26px 0;opacity:.55;}
.pulse path{fill:none;stroke:var(--blue);stroke-width:1.6;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g7{grid-template-columns:repeat(7,1fr);}
@media (max-width:900px){.g2,.g3,.g4,.g7{grid-template-columns:repeat(2,1fr);}}

.card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.card h3{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;}
.card .muted{color:var(--gray-600);font-size:12.5px;}

.stat-card{padding:18px 20px;}
.stat-label{font-size:11px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.06em;}
.stat-value{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-value small{font-size:13px;font-weight:500;color:var(--gray-600);}

/* rings (overview signature element) */
.rings-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.ring-legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;}
.ring-legend .row{display:flex;align-items:center;gap:8px;}
.ring-legend .sw{width:9px;height:9px;border-radius:2px;}

/* progress bar */
.pbar{height:6px;border-radius:99px;background:var(--gray-100);overflow:hidden;margin-top:8px;}
.pbar > div{height:100%;border-radius:99px;background:var(--blue);}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--gray-200);}
td{padding:10px;border-bottom:1px solid var(--gray-100);}
tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--mono);}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.tag.blue{background:var(--blue-dim);color:var(--blue);}
.goal-progress-track{width:100%;height:8px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-top:12px;}
.goal-progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .35s ease;}
.goal-progress-fill.complete{background:var(--green);}
.goal-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.goal-card-actions button{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;font-weight:600;color:var(--ink);}
.goal-card-actions button:hover{background:var(--gray-50);}
.goal-card-actions button.danger{color:var(--red);border-color:rgba(224,53,43,.3);}
.goal-card-actions button.primary-action{color:var(--blue);border-color:var(--blue-dim);}
.goal-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:600px){ .goal-form-grid{grid-template-columns:1fr;} } /* form fields with long option text (e.g. "Higher is better (e.g. strength, distance)") get cramped in 2 columns on narrow phones — stack instead */
/* Goal creation: chip-based category/metric selection instead of dropdowns — makes each step read as
   a single clear decision ("what do I want to achieve") rather than a form field to fill in. */
.goal-step-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--gray-600);margin:18px 0 8px;}
.goal-step-label:first-child{margin-top:0;}
.goal-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.goal-chip{background:#fff;border:1.5px solid var(--gray-200);border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;min-height:44px;transition:border-color .15s,background .15s,color .15s;}
.goal-chip:hover{border-color:var(--gray-400);}
.goal-chip.selected{background:var(--blue);border-color:var(--blue);color:#fff;}
.goal-time-row{display:flex;align-items:center;gap:8px;}
.goal-time-row .field{flex:1;}
.goal-time-colon{font-size:20px;font-weight:700;color:var(--gray-400);margin-top:18px;}
.goal-value-suffix{display:flex;align-items:center;gap:8px;}
.goal-value-suffix input{flex:1;}
.goal-value-suffix span{font-size:13px;color:var(--gray-600);font-weight:600;min-width:fit-content;}
.tag.gray{background:var(--gray-100);color:var(--gray-600);}
.tag.green{background:rgba(31,177,90,.12);color:var(--green);}
.tag.rest{background:var(--gray-800);color:#fff;}

.exercise-chip{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--gray-600);}
.exercise-chip.active{background:var(--black);color:#fff;border-color:var(--black);}

/* week planner */
.day-card{padding:16px;min-height:150px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s, box-shadow .15s;}
.day-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
.day-card .dname{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);}
.day-card .dtitle{font-size:14.5px;font-weight:700;margin-top:2px;line-height:1.3;}
.day-card .dsub{font-size:12px;color:var(--gray-600);margin-top:auto;}
.day-card.today{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue), var(--shadow);}
.day-card.rest{background:var(--black);color:#fff;}
.day-card.rest .dname{color:var(--gray-400);}
.day-card.rest .dsub{color:var(--gray-400);}

.icon-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-dim);}
.icon-chip svg{width:16px;height:16px;color:var(--blue);}

/* tabs (sub-nav within a view) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.subtab{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--gray-600);}
.subtab.active{background:var(--black);color:#fff;border-color:var(--black);}

.pane{display:none;}
.pane.active{display:block;}

/* buttons/forms */
.btn{font-family:var(--sans);font-weight:700;font-size:13px;background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn.secondary{background:var(--black);}
.btn.ghost{background:var(--gray-100);color:var(--ink);}
input,select{font-family:var(--sans);font-size:13px;border:1px solid var(--gray-200);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px;}
.field label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--gray-600);margin-bottom:4px;}

/* checkbox pill list */
.check-list{display:flex;flex-direction:column;gap:2px;}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer;user-select:none;}
.run-row [data-runcheck]{cursor:pointer;}
.run-row-done{background:rgba(31,177,90,.06);}
.check-item:last-child{border-bottom:none;}
.check-box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--gray-200);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.check-box.done{background:var(--blue);border-color:var(--blue);}
.check-box svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .1s;}
.check-box.done svg{opacity:1;}
.check-item span.label{font-size:13.5px;font-weight:500;}
.check-item.done span.label{color:var(--gray-400);text-decoration:line-through;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--gray-200);}
.tl-item{position:relative;padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-26px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);}
.tl-item.done .tl-dot{background:var(--blue);}
.tl-month{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--blue);letter-spacing:.06em;}
.tl-title{font-size:15px;font-weight:700;margin:3px 0 6px;}
.tl-goals{font-size:12.5px;color:var(--gray-600);}

/* habit heatmap-ish grid */
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.hcell{aspect-ratio:1;border-radius:6px;background:var(--gray-100);}

footer.printnote{margin-top:60px;padding-top:18px;border-top:1px solid var(--gray-200);font-size:11.5px;color:var(--gray-400);}

/* cheat sheet */
.sheet{background:var(--black);color:#fff;border-radius:20px;padding:26px 28px;}
.sheet h2{font-size:20px;font-weight:800;}
.sheet .sub{color:var(--gray-400);font-size:12.5px;margin-top:2px;}
.sheet-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px;}
.sheet-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px;}
.sheet-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);font-weight:700;margin-bottom:10px;}
.sheet-block .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
.sheet-block .row:last-child{border-bottom:none;}
.sheet-block .row .v{font-family:var(--mono);color:var(--blue);font-weight:600;}

@media print{
  .sidebar{display:none;}
  .main{padding:0;max-width:100%;}
  .view{display:none !important;}
  #print-cheat{display:block !important;}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

/* responsive */
.bottom-nav{display:none;}
.more-sheet-overlay{display:none;} /* hidden at all widths by default — only shown via .open inside the mobile media query below */
@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{display:none;}
  .main{padding:22px 16px calc(84px + env(safe-area-inset-bottom));}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr;}
  .sheet-grid{grid-template-columns:1fr;}

  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:rgba(10,10,12,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.08);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;align-items:center;
  }
  .bottom-nav-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:auto;text-align:center;
    background:none;border:none;color:var(--gray-400);
    font-size:10px;font-weight:700;letter-spacing:.01em;
    padding:6px 14px;min-width:56px;min-height:48px;
    cursor:pointer;border-radius:12px;position:relative;
    transition:color .18s ease;
  }
  .bottom-nav-btn svg{width:21px;height:21px;stroke-width:1.8;transition:stroke-width .18s ease, filter .18s ease;flex-shrink:0;}
  .bottom-nav-btn.active{color:var(--blue);background:none;}
  .bottom-nav-btn.active svg{stroke-width:2.3;filter:drop-shadow(0 0 5px rgba(10,108,255,.55));}
  /* Small dot beneath the icon instead of a pill/blob background — keeps the icon itself as the focus */
  .bottom-nav-btn.active::after{
    content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--blue);
  }

  .more-sheet-overlay{
    position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;justify-content:center;
  }
  .more-sheet-overlay.open{display:flex;animation:fade .15s ease;}
  .more-sheet{
    background:var(--black);color:#fff;width:100%;max-width:600px;
    border-radius:20px 20px 0 0;padding:10px 8px calc(20px + env(safe-area-inset-bottom));
    max-height:75vh;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    animation:sheetUp .25s cubic-bezier(.2,.9,.3,1);
  }
  .more-sheet-handle-hit{display:flex;align-items:center;justify-content:center;padding:14px 0;margin:-8px 0 4px;touch-action:none;cursor:grab;}
  .more-sheet-handle-hit:active{cursor:grabbing;}
  .more-sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;}
  .more-sheet-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;color:#fff;font-size:15px;font-weight:600;padding:14px 14px;border-radius:12px;text-align:left;cursor:pointer;min-height:48px;}
  .more-sheet-item:active{background:rgba(255,255,255,.08);}
  .more-sheet-item svg{width:20px;height:20px;color:var(--gray-400);flex-shrink:0;}
  .more-sheet-divider{height:1px;background:rgba(255,255,255,.08);margin:6px 14px;}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
}
/* Onboarding overlay */
.onboard-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(10,10,12,.72);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:fade .25s ease;
}
.onboard-card{
  background:#fff;border-radius:20px;max-width:760px;width:100%;
  max-height:88vh;overflow-y:auto;
  padding:32px 32px 26px;
}
.onboard-head{margin-bottom:22px;}
.onboard-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}
.onboard-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em;}

}

.onboard-option .oname{font-size:14px;font-weight:700;}
.onboard-option .odesc{font-size:12px;color:var(--gray-600);margin-top:4px;line-height:1.5;}
.onboard-option.build-own{background:var(--black);border-color:var(--black);}
.onboard-option.build-own .oname{color:#fff;}
.onboard-option.build-own .odesc{color:var(--gray-400);}
.onboard-skip{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:var(--sans);text-decoration:underline;}

/* Session Mode */
.session-overlay{
  position:fixed;inset:0;z-index:1100;background:var(--black);color:#fff;
  display:flex;flex-direction:column;min-height:0;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  animation:fade .2s ease;
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.session-close{background:rgba(255,255,255,.08);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.session-progress{font-size:12px;color:var(--gray-400);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.session-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:40px;}
.session-exname{font-size:28px;font-weight:800;letter-spacing:-.02em;max-width:90%;}
.session-target{font-size:14px;color:var(--gray-400);font-family:var(--mono);}
.session-hint{font-size:11.5px;color:var(--gray-400);margin-top:6px;max-width:300px;}
.session-sets{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px;margin-top:18px;}
.session-set-row{display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 14px;}
.session-set-row.done{background:rgba(31,177,90,.13);border-color:var(--green);}
.set-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.set-label{font-weight:700;font-size:13.5px;flex-shrink:0;}
.set-last-time{font-size:11px;color:var(--gray-400);font-family:var(--mono);margin-top:-3px;}
.set-type-badge{border:none;border-radius:20px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.03em;cursor:pointer;text-transform:uppercase;font-family:var(--sans);white-space:nowrap;}
.set-type-badge::after{content:' ▾';opacity:.6;font-size:9px;}
.set-type-badge.type-working{background:rgba(10,108,255,.2);color:#8fbaff;}
.set-type-badge.type-warmup{background:rgba(201,138,18,.22);color:#f0b84a;}
.set-type-badge.type-drop{background:rgba(139,111,224,.22);color:#c1adf5;}
.set-type-badge.type-failure{background:rgba(224,53,43,.22);color:#ff9089;}

.set-check svg{width:14px;height:14px;color:#fff;opacity:0;}
.session-set-row.done .set-check{background:var(--green);border-color:var(--green);}
.session-set-row.done .set-check svg{opacity:1;}
.set-row-inputs{display:flex;align-items:center;gap:8px;}
.set-input{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:15px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:7px 4px;}
.set-input::placeholder{color:rgba(255,255,255,.3);}

.plate-readout{font-size:11.5px;color:var(--gray-400);margin-top:2px;padding:0 2px;}
.set-remove-row{text-align:right;margin-top:4px;}

.overload-suggestion.overload-up{background:rgba(31,177,90,.14);border:1px solid rgba(31,177,90,.35);}
.overload-suggestion.overload-down{background:rgba(224,53,43,.12);border:1px solid rgba(224,53,43,.3);}
.overload-suggestion.overload-flat{background:rgba(10,108,255,.12);border:1px solid rgba(10,108,255,.3);}

.set-remove-btn:hover{color:var(--red);text-decoration-color:var(--red);}

// Running is not everyone's focus — some people just want to log the occasional run, others want a
// structured build toward a specific race distance. Presets below generate a general progression
// framework rather than assuming one fixed goal; the original 30K plan is preserved as a legacy option.
const RUNNING_GOAL_PRESETS = [
  { id:'5k',    label:'5K',             distance:5,    weeks:9  },
  { id:'10k',   label:'10K',            distance:10,   weeks:10 },

];

function generateRunProgression(distanceKm, weeks){
  weeks = Math.max(6, Math.min(24, Math.round(weeks)));
  const q1 = Math.max(1, Math.round(weeks*0.25));
  const q2 = Math.max(q1+1, Math.round(weeks*0.5));
  const q3 = Math.max(q2+1, Math.round(weeks*0.75));
  const estMinutes = Math.max(20, Math.round(distanceKm*6)); // rough continuous-run estimate at an easy ~6 min/km pace
  const easy = [
    {w:'Week 1', d:'5 min walk → (Run 2 min / Walk 2 min) × 8 → 5 min cooldown walk'},
    {w:`Week ${q1}`, d:'(Run 3 min / Walk 2 min) × repeat'},
    {w:`Week ${q2}`, d:'(Run 8 min / Walk 2 min) × repeat'},
    {w:`Week ${q3}`, d:`Run continuously for ${Math.round(estMinutes*0.6)} minutes`},
    {w:`Week ${weeks}`, d:`Run continuously for ${estMinutes} minutes`},
  ];
  const speed = [
    {w:'Week 1', d:'10 min warm-up jog → 6 × 1 min fast / 2 min easy → 10 min cooldown'},
    {w:`Week ${q1}`, d:'10 min warm-up → 6 × 2 min fast / 90 sec easy → 10 min cooldown'},
    {w:`Week ${q2}`, d:'10 min warm-up → 5 × 4 min fast / 2 min easy → 10 min cooldown'},
    {w:`Week ${q3}`, d:'10 min warm-up → 4 × 6 min tempo / 2 min easy → 10 min cooldown'},
    {w:`Week ${weeks}`, d:'10 min warm-up → 20 min continuous tempo → 10 min cooldown'},
  ];
  const long = [];
  let dist = Math.max(1, Math.round(distanceKm*0.12*10)/10);
  for(let w=1; w<=weeks; w++){
    if(w===weeks){ long.push([String(w), `${distanceKm} km`, 'Goal Run']); continue; }
    if(w % 4 === 0){ long.push([String(w), `${Math.round(dist*0.6*10)/10} km`, 'Recovery']); continue; }
    dist = Math.min(distanceKm*0.9, dist*1.12);
    long.push([String(w), `${Math.round(dist*10)/10} km`, '']);
  }
  return { easy, speed, long };
}

/* ============================================================
   STORAGE HELPERS — uses the browser's own localStorage,
   so all data (weights, PRs, habits) lives on this device only,
   with no Claude account or internet connection required.
============================================================ */
const LS_PREFIX = 'hybrid-athlete:';

// HTML-escapes any user-entered text before it's interpolated into an innerHTML template. Added after
// an audit flagged that none of the ~90 places user-typed text (profile name, program/exercise names,
// goal text, custom units, sets/reps) gets inserted into the DOM had any escaping — harmless today
// (single-user, local-only, so worst case is self-XSS), but a real stored-XSS risk the moment any
// future feature lets one athlete's text render in another athlete's browser (shared programs,
// leaderboards, etc). Escapes all five HTML-significant characters, so it's safe in both element
// content (<div>${esc(x)}</div>) and attribute value (value="${esc(x)}") contexts. Deliberately NOT
// applied at data-entry/storage time (e.g. when saving a typed program name) — only at the point of
// insertion into HTML — so raw, un-mangled text is what's stored, exported, and imported.
function esc(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
async function getJSON(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function setJSON(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){
    console.error('Storage failed — your browser may have local storage disabled or full.', e);
  }
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   SHARED EXERCISE WEIGHT STORE
   One working weight per exercise name, shared across every
   program and every day it appears in — editing it anywhere
   (Program Builder, Gym Dashboard, Session Mode) updates it
   everywhere else that exercise shows up.
============================================================ */
async function getExerciseWeight(name){
  const weights = await getJSON('exercise-weights', {});
  return weights[name] || '';
}
async function setExerciseWeight(name, value){
  const weights = await getJSON('exercise-weights', {});
  weights[name] = value;
  await setJSON('exercise-weights', weights);
}
async function getAllExerciseWeights(){
  return await getJSON('exercise-weights', {});
}

async function migrateToSharedExerciseWeights(){
  const migrated = await getJSON('exercise-weights-migrated', false);
  if(migrated) return;
  const weights = await getJSON('exercise-weights', {});
  const candidates = {}; // name -> { value, date } — date '' sorts before any real date

  // Baseline from old Hybrid Athlete per-day storage (key format "Day::Exercise_Name")
  const gw = await getJSON('gym-weights', {});
  Object.keys(gw).forEach(k=>{
    const name = k.split('::')[1].replace(/_/g,' ');
    if(gw[k] && !candidates[name]) candidates[name] = { value: gw[k], date: '' };
  });

  // Baseline from custom programs' per-exercise load fields
  const progs = await getJSON('custom-programs', []);
  progs.forEach(p=>{
    Object.values(p.days||{}).forEach(d=>{
      (d.exercises||[]).forEach(e=>{
        if(e.load && !candidates[e.name]) candidates[e.name] = { value: e.load, date: '' };
      });
    });
  });

  // Session history has real dates — most recent logged value wins over baselines
  const history = await getJSON('session-history', []);
  history.forEach(s=>{
    (s.exercises||[]).forEach(e=>{
      if(e.weight && (!candidates[e.name] || s.date > candidates[e.name].date)){
        candidates[e.name] = { value: e.weight, date: s.date };
      }
    });
  });

  Object.keys(candidates).forEach(name=>{
    if(!(name in weights)) weights[name] = candidates[name].value;
  });
  await setJSON('exercise-weights', weights);
  await setJSON('exercise-weights-migrated', true);
}

function estimated1RM(weight, reps){
  const w = parseFloat(weight), r = parseInt(reps);
  if(!w || !r || r < 1) return null;
  return w * (1 + r/30); // Epley formula
}

// One-time backfill: auto PR detection only started watching for NEW sessions from the moment it
// shipped — it never rescanned history that already existed. This walks every past session in
// chronological order and reconstructs the PRs you would have gotten had the feature existed from
// day one, so historical bests aren't invisible in the Personal Records table.
async function backfillPRs(){
  const done = await getJSON('pr-backfill-done', false);
  if(done) return;
  const history = (await getJSON('session-history', [])).slice().sort((a,b)=> a.date.localeCompare(b.date));
  const running = {}; // exercise name -> { maxWeight, max1RM, maxSessionVolume }
  const newEntries = [];
  history.forEach(s=>{
    const sessionVolumeByEx = {};
    (s.exercises||[]).forEach(e=>{
      if(!running[e.name]) running[e.name] = { maxWeight:0, max1RM:0, maxSessionVolume:0 };
      const base = running[e.name];
      let bestWeightSet=null, bestOneRM=0, bestOneRMSet=null, sessionVolume=0;
      (e.sets||[]).forEach(set=>{
        if(!set.done || set.type!=='working') return;
        const w = parseFloat(set.weight);
        if(w && (!bestWeightSet || w>parseFloat(bestWeightSet.weight))) bestWeightSet = set;
        const oneRM = estimated1RM(set.weight, set.reps);
        if(oneRM && oneRM>bestOneRM){ bestOneRM=oneRM; bestOneRMSet=set; }
        if(w && set.reps) sessionVolume += w*parseInt(set.reps);
      });
      if(bestWeightSet && parseFloat(bestWeightSet.weight) > base.maxWeight){
        newEntries.push({ date:s.date, ex:e.name, w:bestWeightSet.weight, r:bestWeightSet.reps||'', type:'Weight PR', auto:true });
        base.maxWeight = parseFloat(bestWeightSet.weight);
      }
      if(bestOneRMSet && bestOneRM > base.max1RM){
        newEntries.push({ date:s.date, ex:e.name, w:bestOneRMSet.weight, r:bestOneRMSet.reps||'', type:'Est. 1RM PR', auto:true });
        base.max1RM = bestOneRM;
      }
      if(sessionVolume > base.maxSessionVolume && base.maxSessionVolume > 0){
        newEntries.push({ date:s.date, ex:e.name, w:Math.round(sessionVolume), r:'', type:'Volume PR', auto:true });
      }
      if(sessionVolume > base.maxSessionVolume) base.maxSessionVolume = sessionVolume;
    });
  });
  if(newEntries.length){
    const prLog = await getJSON('pr-log', []);
    await setJSON('pr-log', prLog.concat(newEntries));
  }
  await setJSON('pr-backfill-done', true);
}

/* ============================================================
   BACKUP & RESTORE — free, local file export/import.
   No account, no sign-in, works for anyone immediately.

   SAFETY NET (added after an audit flagged this as the single biggest risk in the app): every byte
   of training history lives only in this device's localStorage. Before this, backup was a manual
   export the athlete had to remember to run, AND the documented fix for the service-worker caching
   bug was "Clear site data in DevTools" — the exact same action that permanently destroys everything,
   with zero warning. Below adds three independent layers, all still free and account-free:
     1. A dismissible reminder banner (renderOverview) if it's been a while since any backup.
     2. An OPTIONAL automatic backup to a folder the athlete picks once (e.g. their OS's own free
        Google Drive/OneDrive/iCloud sync folder) via the File System Access API — no new account,
        just reuses whatever free cloud sync the athlete's OS already provides. Chrome/Edge only
        (desktop + Android); gracefully absent everywhere else, where the reminder banner is the net.
     3. A one-tap "safety copy" taken automatically before every Import overwrite, so a wrong-file
        import (a real, easy mistake) can be undone without having to dig up an old export file.
============================================================ */
function collectLocalSnapshot(){
  const snap = {};
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith(LS_PREFIX)){
      try{ snap[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  });
  return snap;
}

// Backup bookkeeping (last export/auto-backup times, snooze state) is deliberately stored OUTSIDE
// the hybrid-athlete: namespace collectLocalSnapshot() reads, so it never gets swept into export
// files or overwritten by an import — it's device-local infrastructure state, not training data.
const BACKUP_META_KEY = 'hybrid-athlete-infra:backup-meta';
function getBackupMeta(){
  try{ return JSON.parse(localStorage.getItem(BACKUP_META_KEY)) || {}; }catch(e){ return {}; }
}
function setBackupMeta(patch){
  const meta = Object.assign(getBackupMeta(), patch);
  try{ localStorage.setItem(BACKUP_META_KEY, JSON.stringify(meta)); }catch(e){}
  return meta;
}

// Pre-import safety snapshot lives under the same non-exported infra namespace — deliberately outside
// LS_PREFIX so it can never be the thing an incoming import overwrites, and never leaks into an
// export file (it's a device-local undo point, not portable training data).
const PRE_IMPORT_SAFETY_KEY = 'hybrid-athlete-infra:pre-import-safety';
function getPreImportSafety(){
  try{ return JSON.parse(localStorage.getItem(PRE_IMPORT_SAFETY_KEY)) || null; }catch(e){ return null; }
}

function exportData(){
  const snap = collectLocalSnapshot();
  const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `hybrid-athlete-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  const now = new Date().toISOString();
  setBackupMeta({ lastExportAt: now, lastBackupAt: now });
  const meta = document.getElementById('backupMeta');
  if(meta) meta.textContent = 'Backup downloaded — keep it somewhere safe.';
  refreshBackupStatusLine();
}

function importData(){
  document.getElementById('importFileInput').click();
}

// Import is destructive (a full overwrite), so unlike the old version this never applies data the
// instant a file is picked. It validates the file, saves a safety copy of what's currently on the
// device, then shows a real confirmation naming what's in the file before anything is touched.
let pendingImport = null;
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    const metaEl = document.getElementById('backupMeta');
    let data;
    try{
      data = JSON.parse(evt.target.result);
    }catch(err){
      if(metaEl) metaEl.textContent = 'That file could not be read — make sure it\'s a real backup file.';
      console.error('[Import] failed:', err);
      return;
    }
    const isPlainObject = data && typeof data === 'object' && !Array.isArray(data);
    const keys = isPlainObject ? Object.keys(data) : [];
    if(!isPlainObject || keys.length === 0){
      if(metaEl) metaEl.textContent = "That doesn't look like a Hybrid Athlete backup file — nothing was imported.";
      return;
    }
    pendingImport = data;
    showImportConfirm(keys);
  };
  reader.readAsText(file);
  e.target.value = ''; // reset so re-selecting the same file still fires change
}

function showImportConfirm(keys){
  const overlay = document.getElementById('importConfirmOverlay');
  const text = document.getElementById('importConfirmText');
  const preview = keys.slice(0,5).join(', ') + (keys.length>5 ? `, +${keys.length-5} more` : '');
  text.textContent = `This file contains ${keys.length} data type${keys.length===1?'':'s'} (${preview}). Importing replaces everything currently on this device — a safety copy of what you have now will be saved first, so this can be undone.`;
  overlay.classList.add('open');
}
function hideImportConfirm(){
  document.getElementById('importConfirmOverlay').classList.remove('open');
  pendingImport = null;
}
function applyPendingImport(){
  if(!pendingImport) return;
  // Safety copy of what's on the device RIGHT NOW, taken immediately before the overwrite — stored
  // outside the exportable namespace (see PRE_IMPORT_SAFETY_KEY) so the incoming import data can
  // never itself clobber the thing meant to undo it.
  const safety = { snapshot: collectLocalSnapshot(), savedAt: new Date().toISOString() };
  try{ localStorage.setItem(PRE_IMPORT_SAFETY_KEY, JSON.stringify(safety)); }catch(e){ /* non-fatal */ }

  Object.keys(pendingImport).forEach(k=>{
    localStorage.setItem(LS_PREFIX+k, JSON.stringify(pendingImport[k]));
  });
  const now = new Date().toISOString();
  setBackupMeta({ lastBackupAt: now }); // importing a real backup file counts as "backed up" too
  hideImportConfirm();
  const metaEl = document.getElementById('backupMeta');
  if(metaEl) metaEl.textContent = 'Backup restored — reloading…';
  setTimeout(()=> location.reload(), 700);
}
// One-tap undo for the single most common accident: importing the wrong file. Only available for the
// most recent import in this browser (the safety copy is overwritten by each new import, by design —
// it is an undo point, not a version history).
function undoLastImport(){
  const safety = getPreImportSafety();
  if(!safety || !safety.snapshot) return;
  Object.keys(safety.snapshot).forEach(k=>{
    localStorage.setItem(LS_PREFIX+k, JSON.stringify(safety.snapshot[k]));
  });
  localStorage.removeItem(PRE_IMPORT_SAFETY_KEY);
  location.reload();
}

/* ---------- Automatic backup to a folder the athlete picks once (File System Access API) ----------
   Entirely free and account-free: it reuses whatever cloud sync the athlete's OS already has on that
   folder (a Google Drive/OneDrive/iCloud desktop-synced folder works great) rather than standing up
   any new infrastructure. Chrome/Edge only (desktop + Android) — feature-detected everywhere it's
   used, and the reminder banner (see renderOverview) is the fallback net where it's unavailable. */
const AUTO_BACKUP_SUPPORTED = typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
const AUTO_BACKUP_MAX_FILES = 10; // rolling window — protects against a bug corrupting the single latest save
const AUTO_BACKUP_MIN_INTERVAL_MS = 6*60*60*1000; // don't write more than once per 6h of app use

const BACKUP_IDB_NAME = 'hybrid-athlete-backup';
const BACKUP_IDB_STORE = 'handles';
function openBackupIDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(BACKUP_IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(BACKUP_IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await openBackupIDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction(BACKUP_IDB_STORE,'readonly').objectStore(BACKUP_IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await openBackupIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(BACKUP_IDB_STORE,'readwrite');
    tx.objectStore(BACKUP_IDB_STORE).put(val, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await openBackupIDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(BACKUP_IDB_STORE,'readwrite');
    tx.objectStore(BACKUP_IDB_STORE).delete(key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

async function connectBackupFolder(){
  if(!AUTO_BACKUP_SUPPORTED) return false;
  try{
    const handle = await window.showDirectoryPicker({ id:'hybrid-athlete-backup', mode:'readwrite' });
    await idbSet('backup-dir', handle);
    setBackupMeta({ autoBackupConnectedAt: new Date().toISOString() });
    await performAutoBackupWrite(handle);
    return true;
  }catch(e){
    // Includes the athlete simply cancelling the folder picker — not an error worth surfacing.
    return false;
  }
}
async function disconnectBackupFolder(){
  await idbDelete('backup-dir').catch(()=>{});
  setBackupMeta({ autoBackupConnectedAt: null });
}
// Never prompts — queryPermission() only checks silently. If permission was revoked (or the folder
// moved/deleted) this just returns null and the app falls back to the manual reminder banner, rather
// than surprising the athlete with a permission dialog on a random app load.
async function getConnectedBackupHandle(){
  if(!AUTO_BACKUP_SUPPORTED) return null;
  try{
    const handle = await idbGet('backup-dir');
    if(!handle) return null;
    const perm = await handle.queryPermission({ mode:'readwrite' });
    return perm === 'granted' ? handle : null;
  }catch(e){ return null; }
}
async function performAutoBackupWrite(dirHandle){
  const snap = collectLocalSnapshot();
  if(!Object.keys(snap).length) return false; // nothing logged yet — nothing to protect
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');
  const filename = `hybrid-athlete-autobackup-${stamp}.json`;
  try{
    const fileHandle = await dirHandle.getFileHandle(filename, { create:true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(snap, null, 2));
    await writable.close();
    const now = new Date().toISOString();
    setBackupMeta({ lastAutoBackupAt: now, lastBackupAt: now });
    await pruneOldAutoBackups(dirHandle);
    return true;
  }catch(e){
    console.error('[AutoBackup] write failed:', e);
    return false;
  }
}
async function pruneOldAutoBackups(dirHandle){
  try{
    const names = [];
    for await (const [name, handle] of dirHandle.entries()){
      if(handle.kind==='file' && name.startsWith('hybrid-athlete-autobackup-')) names.push(name);
    }
    names.sort(); // the timestamp is embedded in the filename, so lexical sort = chronological sort
    const excess = names.length - AUTO_BACKUP_MAX_FILES;
    for(let i=0; i<excess; i++){ await dirHandle.removeEntry(names[i]).catch(()=>{}); }
  }catch(e){ /* non-fatal — worst case old files accumulate until the next successful prune */ }
}
// Called once on every app load. Silent no-op unless a folder is connected AND enough time has
// passed — this is a background safety net, not something that should ever interrupt the athlete.
async function maybeRunAutoBackup(){
  const handle = await getConnectedBackupHandle();
  if(!handle) return;
  const meta = getBackupMeta();
  const last = meta.lastAutoBackupAt ? new Date(meta.lastAutoBackupAt).getTime() : 0;
  if(Date.now() - last < AUTO_BACKUP_MIN_INTERVAL_MS) return;
  await performAutoBackupWrite(handle);
}
// Used by the reminder banner's "Back up now" button — prefers the connected folder (silent, no
// dialog) and only falls back to a manual file download if no folder is connected.
async function runBestAvailableBackup(){
  const handle = await getConnectedBackupHandle();
  if(handle) await performAutoBackupWrite(handle);
  else exportData();
}

function refreshBackupStatusLine(){
  const line = document.getElementById('backupStatusLine');
  if(!line) return;
  const meta = getBackupMeta();
  const parts = [];
  if(meta.autoBackupConnectedAt) parts.push('<b>Auto-backup folder connected</b>');
  parts.push(meta.lastBackupAt ? `Last backup: <b>${timeAgoLabel(meta.lastBackupAt)}</b>` : 'No backup yet');
  line.innerHTML = parts.join(' · ');
}
function timeAgoLabel(iso){
  const d = daysSinceISO(iso);
  if(d < 1) return 'today';
  if(d < 2) return 'yesterday';
  return `${Math.floor(d)} days ago`;
}
function daysSinceISO(iso){
  if(!iso) return Infinity;
  return (Date.now() - new Date(iso).getTime()) / 86400000;
}

async function wireAutoBackupButtons(){
  const show = AUTO_BACKUP_SUPPORTED;
  const row = document.getElementById('autoBackupRow');
  const moreBtn = document.getElementById('moreAutoBackupBtn');
  if(row) row.style.display = show ? 'flex' : 'none';
  if(moreBtn) moreBtn.style.display = show ? 'block' : 'none';
  if(!show) return;

  async function refreshLabel(){
    const connected = !!(await getConnectedBackupHandle());
    const label = connected ? 'Backup Folder Connected ✓' : 'Connect Backup Folder';
    const btn = document.getElementById('autoBackupBtn');
    if(btn) btn.textContent = label;
    if(moreBtn) moreBtn.textContent = label;
    refreshBackupStatusLine();
  }
  async function handleClick(){
    const connected = !!(await getConnectedBackupHandle());
    if(connected){
      await disconnectBackupFolder();
    } else {
      await connectBackupFolder();
    }
    await refreshLabel();
  }
  document.getElementById('autoBackupBtn').addEventListener('click', handleClick);
  moreBtn.addEventListener('click', handleClick);
  await refreshLabel();
}

function wireBackupButtons(){
  document.getElementById('exportDataBtn').addEventListener('click', exportData);
  document.getElementById('importDataBtn').addEventListener('click', importData);
  document.getElementById('importFileInput').addEventListener('change', handleImportFile);
  // Mobile "More" sheet duplicates these two actions since the sidebar (where the originals live) is
  // hidden below the 860px breakpoint — same underlying functions, just reachable from the sheet too.
  document.getElementById('moreExportBtn').addEventListener('click', exportData);
  document.getElementById('moreImportBtn').addEventListener('click', importData);
  // Shared modal (see CSS/HTML comments) so both entry points above funnel into the same confirm step.
  document.getElementById('importConfirmCancel').addEventListener('click', hideImportConfirm);
  document.getElementById('importConfirmApply').addEventListener('click', applyPendingImport);
  wireUndoImportButton();
  wireAutoBackupButtons();
  refreshBackupStatusLine();
}

// Same inline "tap again to confirm" pattern already used for deleting a program (this app avoids
// confirm()/alert() — they're blocked in the sandboxed preview, and inline state is more honest UI
// anyway). Only shown at all when there's actually something to undo.
function wireUndoImportButton(){
  const btn = document.getElementById('undoLastImportBtn');
  if(!btn) return;
  const safety = getPreImportSafety();
  btn.style.display = safety ? 'block' : 'none';
  if(!safety) return;
  btn.addEventListener('click', ()=>{
    if(btn.dataset.confirming !== '1'){
      btn.dataset.confirming = '1';
      const original = btn.textContent;
      btn.textContent = 'Tap again to confirm';
      const revert = ()=>{ if(btn.dataset.confirming==='1'){ btn.dataset.confirming='0'; btn.textContent = original; } };
      btn._revertTimer = setTimeout(revert, 3000);
      return;
    }
    clearTimeout(btn._revertTimer);
    undoLastImport();
  });
}

  {id:'overview', label:'Overview', icon:'overview'},
  {id:'programs', label:'Program Builder', icon:'builder'},
  {id:'week', label:'Weekly Planner', icon:'week'},
  {id:'gym', label:'Gym', icon:'gym'},
  {id:'running', label:'Running', icon:'run'},
  {id:'nutrition', label:'Nutrition', icon:'nutrition'},
  {id:'recovery', label:'Recovery', icon:'recovery'},
  {id:'timeline', label:'Timeline', icon:'timeline'},

];

// The 4 most-used sections get a dedicated bottom-nav tab on mobile; everything else lives in the
// "More" sheet. Chosen based on what you'd realistically want one-tap thumb access to mid-workout.
const BOTTOM_NAV_IDS = ['overview', 'gym', 'running', 'trackers'];

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = VIEWS.map(v=>`<button class="navbtn" data-view="${v.id}">${ICONS[v.icon]}<span>${v.label}</span></button>`).join('');
  nav.querySelectorAll('.navbtn').forEach(btn=>{
    btn.addEventListener('click', ()=> showView(btn.dataset.view));
  });

  // Mobile bottom nav — same VIEWS data, same showView() dispatch. Deliberately does NOT reuse the
  // sidebar's .navbtn class: .navbtn.active is styled as a filled horizontal pill for the sidebar,
  // and sharing that class here made the active bottom-tab render as an oversized blue blob instead
  // of a small icon+label. Active-state toggling below uses [data-view] instead, which both share.
  const bottomViews = VIEWS.filter(v=> BOTTOM_NAV_IDS.includes(v.id));
  const moreViews = VIEWS.filter(v=> !BOTTOM_NAV_IDS.includes(v.id));
  const bottomNav = document.getElementById('bottomNav');
  bottomNav.innerHTML = bottomViews.map(v=>`<button class="bottom-nav-btn" data-view="${v.id}">${ICONS[v.icon]}<span>${v.label==='Overview'?'Home':v.label}</span></button>`).join('')
    + `<button class="bottom-nav-btn" id="moreNavBtn">${ICONS.more}<span>More</span></button>`;
  bottomNav.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=> showView(btn.dataset.view));
  });

  const moreSheetItems = document.getElementById('moreSheetItems');
  moreSheetItems.innerHTML = moreViews.map(v=>`<button class="more-sheet-item" data-view="${v.id}">${ICONS[v.icon]}<span>${v.label}</span></button>`).join('');
  moreSheetItems.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      // Selecting an item: tear down the sheet directly (no history.back()) and let showView()'s
      // replaceState collapse the sheet's pushed entry into the new view's entry in one step —
      // calling history.back() here too would race with showView()'s own history write.
      closeMoreSheetVisual();
      showView(btn.dataset.view);
    });
  });

  document.getElementById('moreNavBtn').addEventListener('click', openMoreSheet);
  document.getElementById('moreSheetOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'moreSheetOverlay') closeMoreSheet();
  });
  wireSheetDragToDismiss();
}

// Drag-to-dismiss, gated on scroll position rather than which element was touched — this is the
// pattern every production bottom sheet uses (iOS native sheets, Android BottomSheetBehavior, Vaul,
// etc.) and is provably unambiguous: dragging the handle always dismisses; dragging the list content
// only dismisses once it's already scrolled to the very top AND the drag continues downward from
// there. Any drag that starts with scrollable content still above (sheet.scrollTop > 0), or moves
// upward, is always left alone for native scrolling — this function never even calls preventDefault
// in that case, so the browser's own touch-scroll handles it with zero interference.
function wireSheetDragToDismiss(){
  const sheet = document.querySelector('.more-sheet');
  const handle = document.getElementById('moreSheetHandleHit');
  if(!sheet) return;
  let startY = 0, dragDelta = 0, dragging = false, mode = null; // mode: 'dismiss' | 'scroll' | null

  sheet.addEventListener('pointerdown', (e)=>{
    startY = e.clientY;
    dragDelta = 0;
    dragging = true;
    // The handle is always a dismiss-drag regardless of scroll position; content is only a
    // dismiss-drag if it's already scrolled fully to the top when the gesture begins.
    mode = (handle && handle.contains(e.target)) ? 'dismiss' : (sheet.scrollTop <= 0 ? 'pending' : 'scroll');
    sheet.style.transition = 'none';
  });
  sheet.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const delta = e.clientY - startY;
    if(mode === 'scroll') return; // let the browser's native scroll handle this entirely
    if(mode === 'pending'){
      // First movement decides intent: dragging down from the top → dismiss; anything else → scroll
      if(delta <= 0){ mode = 'scroll'; return; }
      mode = 'dismiss';
    }
    // mode is 'dismiss' from here on for this gesture
    dragDelta = Math.max(0, delta);
    sheet.style.transform = `translateY(${dragDelta}px)`;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(mode === 'dismiss'){
      sheet.style.transition = 'transform .25s cubic-bezier(.2,.9,.3,1)';
      if(dragDelta > 80){
        closeMoreSheet(); // routes through history.back(); popstate resets the transform on teardown
      } else {
        sheet.style.transform = 'translateY(0)';
      }
    }
    dragDelta = 0;
    mode = null;
  }
  sheet.addEventListener('pointerup', endDrag);
  sheet.addEventListener('pointercancel', endDrag);
}

// More sheet behaves like a modal, same as Session Mode: opening pushes a real history entry so the
// first back-press (hardware/gesture) dismisses the sheet instead of exiting the app outright.
// Background-scroll protection is CSS-only (touch-action:none on the backdrop, overscroll-behavior on
// the sheet/body) — a JS position:fixed body-lock was tried here and reverted: it's a known cause of
// broken touch-scroll on nested overflow:auto containers on mobile, and ended up breaking the sheet's
// own scrolling instead of just protecting the backdrop.
function openMoreSheet(){
  document.getElementById('moreSheetOverlay').classList.add('open');
  document.getElementById('moreNavBtn').classList.add('active');
  const sheet = document.querySelector('.more-sheet');
  if(sheet) sheet.style.transform = ''; // defensive reset in case a prior drag didn't fully clean up
  history.pushState({ sheet:true }, '', location.hash);
}
// Visual-only teardown, no history manipulation — used both by the popstate handler (after a real
// back navigation already occurred) and by the item-select path (which replaces state instead).
function closeMoreSheetVisual(){
  document.getElementById('moreSheetOverlay').classList.remove('open');
  document.getElementById('moreNavBtn').classList.remove('active');
  const sheet = document.querySelector('.more-sheet');
  if(sheet) sheet.style.transform = ''; // reset any in-progress drag offset so it doesn't reopen shifted
}
// Explicit dismiss (backdrop tap) — routes through history.back() so the pushed entry is actually
// popped; the popstate handler then calls closeMoreSheetVisual() to do the real teardown.
function closeMoreSheet(){
  history.back();
}

function showView(id){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===id));
  const moreBtn = document.getElementById('moreNavBtn');
  if(moreBtn) moreBtn.classList.toggle('active', !BOTTOM_NAV_IDS.includes(id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+id);
  if(el) el.classList.add('active');
  if(VIEW_RENDERERS[id]) VIEW_RENDERERS[id]();
  window.scrollTo(0,0);
  // Switching between main tabs replaces the current history entry rather than stacking a new one —
  // tab navigation isn't something back/forward should step through one hop at a time (that produced
  // a deep, confusing stack where "back" from Home didn't actually exit the app for several presses).
  // Session Mode is the one thing that still pushes real stack depth, since it behaves like a modal.
  history.replaceState({ view:id }, '', '#'+id);
}

// Back/forward navigation — Session Mode and the More sheet both behave like modals and are the only
// things that push a real history entry (see startSessionMode / openMoreSheet). One back-press closes
// whichever is open; since regular tab navigation no longer stacks, a subsequent back-press from the
// underlying view then correctly exits the app rather than stepping through previously-visited tabs.
window.addEventListener('popstate', (e)=>{
  if(SESSION){
    closeSessionMode();
    return;
  }
  const moreSheet = document.getElementById('moreSheetOverlay');
  if(moreSheet && moreSheet.classList.contains('open')){
    closeMoreSheetVisual();
    return;
  }
  const view = (e.state && e.state.view) || 'overview';
  showView(view);
});

/* ---------- ATHLETE PROFILE ----------
   Central athlete data store for future features (Training Goals, Hybrid Score, Adaptive Training,
   etc.) to read from instead of maintaining duplicate athlete info. Lives under the same 'profile'
   key that already stored { weight } — this is a purely additive extension of that existing object,
   not a new storage system. See getAthleteProfile()/saveAthleteProfile() below for the shared shape. */
/* ---------- BODY WEIGHT: SINGLE SOURCE OF TRUTH ----------
   Architecture repair A1: body weight previously existed as three uncoordinated values —
   profile.weight, the latest weight-log entry, and (separately, untouched by this repair) a Training
   Goal's currentValue. weight-log is now the sole authority; profile.weight is never independently
   written or trusted again. Every screen that shows or edits "current weight" goes through
   getCurrentWeight()/recordWeight() below, so there is exactly one place a weight measurement lives. */
async function getCurrentWeight(){
  const log = await getJSON('weight-log', []);
  if(log.length){
    // Latest by date; same-day ties broken by insertion order (chronological), not by re-sorting —
    // same reasoning as the earlier "Last time" session-history fix.
    let latest = log[0];
    log.forEach(e=>{ if(e.date >= latest.date) latest = e; });
    return latest.weight;
  }
  // No weight-log yet (brand new user, or migration hasn't run this session) — fall back to whatever
  // profile.weight holds, defaulting to 72 for a genuinely fresh install.
  const profile = await getJSON('profile', {});
  return profile.weight || 72;
}

// Canonical way to record a body-weight measurement — the only function that should ever write a
// weight value anywhere in the app. Updates today's entry in place rather than appending a duplicate
// if one already exists for the same date, since Overview/Nutrition/Profile's quick-edit controls are
// meant to correct "today's" weight, not log multiple measurements per day.
async function recordWeight(value, date){
  date = date || todayKey();
  const log = await getJSON('weight-log', []);
  const idx = log.findIndex(e=>e.date===date);
  if(idx >= 0) log[idx] = {date, weight:value};
  else log.push({date, weight:value});
  await setJSON('weight-log', log);
}

// One-time migration: an existing user may have profile.weight but have never logged anything in
// weight-log (this repair predates weight-log being the authority). Seed weight-log with that value
// so it isn't lost — but only if weight-log is genuinely empty, and only ever once, so it can never
// overwrite real history or re-run on every load.
async function migrateProfileWeightToLog(){
  const done = await getJSON('weight-log-migrated', false);
  if(done) return;
  const log = await getJSON('weight-log', []);
  if(log.length === 0){
    const profile = await getJSON('profile', {});
    if(profile.weight){
      await setJSON('weight-log', [{date: todayKey(), weight: profile.weight}]);
    }
  }
  await setJSON('weight-log-migrated', true);
}

const PROFILE_DEFAULTS = {
  weight: 72, name:'', age:'', gender:'', height:'',
  experience:'', daysPerWeek:'', sessionMinutes:'', equipment:'',
  strengthLevel:'', enduranceLevel:'', primaryGoal:'', secondaryGoal:'',
};
async function getAthleteProfile(){
  const saved = await getJSON('profile', {});
  const weight = await getCurrentWeight(); // always derived — never trust a stored profile.weight directly
  return { ...PROFILE_DEFAULTS, ...saved, weight };
}
async function saveAthleteProfile(patch){
  const current = await getAthleteProfile();
  const { weight, ...rest } = patch;
  if(weight !== undefined && weight !== '' && weight !== current.weight){
    await recordWeight(weight); // weight changes always go through the authoritative log, never the profile blob
  }
  const merged = { ...current, ...rest };
  delete merged.weight; // never persist weight inside 'profile' — weight-log is the only source of truth
  await setJSON('profile', merged);
}

/* ---------- TRAINING GOALS ----------

// The goal catalog is the single source of truth for "what can this metric mean" — unit, how the
// value should be entered, and which direction counts as progress. The UI asks the athlete WHAT they
// want to achieve (category → metric) and reads everything else from here, instead of asking them to

//   valueType: 'time' (separate min/sec inputs) | 'number' (plain numeric, shown with unit)

    { id:'5k_session', label:'5K Single Session', unit:'km', valueType:'number', direction:'higher', type:'distance' },
    { id:'10k_session', label:'10K Single Session', unit:'km', valueType:'number', direction:'higher', type:'distance' },
    { id:'half_session', label:'Half Marathon Single Session', unit:'km', valueType:'number', direction:'higher', type:'distance' },
    { id:'marathon_session', label:'Marathon Single Session', unit:'km', valueType:'number', direction:'higher', type:'distance' },
  ],

    { id:'bench', label:'Bench Press', unit:'kg', valueType:'number', direction:'higher' },
    { id:'deadlift', label:'Deadlift', unit:'kg', valueType:'number', direction:'higher' },
    { id:'ohp', label:'Overhead Press', unit:'kg', valueType:'number', direction:'higher' },
    { id:'pullups', label:'Max Pull-ups', unit:'reps', valueType:'number', direction:'higher' },
  ],
  Body: [
    { id:'bodyweight', label:'Body Weight', unit:'kg', valueType:'number', direction:'auto' },
    { id:'bodyfat', label:'Body Fat %', unit:'%', valueType:'number', direction:'lower' },
  ],
  Consistency: [
    { id:'adherence', label:'Training Consistency', unit:'%', valueType:'number', direction:'higher' },

  ],
  Other: [
    { id:'custom', label:'Custom Goal', unit:'', valueType:'number', direction:'higher', customizable:true },
  ],
};
function findGoalMetric(category, metricId){
  return (GOAL_CATALOG[category]||[]).find(m=>m.id===metricId) || null;

/* ---------- ARCHITECTURE REPAIR A2 / RUNNING REWORK: goal current-value resolver ----------
   Goal TARGET is always user intent and is never touched here. Goal CURRENT VALUE is resolved fresh
   from existing authoritative data on every render for metrics where that mapping is unambiguous —
   never persisted back into the stored goal, so it can never fall out of sync or need an update hook
   scattered elsewhere. Metrics without a safe, exact data source return null and the caller falls
   back to the goal's own manually-maintained currentValue.

   Classification (verified against the actual exercise/activity data in this codebase, not assumed):
   🟢 AUTO — Body/bodyweight (weight-log, via A1's getCurrentWeight); Running/weekly_distance (rolling
      7-day sum of pace-log) and Running/longest_run + the four Single Session metrics (all read the
      same underlying "max single logged run distance" — they differ only in what target the athlete
      set, not in how current is derived); Strength/bench, Strength/deadlift, Strength/pullups
      (exercise-weights, but ONLY because 'Bench Press', 'Deadlift', and 'Pull-ups' exist as exact,
      unambiguous exercise names in this app's programs).
   🟢 AUTO (added later) — Running/5k_time, 10k_time, half_time, marathon_time: pace-log still has no
      race/effort tagging, so this reads distance-matched runs (within the same tolerance band already
      used for Long Run auto-check matching) and takes the fastest logged time among them as a best-
      effort proxy. This is a deliberate, explicitly-requested loosening of the original A2 stance
      above (which held that inferring a time-trial result from an untagged log was unsafe) — kept here
      as a distinct, clearly-labeled case rather than silently rewriting the original reasoning.
   🟡 MANUAL — Strength/squat and Strength/ohp: no exact "Squat" or "Overhead Press" exercise exists —
      only named variants (Back Squat/Front Squat/Bulgarian Split Squat; Standing Overhead Press/Seated
      DB Shoulder Press/Arnold Press) with no single correct pick. Body/bodyfat: measurements-log has no
      body-fat field at all. Consistency/adherence and streak: no existing adherence or streak
      calculation exists anywhere to reuse, and inventing one (what window? what counts?) would be a new
      feature, not a data connection. Other/custom: free-form by definition, can never be mapped. */
const RUNNING_SESSION_DISTANCE_METRICS = ['longest_run', '5k_session', '10k_session', 'half_session', 'marathon_session'];
// Standard race distances (km) for matching logged runs to a time-goal's category. pace-log entries
// aren't tagged by race type, so matching uses the same tolerance convention as the existing Long Run
// auto-check (Math.max(0.5, target*0.15)) rather than requiring an exact km hit.
const RUNNING_TIME_DISTANCE_KM = { '5k_time':5, '10k_time':10, 'half_time':21.1, 'marathon_time':42.2 };
async function resolveGoalCurrentValue(goal){
  const { category, metricId } = goal;

  if(category === 'Body' && metricId === 'bodyweight'){
    return await getCurrentWeight();
  }

  if(category === 'Running' && metricId === 'weekly_distance'){
    const log = await getJSON('pace-log', []);
    const cutoff = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
    const total = log.filter(r=> r.date >= cutoff).reduce((sum,r)=> sum + (parseFloat(r.dist)||0), 0);
    return log.length ? Math.round(total*10)/10 : null;
  }

  if(category === 'Running' && RUNNING_SESSION_DISTANCE_METRICS.includes(metricId)){
    // Longest Single Run and the four Single Session goals (5K/10K/Half/Marathon) all resolve to the
    // same number — the athlete's single longest logged run ever — since "have I done a run of at
    // least X km" and "how long is my longest run" are the same underlying fact, just framed against
    // different targets. Not required to exactly hit 5/10/21.1/42.2km — any distance reaching or
    // exceeding whatever target the athlete set completes that goal.
    const log = await getJSON('pace-log', []);
    if(!log.length) return null;
    return Math.max(...log.map(r=>parseFloat(r.dist)||0));
  }

  const STRENGTH_EXERCISE_MAP = { bench:'Bench Press', deadlift:'Deadlift', pullups:'Pull-ups' };
  if(category === 'Strength' && STRENGTH_EXERCISE_MAP[metricId]){
    const weights = await getAllExerciseWeights();
    const w = weights[STRENGTH_EXERCISE_MAP[metricId]];
    return w ? parseFloat(w) : null;
  }

  if(category === 'Running' && RUNNING_TIME_DISTANCE_KM[metricId] !== undefined){
    const log = await getJSON('pace-log', []);
    if(!log.length) return null;
    const targetKm = RUNNING_TIME_DISTANCE_KM[metricId];
    const tolerance = Math.max(0.5, targetKm*0.15);
    // time is logged in minutes (see renderRunningFreeform/renderRunningGoalPlan); goal values are
    // stored in seconds (see parseTimeToSeconds/formatSecondsToTime), so convert on the way out.
    const matchingTimesSec = log
      .filter(r=>{
        const d = parseFloat(r.dist);
        return d && Math.abs(d - targetKm) <= tolerance;
      })
      .map(r=>parseFloat(r.time))
      .filter(t=> t > 0)
      .map(t=> t*60);
    if(!matchingTimesSec.length) return null;
    return Math.round(Math.min(...matchingTimesSec)); // best (fastest) = lowest seconds — goal is a performance target
  }

  return null; // not safely derivable — caller uses the goal's own stored currentValue
}

// Mirrors resolveGoalCurrentValue's coverage exactly (kept as a static check rather than calling the
// resolver itself, since the form needs to know synchronously whether to offer "Auto" at all — the
// actual live value is only fetched once the athlete picks that option).
const STRENGTH_AUTO_METRICS = ['bench', 'deadlift', 'pullups'];
function isAutoCapableMetric(category, metricId){
  if(category === 'Body' && metricId === 'bodyweight') return true;
  if(category === 'Running' && (metricId === 'weekly_distance' || RUNNING_SESSION_DISTANCE_METRICS.includes(metricId))) return true;
  if(category === 'Running' && RUNNING_TIME_DISTANCE_KM[metricId] !== undefined) return true;
  if(category === 'Strength' && STRENGTH_AUTO_METRICS.includes(metricId)) return true;
  return false;
}

// Time goals (e.g. a 5K finish time) are entered as MM:SS but stored as total seconds internally, so
// progress math stays on plain numbers rather than needing separate time-parsing logic at calc time.
function parseTimeToSeconds(str){
  const m = String(str).trim().match(/^(\d+):(\d{1,2})$/);
  if(!m) return null;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
function formatSecondsToTime(sec){
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// Progress is intentionally simple and transparent. Two distinct models, chosen by what actually
// makes sense for the goal type:
//  - Running distance-type goals (weekly volume, longest run, single-session thresholds) use a plain
//    current/target ratio. A fixed "how far from where you started" baseline is the wrong model here:
//    Weekly Distance is a rolling 7-day sum that naturally goes down as well as up between weeks, and
//    the four Single Session goals are pure thresholds (100% the moment one qualifying run happens) —
//    neither is a monotonic "improvement from a starting point."
//  - Everything else (manual time goals, strength, body weight, etc.) keeps the direction-aware
//    baseline model, which is correct for goals with a meaningful fixed starting point.
const RUNNING_DISTANCE_GOAL_METRICS = ['weekly_distance', ...RUNNING_SESSION_DISTANCE_METRICS];
function computeGoalProgress(goal){
  const { startValue, currentValue, targetValue, direction, category, metricId } = goal;
  if(category === 'Running' && RUNNING_DISTANCE_GOAL_METRICS.includes(metricId)){
    if(!targetValue) return 0;
    return Math.max(0, Math.min(100, Math.round((currentValue / targetValue) * 100)));
  }
  const span = direction === 'lower' ? (startValue - targetValue) : (targetValue - startValue);
  if(!span) return currentValue === targetValue ? 100 : 0; // start === target — avoid divide-by-zero
  const moved = direction === 'lower' ? (startValue - currentValue) : (currentValue - startValue);
  return Math.max(0, Math.min(100, Math.round((moved / span) * 100)));
}

function formatGoalValue(goal, value){
  if(goal.unit === 'min:sec') return formatSecondsToTime(value);
  return `${value}${goal.unit ? ' '+goal.unit : ''}`;
}

async function renderTrainingGoals(){
  const el = document.getElementById('view-goals');
  const rawGoals = await getJSON('training-goals', []);
  const profile = await getAthleteProfile();

  // A2/current-value-modes: resolve a live current value for every goal where it's safely derivable;
  // goals without a safe source keep their own stored currentValue, which may itself be null if the
  // athlete chose "I don't know" and nothing relevant has been logged yet. Pre-computed here (can't
  // await inside the template-building functions below).
  //
  // Lazy baseline capture: a goal created with "I don't know" (or "Auto" before any data existed yet)
  // stores startValue/currentValue as null. The very first time this resolves to a real value, that
  // value is written into the goal's OWN startValue/currentValue fields — a legitimate one-time write
  // to a field the goal itself owns (not a second copy of the underlying performance data, which
  // remains solely in weight-log/pace-log/exercise-weights). After that first capture, this is a pure
  // read on every subsequent render, exactly like the rest of A2.
  const resolvedMap = {}, autoMap = {};
  let goalsChanged = false;
  const goals = rawGoals.slice(); // may get baseline-captured entries swapped in below
  for(let i=0; i<goals.length; i++){
    const g = goals[i];
    const resolved = await resolveGoalCurrentValue(g);
    const hasValue = resolved !== null && resolved !== undefined;
    if(hasValue && (g.startValue === null || g.startValue === undefined)){
      goals[i] = { ...g, startValue: resolved, currentValue: resolved };
      goalsChanged = true;
    }
    resolvedMap[goals[i].id] = hasValue ? resolved : goals[i].currentValue;
    autoMap[goals[i].id] = hasValue;
  }
  if(goalsChanged) await setJSON('training-goals', goals);

  // Filtered AFTER the capture step above, so a goal that just got its baseline written this render
  // carries the correct startValue into computeGoalProgress() immediately, not one render later.
  const active = goals.filter(g=>g.status!=='completed');
  const completed = goals.filter(g=>g.status==='completed');
  const primary = active.find(g=>g.designation==='primary');
  const secondary = active.filter(g=>g.designation!=='primary');

  function goalCardHTML(g){
    const effectiveCurrent = resolvedMap[g.id];
    const isAuto = autoMap[g.id];
    const hasCurrent = effectiveCurrent !== null && effectiveCurrent !== undefined;
    const pct = hasCurrent ? computeGoalProgress({...g, currentValue: effectiveCurrent}) : 0;
    const waitingNote = !hasCurrent ? (g.currentValueMode==='unknown'
      ? "Waiting for you to log something relevant — we'll pick it up automatically."
      : "No current value set yet — edit this goal to add one.") : '';
    return `
    <div class="card goal-card" data-goalid="${g.id}" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <span class="tag ${g.designation==='primary'?'blue':'gray'}">${g.designation==='primary'?'PRIMARY GOAL':'SECONDARY GOAL'}</span>
        <span class="tag gray">${g.category}</span>
      </div>
      <h3 style="margin-top:10px;">${esc(g.name)}</h3>
      <div class="grid g2" style="margin-top:10px;">
        <div><div class="stat-label">Current${isAuto?' <span class="tag" style="background:rgba(31,177,90,.12);color:var(--green);font-size:9px;margin-left:4px;">LIVE</span>':''}</div><div class="stat-value" style="font-size:20px;">${hasCurrent?formatGoalValue(g, effectiveCurrent):'—'}</div></div>
        <div><div class="stat-label">Target</div><div class="stat-value" style="font-size:20px;">${formatGoalValue(g, g.targetValue)}</div></div>
      </div>
      <div class="goal-progress-track"><div class="goal-progress-fill${pct>=100?' complete':''}" style="width:${pct}%;"></div></div>
      <p class="muted" style="margin-top:6px;font-size:12px;">${hasCurrent?`${pct}% of the way to target`:waitingNote}${g.deadline?` · by ${g.deadline}`:''}${isAuto&&hasCurrent?' · current value updates automatically from your logged activity':''}</p>
      <div class="goal-card-actions">
        <button data-editgoal="${g.id}">Edit</button>
        ${g.designation!=='primary'?`<button class="primary-action" data-setprimary="${g.id}">Set as Primary</button>`:''}
        <button data-completegoal="${g.id}">Mark Complete</button>
        <button class="danger" data-deletegoal="${g.id}">Delete</button>
      </div>
    </div>`;
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Measurable Targets</div>
      <div class="page-title">Training Goals</div>
      <div class="page-sub">Turn your profile's objectives into specific targets you can track progress against.${profile.primaryGoal?` Your profile's primary objective: <b>${profile.primaryGoal}</b>.`:''}</div>

          <button class="goal-chip" data-runtype="distance">Distance</button>
        </div>
      </div>

      <div id="gfMetricStep" style="display:none;">

        <div class="goal-chip-row" id="gfMetricChips"></div>
