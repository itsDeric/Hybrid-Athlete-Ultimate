/* ---------- PROGRESS CHARTS ---------- */
let CHART_INSTANCES = {};
const CHART_COLORS = { blue:'#0a6cff', ink:'#111114', gray:'#9a9aa2', green:'#1fb15a', amber:'#c98a12', red:'#e0352b' };

function destroyChart(id){
  if(CHART_INSTANCES[id]){ CHART_INSTANCES[id].destroy(); delete CHART_INSTANCES[id]; }
}

function baseChartOptions(extra){
  return Object.assign({
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display:false }, ticks: { font: { family:'Inter', size:10 }, color: CHART_COLORS.gray } },
      y: { grid: { color:'#eeeef1' }, ticks: { font: { family:'IBM Plex Mono', size:10 }, color: CHART_COLORS.gray } },
    },
  }, extra||{});
}

async function renderProgressCharts(wLog, bLog, pLog, retryCount){
  retryCount = retryCount || 0;
  if(typeof Chart === 'undefined'){
    // Give the CDN (and its fallback) time to load, but don't retry forever — after ~9s, tell the
    // user instead of leaving every chart card silently blank with no explanation.
    if(retryCount >= 30){
      ['chartWeight','chartStrength','chartVolume','chartBody'].forEach(id=>{
        const c = document.getElementById(id);
        if(c && c.parentElement) c.parentElement.innerHTML = `<p class="muted" style="padding-top:80px;text-align:center;">Charts failed to load — check your internet connection and refresh the page.</p>`;
      });
      return;
    }
    setTimeout(()=>renderProgressCharts(wLog,bLog,pLog,retryCount+1), 300);
    return;
  }
  const history = await getJSON('session-history', []);

  // 1. Weight Trend
  destroyChart('weight');
  const wSorted = wLog.slice().sort((a,b)=> a.date.localeCompare(b.date));
  const wCanvas = document.getElementById('chartWeight');
  if(wCanvas){
    if(!wSorted.length){
      wCanvas.parentElement.innerHTML = `<p class="muted" style="padding-top:80px;text-align:center;">Log a few weight entries in the Weight tab to see your trend here.</p>`;
    } else {
      CHART_INSTANCES.weight = new Chart(wCanvas, {
        type: 'line',
        data: { labels: wSorted.map(r=>r.date), datasets: [{
          data: wSorted.map(r=>r.weight), borderColor: CHART_COLORS.blue, backgroundColor: 'rgba(10,108,255,.08)',
          fill: true, tension: .3, pointRadius: 3, pointBackgroundColor: CHART_COLORS.blue,
        }]},
        options: baseChartOptions(),
      });
    }
  }

  // 2. Exercise Log — every exercise ever logged, across every program, click to see its chart
  const exerciseNames = new Set();
  const lastLoggedDate = {}; // name -> most recent date it was logged, so the newest exercise appears first
  history.forEach(s => s.exercises.forEach(e=>{
    if(e.weight){
      exerciseNames.add(e.name);
      if(!lastLoggedDate[e.name] || s.date > lastLoggedDate[e.name]) lastLoggedDate[e.name] = s.date;
    }
  }));
  pLog.forEach(p => {
    exerciseNames.add(p.ex);
    if(!lastLoggedDate[p.ex] || p.date > lastLoggedDate[p.ex]) lastLoggedDate[p.ex] = p.date;
  });
  const chipRow = document.getElementById('exerciseChipRow');
  if(chipRow){
    // Most recently logged exercise first, so finishing a session surfaces it immediately — ties broken alphabetically
    const names = Array.from(exerciseNames).sort((a,b)=>{
      const d = (lastLoggedDate[b]||'').localeCompare(lastLoggedDate[a]||'');
      return d !== 0 ? d : a.localeCompare(b);
    });
    if(!names.length){
      chipRow.innerHTML = `<p class="muted">No exercises logged yet — finish a session or add a PR to see them here.</p>`;
      destroyChart('strength');
      const canvas = document.getElementById('chartStrength');
      if(canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    } else {
      chipRow.innerHTML = names.map((n,i)=>`<button class="exercise-chip ${i===0?'active':''}" data-ex="${n}">${n}</button>`).join('');
      const drawStrengthChart = (chosen)=>{
        destroyChart('strength');
        const weightPoints = {}, oneRMPoints = {};
        history.forEach(s=>{
          const match = s.exercises.find(e=>e.name===chosen && e.weight);
          if(match) weightPoints[s.date] = parseFloat(match.weight);
          // Best estimated 1RM this session, from actual completed working sets (only available on entries logged since set types shipped)
          if(match && match.sets){
            let best = 0;
            match.sets.forEach(set=>{
              if(!set.done || set.type!=='working') return;
              const oneRM = estimated1RM(set.weight, set.reps);
              if(oneRM && oneRM > best) best = oneRM;
            });
            if(best) oneRMPoints[s.date] = Math.round(best*10)/10;
          }
        });
        pLog.filter(p=>p.ex===chosen).forEach(p=>{
          weightPoints[p.date] = parseFloat(p.w);
          const oneRM = estimated1RM(p.w, p.r);
          if(oneRM) oneRMPoints[p.date] = Math.max(oneRMPoints[p.date]||0, Math.round(oneRM*10)/10);
        });
        const dates = Array.from(new Set([...Object.keys(weightPoints), ...Object.keys(oneRMPoints)])).sort();
        const canvas = document.getElementById('chartStrength');
        if(!canvas) return;
        if(!dates.length){
          canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
          return;
        }
        const datasets = [{
          label:'Weight', data: dates.map(d=> weightPoints[d]!==undefined ? weightPoints[d] : null),
          borderColor: CHART_COLORS.ink, backgroundColor: 'rgba(17,17,20,.06)',
          fill: true, tension: .25, pointRadius: 3, pointBackgroundColor: CHART_COLORS.ink, spanGaps:true,
        }];
        if(Object.keys(oneRMPoints).length){
          datasets.push({
            label:'Est. 1RM', data: dates.map(d=> oneRMPoints[d]!==undefined ? oneRMPoints[d] : null),
            borderColor: CHART_COLORS.blue, backgroundColor: 'transparent', borderDash:[5,4],
            fill:false, tension:.25, pointRadius:2.5, pointBackgroundColor: CHART_COLORS.blue, spanGaps:true,
          });
        }
        CHART_INSTANCES.strength = new Chart(canvas, {
          type: 'line',
          data: { labels: dates, datasets },
          options: baseChartOptions({ plugins:{ legend:{ display: datasets.length>1, position:'top', align:'end', labels:{boxWidth:10,font:{family:'Inter',size:11}} } } }),
        });
      };
      drawStrengthChart(names[0]);
      chipRow.querySelectorAll('.exercise-chip').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          chipRow.querySelectorAll('.exercise-chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          drawStrengthChart(chip.dataset.ex);
        });
      });
    }
  }

  // 3. Weekly Training Volume — actual tonnage (kg) moved across completed working sets, last 8 weeks.
  // Falls back to weight × completed-set-count for older entries logged before per-set reps existed.
  destroyChart('volume');
  const volCanvas = document.getElementById('chartVolume');
  if(volCanvas){
    if(!history.length){
      volCanvas.parentElement.innerHTML = `<p class="muted" style="padding-top:80px;text-align:center;">Finish a few sessions in Session Mode to see your weekly volume here.</p>`;
    } else {
      function weekLabel(dateStr){
        const d = new Date(dateStr+'T00:00:00');
        const jan1 = new Date(d.getFullYear(),0,1);
        const week = Math.ceil((((d - jan1)/86400000) + jan1.getDay()+1)/7);
        return d.getFullYear()+'-W'+week;
      }
      function sessionTonnage(s){
        let total = 0;
        (s.exercises||[]).forEach(e=>{
          if(e.sets){
            e.sets.forEach(set=>{
              if(!set.done || set.type!=='working') return;
              const w = parseFloat(set.weight);
              if(w && set.reps) total += w * parseInt(set.reps);
            });
          } else if(e.weight && e.setsCompleted){
            // legacy entry without per-set reps — approximate using weight × sets completed
            total += parseFloat(e.weight) * e.setsCompleted;
          }
        });
        return total;
      }
      const totals = {};
      history.forEach(s=>{ const wk = weekLabel(s.date); totals[wk] = (totals[wk]||0) + sessionTonnage(s); });
      const weeks = Object.keys(totals).sort().slice(-8);
      CHART_INSTANCES.volume = new Chart(volCanvas, {
        type: 'bar',
        data: { labels: weeks, datasets: [{ data: weeks.map(w=>Math.round(totals[w])), backgroundColor: CHART_COLORS.blue, borderRadius: 6, maxBarThickness: 36 }]},
        options: baseChartOptions({ scales: { x:{ grid:{display:false}, ticks:{font:{family:'Inter',size:10},color:CHART_COLORS.gray} }, y:{ grid:{color:'#eeeef1'}, ticks:{precision:0, font:{family:'IBM Plex Mono',size:10},color:CHART_COLORS.gray} } } }),
      });
    }
  }

  // 3b. Muscle Group Balance — volume by category over the last 7 days, using the exercise library's
  // category groupings to spot what's being neglected week to week.
  destroyChart('muscle');
  const muscleCanvas = document.getElementById('chartMuscle');
  if(muscleCanvas){
    const nameToCategory = {};
    Object.keys(EXERCISE_LIBRARY).forEach(cat=> EXERCISE_LIBRARY[cat].forEach(n=> nameToCategory[n]=cat));
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const catTotals = {};
    history.filter(s=> s.date >= cutoffStr).forEach(s=>{
      (s.exercises||[]).forEach(e=>{
        const cat = nameToCategory[e.name] || 'Other';
        let vol = 0;
        if(e.sets){
          e.sets.forEach(set=>{
            if(!set.done || set.type!=='working') return;
            const w = parseFloat(set.weight);
            if(w && set.reps) vol += w * parseInt(set.reps);
          });
        } else if(e.weight && e.setsCompleted){
          vol = parseFloat(e.weight) * e.setsCompleted;
        }
        if(vol) catTotals[cat] = (catTotals[cat]||0) + vol;
      });
    });
    const cats = Object.keys(catTotals).sort((a,b)=> catTotals[b]-catTotals[a]);
    if(!cats.length){
      muscleCanvas.parentElement.innerHTML = `<p class="muted" style="padding-top:100px;text-align:center;">Finish a session in the last 7 days to see your muscle group split here.</p>`;
    } else {
      CHART_INSTANCES.muscle = new Chart(muscleCanvas, {
        type: 'bar',
        data: { labels: cats, datasets: [{ data: cats.map(c=>Math.round(catTotals[c])), backgroundColor: CHART_COLORS.green, borderRadius: 6, maxBarThickness: 30 }]},
        options: baseChartOptions({
          indexAxis: 'y',
          scales: { x:{ grid:{color:'#eeeef1'}, ticks:{precision:0, font:{family:'IBM Plex Mono',size:10},color:CHART_COLORS.gray} }, y:{ grid:{display:false}, ticks:{font:{family:'Inter',size:11},color:CHART_COLORS.ink} } }
        }),
      });
    }
  }

  // 4. Body Measurements Trend
  destroyChart('body');
  const bSorted = bLog.slice().sort((a,b)=> a.date.localeCompare(b.date));
  const bodyCanvas = document.getElementById('chartBody');
  if(bodyCanvas){
    if(!bSorted.length){
      bodyCanvas.parentElement.innerHTML = `<p class="muted" style="padding-top:100px;text-align:center;">Log body measurements to see trends here.</p>`;
    } else {
      const series = [
        { key:'chest', label:'Chest', color: CHART_COLORS.blue },
        { key:'waist', label:'Waist', color: CHART_COLORS.red },
        { key:'shoulders', label:'Shoulders', color: CHART_COLORS.green },
        { key:'arms', label:'Arms', color: CHART_COLORS.amber },
        { key:'thighs', label:'Thighs', color: CHART_COLORS.ink },
      ];
      CHART_INSTANCES.body = new Chart(bodyCanvas, {
        type: 'line',
        data: { labels: bSorted.map(r=>r.date), datasets: series.map(s=>({
          label: s.label, data: bSorted.map(r=> r[s.key] ? parseFloat(r[s.key]) : null),
          borderColor: s.color, backgroundColor: s.color, tension: .3, pointRadius: 2, spanGaps: true,
        }))},
        options: baseChartOptions({ plugins: { legend: { display:true, position:'bottom', labels:{ boxWidth:10, font:{family:'Inter',size:11} } } } }),
      });
    }
  }
}


/* ---------- CHEAT SHEET ---------- */
async function renderCheat(){
  const el = document.getElementById('view-cheat');
  const profile = await getJSON('profile', {weight:72});
  const w = profile.weight;
  const todayName = new Date().toLocaleDateString('en-US',{weekday:'long'});
  const habitState = await getJSON('habits:'+todayKey(), {});

  const activeId = await getJSON('active-program', null);
  const cheatWeights = await getAllExerciseWeights();
  let sheetTitle, sessionHTML, activeProg = null;
  if(activeId){
    const custom = await getJSON('custom-programs', []);
    activeProg = custom.find(p=>p.id===activeId);
    const dayData = activeProg ? activeProg.days[todayName] : null;
    sheetTitle = activeProg ? activeProg.name : 'Full Rest Day';
    if(!dayData || dayData.type==='rest'){
      sessionHTML = `<div class="row"><span>Focus</span><span class="v">Full recovery</span></div>`;
    } else {
      sessionHTML = dayData.exercises.map(e=>`<div class="row"><span>${e.name}</span><span class="v">${e.sets}×${e.reps}${cheatWeights[e.name]?' @ '+cheatWeights[e.name]+'kg':''}</span></div>`).join('') || `<div class="row"><span>Focus</span><span class="v">Training day — no exercises added yet</span></div>`;
    }
  } else {
    const plan = WEEK_PLAN.find(d=>d.day===todayName) || {title:'Full Rest Day', type:'rest'};
    sheetTitle = plan.title;
    if(plan.type==='gym' || plan.type==='both'){
      const gymDay = GYM[todayName];
      if(gymDay){
        sessionHTML = gymDay.exercises.map(e=>{
          const logged = cheatWeights[e[0]];
          return `<div class="row"><span>${e[0]}</span><span class="v">${e[1]}×${e[2]}${logged?' @ '+logged+'kg':''}</span></div>`;
        }).join('');
        if(plan.type==='both') sessionHTML += `<div class="row"><span>+ Recovery Run</span><span class="v">20-30 min</span></div>`;
      } else {
        sessionHTML = `<div class="row"><span>Type</span><span class="v">Gym</span></div>`;
      }
    } else if(plan.type==='run'){
      sessionHTML = `<div class="row"><span>Type</span><span class="v">Running</span></div>
       <div class="row"><span>Warm-up</span><span class="v">5–10 min brisk walk</span></div>`;
    } else {
      sessionHTML = `<div class="row"><span>Focus</span><span class="v">Full recovery</span></div>`;
    }
  }

  const runGoal = await getJSON('running-goal', undefined);
  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">At A Glance</div>
      <div class="page-title">Daily Cheat Sheet</div>
      <div class="page-sub">Everything for today, one screen — built for printing or a quick morning check.</div>
    </div>
    <div class="sheet">
      <h2>${todayName}</h2>
      <div class="sub">${sheetTitle}</div>
      <div class="sheet-grid">
        <div class="sheet-block">
          <h4>Session</h4>
          ${sessionHTML}
        </div>
        <div class="sheet-block">
          <h4>Nutrition Targets</h4>
          <div class="row"><span>Protein</span><span class="v">${(w*1.8).toFixed(0)}–${(w*2.2).toFixed(0)} g</span></div>
          <div class="row"><span>Carbs</span><span class="v">${(w*4).toFixed(0)}–${(w*6).toFixed(0)} g</span></div>
          <div class="row"><span>Fat</span><span class="v">${(w*0.8).toFixed(0)}–${(w*1).toFixed(0)} g</span></div>
          <div class="row"><span>Creatine</span><span class="v">5 g</span></div>
        </div>
        <div class="sheet-block">
          <h4>Today's Habits</h4>
          ${HABITS.map(h=>`<div class="row"><span>${h.label}</span><span class="v">${habitState[h.id]?'✓':'—'}</span></div>`).join('')}
        </div>
        <div class="sheet-block">
          <h4>Reminders</h4>
          ${activeProg && activeProg.meta ? `
          <div class="row"><span>Duration</span><span class="v">${activeProg.meta.duration||'—'}</span></div>
          <div class="row"><span>Rest</span><span class="v">${activeProg.meta.restNotes||'—'}</span></div>
          <div class="row"><span>Phase</span><span class="v">${activeProg.meta.phase||'—'}</span></div>
          ${activeProg.meta.keepInMind && activeProg.meta.keepInMind[0] ? `<div class="row"><span>Tip</span><span class="v" style="text-align:right;max-width:60%;">${activeProg.meta.keepInMind[0].split(' — ')[0]}</span></div>` : ''}
          ` : `
          <div class="row"><span>Sleep</span><span class="v">7.5–9 hrs</span></div>
          <div class="row"><span>Water</span><span class="v">On track</span></div>
          ${runGoal ? `<div class="row"><span>Run Goal</span><span class="v">${runGoal.distance} km in ${runGoal.weeks} wks</span></div>` : ''}
          `}
        </div>
      </div>
    </div>
    ${pulseLine()}
    <div class="card">
      <h3>Print This Page</h3>
      <p class="muted" style="margin-top:6px;">Use your browser's print function (Ctrl/Cmd + P) — the layout is set up to print cleanly for a daily reference sheet or planner insert.</p>
      <button class="btn" style="margin-top:12px;" onclick="window.print()">Print Cheat Sheet</button>
    </div>
  `;
}

/* ============================================================
   COUNTDOWN
============================================================ */
async function renderCountdown(){
  const box = document.getElementById('sidebarCountdown');
  if(!box) return;
  const goal = await getJSON('running-goal', undefined);
  if(!goal){ box.style.display = 'none'; return; } // undefined (never set) or null (explicitly freeform) — nothing to count down to
  const start = new Date((goal.startedOn||todayKey())+'T00:00:00');
  const target = new Date(start.getTime() + goal.weeks*7*86400000);
  const now = new Date();
  const diffDays = Math.max(0, Math.ceil((target - now)/86400000));
  document.getElementById('countdownLabel').textContent = `${goal.label} Goal`;
  document.getElementById('countdownNum').textContent = diffDays;
  document.getElementById('countdownSub').textContent = diffDays===1 ? 'day remaining' : 'days remaining';
  box.style.display = '';
}

/* ============================================================
   FIRST-RUN ONBOARDING
============================================================ */
async function maybeShowOnboarding(){
  const done = await getJSON('onboarded', false);
  if(done) return;

  // Safety net: if there's any sign of prior use, this isn't a first run —
  // back-fill the flag instead of interrupting an existing user.
  const existingPrograms = await getJSON('custom-programs', []);
  const existingProfile = await getJSON('profile', null);
  const existingActive = await getJSON('active-program', 'unset');
  const hasPriorActivity = (existingPrograms && existingPrograms.length > 0)
    || (existingProfile !== null)
    || (existingActive !== 'unset');
  if(hasPriorActivity){
    await setJSON('onboarded', true);
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'onboard-overlay';
  overlay.id = 'onboardOverlay';

  const options = [
    { key:'__builtin__', name:'Hybrid Athlete', desc:'5-month gym + running program — build a lean athletic physique and finish a 30 km run.' },
    ...PRESET_TEMPLATES.map((t,i)=>({ key:'__template__'+i, name:t.name, desc:t.desc||'' })),
  ];

  overlay.innerHTML = `
    <div class="onboard-card">
      <div class="onboard-head">
        <div class="eyebrow">Welcome</div>
        <h2>What are you training for?</h2>
        <p>Pick a program to start with — you can switch or build your own any time from Program Builder.</p>
      </div>
      <div class="onboard-grid">
        ${options.map(o=>`
          <button class="onboard-option" data-choose="${o.key}">
            <div class="oname">${o.name}</div>
            <div class="odesc">${o.desc}</div>
          </button>`).join('')}
        <button class="onboard-option build-own" data-choose="__custom__">
          <div class="oname">${ICONS.plus} Build My Own</div>
          <div class="odesc">Start from scratch in Program Builder — name it, pick days, add exercises.</div>
        </button>
      </div>
      <button class="onboard-skip" id="onboardSkip">Skip for now</button>
    </div>
  `;
  document.body.appendChild(overlay);

  async function finishOnboarding(){
    await setJSON('onboarded', true);
    overlay.remove();
  }

  overlay.querySelectorAll('[data-choose]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const choice = btn.dataset.choose;
      if(choice === '__builtin__'){
        await setJSON('active-program', null);
      } else if(choice === '__custom__'){
        await finishOnboarding();
        PB_STATE.editingId = '__new__';
        PB_STATE.activeDay = 'Monday';
        showView('programs');
        return;
      } else if(choice.startsWith('__template__')){
        const idx = parseInt(choice.replace('__template__',''));
        const t = PRESET_TEMPLATES[idx];
        const prog = blankProgram(t.name);
        prog.tag = t.tag;
        if(t.meta) prog.meta = JSON.parse(JSON.stringify(t.meta));
        Object.keys(t.days).forEach(d=>{
          prog.days[d] = { type:t.days[d].type, exercises: t.days[d].exercises.map(e=>({...e})) };
        });
        const list = await getJSON('custom-programs', []);
        list.push(prog);
        await setJSON('custom-programs', list);
        await setJSON('active-program', prog.id);
      }
      await finishOnboarding();
      renderOverview();
      renderWeek();
      renderPrograms();
      renderRecovery();
      renderNutrition();
      renderTimeline();
      renderCheat();
    });
  });

  document.getElementById('onboardSkip').addEventListener('click', finishOnboarding);
}

/* ============================================================
   INIT
============================================================ */
renderNav();
migrateToSharedExerciseWeights().then(()=> backfillPRs()).then(()=>{
  buildMain();
  renderCountdown();
  showView('overview');
  maybeShowOnboarding();
  wireBackupButtons();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
